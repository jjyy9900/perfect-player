  ctx.fillStyle = C.orange;
  ctx.font = '500 13px ' + C.fd;
  ctx.fillText('💬 生涯评价', cardX + 14, y + 8);
  ctx.fillStyle = C.text;
  ctx.font = '500 11px ' + C.fb;
  for (var eli = 0; eli < evalLines.length; eli++) {
    ctx.fillText(evalLines[eli], cardX + 14, y + 30 + eli * 20);
  }
  y += cardH + 6;

  // 8. 水印
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = C.textMuted;
  ctx.font = '400 9px ' + C.fb;
  ctx.fillText('我的完美建模球员  JRs出品', cx, H - 6);

  canvas._corsSafe = true;
  var dataURL = canvas.toDataURL('image/png');
  var pages = [dataURL];
  if (c.retired && c.legacy) {
    pages.push(generateRetirementStoryPosterDataURL(c.legacy));
  }
  if (c.retired && c.legacy) {
    pages.push(generateCareerBiographyPosterDataURL(c.legacy));
  }
  setPosterPages(pages, 0);
}

function stripPosterHtml(text) {
  return String(text || '')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<[^>]*>/g, '')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function buildRetirementStoryPosterSections(r) {
  r = r || calculateLegacyResult();
  var c = STATE.career || {};
  var displayName = (typeof getHupuDisplayName === 'function') ? getHupuDisplayName() : '我的球员';
  var jerseyTeams = Array.isArray(r.jerseyTeams) ? r.jerseyTeams : [];
  var jerseyText = '';
  if (jerseyTeams.length) {
    var first = jerseyTeams[0];
    jerseyText = buildJerseyCeremonyCopy(first);
  } else {
    jerseyText = displayName + '离开球场时，没有球衣被升上屋顶。可有些号码不需要仪式确认，记住它的人会在多年后提起某个夜晚、某个回合、某次沉默的掌声。';
  }

  return [
    {
      title: '退役发言',
      kicker: 'Final Words',
      text: buildRetirementCopy(r)
    },
    {
      title: '退役球衣',
      kicker: 'Jersey Ceremony',
      text: jerseyText
    },
    {
      title: '名人堂',
      kicker: 'Hall of Fame',
      text: buildHofCopy(r)
    },
    {
      title: '历史百大',
      kicker: 'All-Time Top 100',
      text: buildTop100Copy(r)
    }
  ].map(function(section) {
    section.text = stripPosterHtml(section.text);
    return section;
  });
}

function getRetirementPosterLines(ctx, text, maxW, font) {
  ctx.font = font;
  var rawLines = String(text || '').split('\n');
  var lines = [];
  for (var i = 0; i < rawLines.length; i++) {
    var piece = rawLines[i].trim();
    if (!piece) {
      if (lines.length && lines[lines.length - 1] !== '') lines.push('');
      continue;
    }
    var wrapped = wrapCareerEvaluationText(piece, maxW, ctx);
    for (var j = 0; j < wrapped.length; j++) lines.push(wrapped[j]);
  }
  return lines;
}

function drawRetirementPosterText(ctx, text, x, y, maxW, lineH, maxLines, font, color) {
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  var lines = getRetirementPosterLines(ctx, text, maxW, font);
  if (maxLines && lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    lines[maxLines - 1] = lines[maxLines - 1].replace(/[，。！？；、,.!?;:]*$/, '') + '…';
  }
  for (var li = 0; li < lines.length; li++) {
    if (lines[li]) ctx.fillText(lines[li], x, y + li * lineH);
  }
}

function generateRetirementStoryPosterDataURL(r) {
  var c = STATE.career || {};
  r = r || c.legacy || calculateLegacyResult();
  if (!r) return '';

  var displayName = (typeof getHupuDisplayName === 'function') ? getHupuDisplayName() : '我的球员';
  var seasons = (c.seasons || []).length || (r.seasons || 0);
  var summary = seasons + '年生涯，' + Math.round(r.games || 0) + '场，' + Math.round(r.points || 0) + '分，' + (r.mvp || 0) + '座MVP，' + (r.championships || 0) + '枚总冠军戒指。';
  var C = {
    bg: '#faf5eb', bgCard: '#fffaf2', border: '#ead6bb',
    text: '#2d1f0e', textDim: '#7f6e59', textMuted: '#b49d80',
    orange: '#ff6b35', gold: '#d49a35', seal: '#b94835',
    fd: '"Fredoka","Noto Sans SC",sans-serif',
    fb: '"Nunito","Noto Sans SC",sans-serif'
  };
  var W = 480, cx = W / 2;
  var sections = buildRetirementStoryPosterSections(r);
  var gap = 12, headerH = 138, footerH = 38;
  var bodyFont = '500 11px ' + C.fb, bodyLineH = 20;
  var measureCtx = document.createElement('canvas').getContext('2d');
  var cardMetrics = sections.map(function(section, idx) {
    var cardW = idx % 2 === 0 ? 420 : 392;
    var lines = getRetirementPosterLines(measureCtx, section.text, cardW - 30, bodyFont);
    return { lines: lines, w: cardW, h: Math.max(136, 64 + Math.max(lines.length, 1) * bodyLineH) };
  });
  var H = headerH + footerH + (sections.length - 1) * gap;
  for (var mi = 0; mi < cardMetrics.length; mi++) H += cardMetrics[mi].h;
  H = Math.max(720, H);

  var canvas = document.getElementById('posterCanvas');
  canvas.width = W * POSTER_SCALE;
  canvas.height = H * POSTER_SCALE;
  var ctx = canvas.getContext('2d');
  ctx.scale(POSTER_SCALE, POSTER_SCALE);

  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.strokeStyle = C.border;
  ctx.lineWidth = 1;
  for (var gy = 94; gy < H; gy += 42) {
    ctx.beginPath();
    ctx.moveTo(24, gy);
    ctx.lineTo(W - 24, gy);
    ctx.stroke();
  }
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = C.gold;
  ctx.beginPath();
  ctx.arc(cx, 82, 126, Math.PI * 0.08, Math.PI * 0.92);
  ctx.stroke();
  ctx.restore();

  if (_hupuLogo) {
    ctx.save();
    ctx.drawImage(_hupuLogo, W - 42, 16, 28, 28);
    ctx.restore();
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = C.textMuted;
  ctx.font = '700 10px ' + C.fb;
  ctx.fillText('CAREER ARCHIVE', cx, 20);
  ctx.fillStyle = C.text;
  ctx.font = '900 34px ' + C.fd;
  ctx.fillText(displayName, cx, 42);

  ctx.fillStyle = C.bgCard;
  roundRectC(ctx, 34, 94, W - 68, 28, 14); ctx.fill();
  ctx.strokeStyle = C.border;
  ctx.lineWidth = 1;
  roundRectC(ctx, 34, 94, W - 68, 28, 14); ctx.stroke();
  ctx.fillStyle = C.textDim;
  ctx.font = '500 10px ' + C.fb;
  ctx.fillText('生涯小结：' + summary, cx, 102);

  var y = headerH;
  for (var si = 0; si < sections.length; si++) {
    var section = sections[si];
    var metric = cardMetrics[si];
    var cardH = metric.h;
    var cardW = metric.w;
    var cardX = si % 2 === 0 ? 18 : W - cardW - 18;
    var nodeX = si % 2 === 0 ? cardX + cardW + 11 : cardX - 11;

    ctx.save();
    ctx.globalAlpha = 0.72;
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(nodeX, y - 6);
    ctx.lineTo(nodeX, y + cardH + 6);
    ctx.stroke();
    ctx.fillStyle = C.bg;
    ctx.beginPath();
    ctx.arc(nodeX, y + 31, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = C.bgCard;
    roundRectC(ctx, cardX, y, cardW, cardH, 12); ctx.fill();
    ctx.strokeStyle = C.border;
    ctx.lineWidth = 1.2;
    roundRectC(ctx, cardX, y, cardW, cardH, 12); ctx.stroke();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = C.orange;
    ctx.font = '800 14px ' + C.fd;
    ctx.fillText(section.title, cardX + 14, y + 12);
    ctx.fillStyle = C.textMuted;
    ctx.font = '700 8px ' + C.fb;
    ctx.textAlign = 'right';
    ctx.fillText(section.kicker.toUpperCase(), cardX + cardW - 14, y + 16);

    if (si === 0 || si === 3) {
      ctx.save();
      ctx.globalAlpha = 0.08;
      ctx.strokeStyle = C.seal;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cardX + cardW - 44, y + cardH - 42, 28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.font = '800 16px ' + C.fd;
      ctx.textAlign = 'center';
      ctx.fillStyle = C.seal;
      ctx.fillText(si === 0 ? '终章' : '史册', cardX + cardW - 44, y + cardH - 51);
      ctx.restore();
    }

    drawRetirementPosterText(ctx, section.text, cardX + 15, y + 44, cardW - 30, bodyLineH, null, bodyFont, C.text);
    y += cardH + gap;
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = C.textMuted;
  ctx.font = '400 9px ' + C.fb;
  ctx.fillText('我的完美建模球员  JRs出品', cx, H - 10);

  canvas._corsSafe = true;
  return canvas.toDataURL('image/png');
}

function generateRetirementStoryPoster() {
  var dataURL = generateRetirementStoryPosterDataURL();
  if (dataURL) setPosterPages([dataURL], 0);
}

// ── 关闭海报 ──
function closePoster() {
  document.getElementById('posterOverlay').style.display = 'none';
  if (STATE && STATE.career && STATE.career.retired) {
    if (STATE.career.flags && STATE.career.flags.postCareerDeferred) showCareerStats(1);
    else startPostCareerFlow();
  }
}

function getBranchEventById(id) {
  var source = getBranchEventSource();
  for (var i = 0; i < source.length; i++) {
    if (source[i].id === id) return source[i];
  }
  return null;
}

function startPostCareerFlow() {
  if (!STATE.career || !STATE.career.retired) return;
  STATE.career.flags = STATE.career.flags || {};
  STATE._postCareerScenePage = 0;
  STATE._postCareerEvent = null;
  if (getBranchNode('post_career') === 'start' && !STATE.career.flags.postCareerDone) {
    askSimulateFirstSummer();
    return;
  }
  showNextPostCareerEvent();
}

function askSimulateFirstSummer() {
  var existing = document.getElementById('first-summer-modal');
  if (existing) existing.remove();
  var html = '<div class="team-picker-overlay" id="first-summer-modal">';
  html += '<div class="team-picker-modal">';
  html += '<div class="team-picker-header"><span>🏁 退役后的第一个夏天</span></div>';
  html += '<div style="padding:14px;">';
  html += '<div style="font-size:13px;color:var(--text-dim);line-height:1.65;margin-bottom:14px;">你从更衣室搬出行李，站在停车场里，第一次不知道明天该去哪个球馆。手机响了一整天，大家都在问你接下来想做什么。<br><br>要模拟这段退役后的夏天吗？</div>';
  html += '<button class="btn btn-primary btn-sm" style="width:100%;margin-bottom:8px;" onclick="confirmStartPostCareer()">开始模拟</button>';
  html += '<button class="btn btn-secondary btn-sm" style="width:100%;" onclick="declinePostCareerForNow()">暂不模拟</button>';
  html += '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

function confirmStartPostCareer() {
  var modal = document.getElementById('first-summer-modal');
  if (modal) modal.remove();
  STATE.career.flags = STATE.career.flags || {};
  STATE.career.flags.postCareerDeferred = false;
  showNextPostCareerEvent();
}

function declinePostCareerForNow() {
  var modal = document.getElementById('first-summer-modal');
  if (modal) modal.remove();
  STATE.career.flags = STATE.career.flags || {};
  STATE.career.flags.postCareerDeferred = true;
  showCareerStats(1);
}

function showNextPostCareerEvent() {
  var node = getBranchNode('post_career');
  var id = '';
  if (node === 'start') id = 'post_career_opening';
  else if (node === 'gap_year') id = 'post_career_gap_return';
  else if (node === 'post_career_map') id = 'post_career_map';
  else if (node === 'commentator' || node === 'assistant_coach' || node === 'head_coach' || node === 'team_owner' || node === 'youth_academy' || node === 'china_consultant' || node === 'agency_partner' || node === 'freelancer') id = 'post_career_first_year';
  else if (node === 'low_key' || node === 'identity_settled' || node === 'identity_adjusted' || node === 'identity_voice') {
    finishPostCareer();
    return;
  }
  var ev = id ? getBranchEventById(id) : null;
  if (!ev) { finishPostCareer(); return; }
  STATE._postCareerEvent = ev;
  STATE._postCareerScenePage = 0;
  showPostCareerEventModal(ev);
}

function showPostCareerEventModal(ev) {
  var existing = document.getElementById('post-career-modal');
  if (existing) existing.remove();
  var scenes = ev.scenes || [];
  var sceneIdx = STATE._postCareerScenePage || 0;
  var title = getPlayerFacingBranchTitle(ev.title);
  var html = '<div class="team-picker-overlay" id="post-career-modal">';
  html += '<div class="team-picker-modal">';
  html += '<div class="team-picker-header"><span>' + title + '</span></div>';
  html += '<div style="padding:14px 14px 8px;">';
  if (scenes.length && sceneIdx < scenes.length) {
    html += '<div style="font-size:11px;color:var(--orange);font-weight:700;margin-bottom:6px;">剧情</div>';
    html += '<div style="font-size:13px;color:var(--text-dim);line-height:1.65;margin-bottom:14px;">' + fillBranchEventText(scenes[sceneIdx]) + '</div>';
    html += '<button class="btn btn-primary btn-sm" style="width:100%;" onclick="continuePostCareerScene()">继续</button>';
  } else {
    html += '<div style="font-size:11px;color:var(--orange);font-weight:700;margin-bottom:6px;">重点</div>';
    html += '<div style="font-size:13px;color:var(--text-dim);line-height:1.55;margin-bottom:12px;">' + sanitizePlayerFacingText(fillBranchEventText(ev.body)) + '</div>';
    html += '<div style="font-size:11px;color:var(--orange);font-weight:700;margin-bottom:6px;">选择</div>';

// ── OSS 上传 ──
function dataURLToBlob(dataURL) {
  var parts = dataURL.split(',');
  var mime = parts[0].match(/:(.*?);/)[1];
  var bytes = atob(parts[1]);
  var ab = new ArrayBuffer(bytes.length);
  var ia = new Uint8Array(ab);
  for (var i = 0; i < bytes.length; i++) ia[i] = bytes.charCodeAt(i);
  return new Blob([ab], { type: mime });
}

function uploadToOSS(file, filename) {
  return new Promise(function(resolve, reject) {
    // 方案1: ColorboxAI
    if (window.ColorboxAI && window.ColorboxAI.oss && typeof window.ColorboxAI.oss.uploadFile === 'function') {
      window.ColorboxAI.oss.uploadFile({ file: file, filename: filename })
        .then(function(res) { resolve(res.downloadUrl || ''); })
        .catch(reject);
      return;
    }
    // 方案2: postMessage Bridge
    if (window.parent && window.parent !== window) {
      var callbackId = '_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      var timer = setTimeout(function() { cleanup(); reject(new Error('上传超时')); }, 30000);
      var handler = function(e) {
        var d = e.data;
        if (d && d.protocol === 'colorbox-ai-bridge' && d.type === 'oss.upload.callback' && d.payload && d.payload.callbackId === callbackId) {
          clearTimeout(timer); cleanup();
          d.payload.error ? reject(new Error(d.payload.error)) : resolve(d.payload.downloadUrl || '');
        }
      };
      var cleanup = function() { window.removeEventListener('message', handler); };
      window.addEventListener('message', handler);
      window.parent.postMessage({
        protocol: 'colorbox-ai-bridge', version: 1, direction: 'frame-to-host',
        type: 'oss.upload',
        payload: { file: file, filename: filename, callbackId: callbackId }
      }, '*');
      return;
    }
    // 方案3: 直连 KaleidoOSS
    var client = getOssClient();
    if (client) {
      var ext = filename.lastIndexOf('.') >= 0 ? filename.slice(filename.lastIndexOf('.')) : '.png';
      var now = new Date();
      var key = 'user-upload/' + (now.getFullYear() % 100) + (now.getMonth() + 1) + now.getDate() + '-' + Math.random().toString(36).slice(-6) + ext;
      client.multipartUpload(key, file, {})
        .then(function(res) { resolve(res.downloadUrl || 'https://activity-static.hoopchina.com.cn/' + res.name); })
        .catch(reject);
      return;
    }
    reject(new Error('No upload capability'));
  });
}

function safeNavigate(url, target) {
  if (window.ColorboxAI && typeof window.ColorboxAI.navigateTo === 'function') {
    try { window.ColorboxAI.navigateTo(url, target || '_blank'); return; } catch(e) {}
  }
  if (window.ColorboxAI && typeof window.ColorboxAI.openUrl === 'function') {
    try { window.ColorboxAI.openUrl(url); return; } catch(e) {}
  }
}

async function sharePoster(btn) {
  trackEvent({act:"click",blk:"BMC098",pos:"TC14",label:"一键发帖"});
  var dataURLs = (window._posterDataURLs && window._posterDataURLs.length) ? window._posterDataURLs : [window._posterDataURL];
  dataURLs = dataURLs.filter(function(url) { return !!url; });
  if (!dataURLs.length) return;

  var origText = btn.innerHTML;
  btn.innerHTML = '⏳ 上传中...';

  try {
    var imageList = [];

      if (blob.size === 0) { alert('海报图片为空'); return; }
      var filename = 'buildplayer_' + Date.now() + '_' + (i + 1) + '.png';
      var imageUrl = await uploadToOSS(blob, filename);
      if (imageUrl) imageList.push(imageUrl);
    }
    var initialValue = {
      syncPost: true,
      appJsonV3: {
        activeTab: 'thread',

          title: '',

        }

    };

    var postUrl = 'huputiyu://bbs/postImg?tagName=' + encodeURIComponent(POSTER_TAG_NAME) +
      '&tagId=' + POSTER_TAG_ID +
      '&topicName=' + encodeURIComponent(POSTER_TOPIC_NAME) +
      '&topicId=' + POSTER_TOPIC_ID +
      '&initialValue=' + encodeURIComponent(JSON.stringify(initialValue));
    safeNavigate(postUrl, '_self');
    closePoster();
  } catch (e) {
    console.warn('上传失败, 降级为纯文字发帖', e);
    var fallback = {
      syncPost: true,
      appJsonV3: {
        activeTab: 'thread',
        data: { title: '', imageList: [], content: '' }
      }
    };
    var fallbackUrl = 'huputiyu://bbs/postImg?tagName=' + encodeURIComponent(POSTER_TAG_NAME) +
      '&tagId=' + POSTER_TAG_ID +
      '&topicName=' + encodeURIComponent(POSTER_TOPIC_NAME) +
      '&topicId=' + POSTER_TOPIC_ID +
      '&initialValue=' + encodeURIComponent(JSON.stringify(fallback));
    safeNavigate(fallbackUrl, '_self');
    closePoster();
  } finally {
    btn.innerHTML = origText;
    btn.disabled = false;
  }
}

// ============================================================
const STORAGE_KEY = 'achievements';
const STORAGE_VERSION = '1.1';  // 递增此版本号以触发向下迁移

let _cache = null;

/** 默认数据结构（新用户首次写入时使用） */
function getDefaultData() {
  return {
    meta: {
      version: STORAGE_VERSION,
      updatedAt: null,
    },
    championTeams: [],            // ['LAL', 'BOS', ...] 已夺冠球队代码列表
    championships: [],             // 每次夺冠的详细记录
  };
}

/**
 * 读取数据
 * 优先内存缓存，其次 ColorboxAI.storage
 */
function loadData(cb) {
  if (_cache) { cb(_cache); return; }
  if (typeof ColorboxAI !== 'undefined' && ColorboxAI.storage) {
    ColorboxAI.storage.getValue(STORAGE_KEY).then(function(raw) {
      var data = safeParse(raw);
      data = migrateData(data);
      _cache = data;
      cb(data);
    }).catch(function() {
      _cache = getDefaultData();
      cb(_cache);
    });
  } else {
    _cache = getDefaultData();
    cb(_cache);
  }
}

/**
 * 写入数据
 * 自动更新 meta.version + meta.updatedAt
 */
function saveData(data, cb) {
  data.meta = data.meta || {};
  data.meta.version = STORAGE_VERSION;
  data.meta.updatedAt = Date.now();
  _cache = data;
  if (typeof ColorboxAI !== 'undefined' && ColorboxAI.storage) {
    ColorboxAI.storage.setValue({ [STORAGE_KEY]: data }).then(function() {
      if (cb) cb();
    }).catch(function() {
      if (cb) cb();
    });
  } else {
    if (cb) cb();
  }
}

/**
 * 安全解析原始数据
 * 兼容：null / 对象 / JSON 字符串 / 旧版无 meta 结构
 */
function safeParse(raw) {
  if (!raw) return getDefaultData();
  var data;
  if (typeof raw === 'object' && !Array.isArray(raw)) {
    data = raw;
  } else {
    try { data = JSON.parse(raw); } catch(e) { return getDefaultData(); }
  }
  // 确保必填字段存在
  if (!data.championTeams) data.championTeams = [];
  if (!data.championships) data.championships = [];
  if (!data.meta) data.meta = {};
  return data;
}

/**
 * 版本迁移：从旧版结构平移到新版
 * 如需新增字段或变更结构，在这里追加迁移分支
 */
function migrateData(data) {
  var v = data.meta && data.meta.version;
  if (v === STORAGE_VERSION) return data; // 已是最新

  // v1.0 → v1.1: 添加 meta 字段
  if (!v || v === '1.0') {
    if (!data.meta) data.meta = {};
    // v1.0 的 championships 可能没有 gameId 字段，这是可选的，不阻塞
    data.meta.migratedFrom = v || 'unknown';
  }

  // 后续版本迁移在此追加 else if 链
  // if (v === '1.1') { ... } → v1.2

  data.meta.version = STORAGE_VERSION;
  return data;
}

// ============================================================
// ④ 征服联盟模块
// ============================================================
const CONQUEST = {
  /** 检测当前是否新夺冠，是则记录 */
  check: function() {
    // 依赖主游戏的 STATE
    if (typeof STATE === 'undefined') return;
    if (!STATE.season || !STATE.season.isChampion) return;
    if (!STATE.careerTeam) return;

    var team = STATE.careerTeam;
    loadData(function(data) {
      var po = STATE.season.playoffStats || {};
      var gp = po.games || 1;
      var ps = STATE.season.playerStats || {};
      var pg = ps.games || 1;
      
      // ★ championships 永远追加（记录每一次夺冠详情）
      var isFirst = data.championTeams.indexOf(team) === -1;
      if (isFirst) data.championTeams.push(team);

      function calcAvg(src, field, games) {
        return Math.round((src[field] || 0) / games * 10) / 10;
      }
      function calcPct(src, made, att) {
        var m = src[made] || 0, a = src[att] || 0;
        return a > 0 ? Math.round(m / a * 1000) / 10 : 0;
      }

      var attrsCopy = {};
      if (STATE.attrs) {
        for (var k in STATE.attrs) {
          if (STATE.attrs.hasOwnProperty(k)) attrsCopy[k] = STATE.attrs[k];
        }
      }

      data.championships.push({
        gameId: STATE.gameId || null,
        team: team,
        wonAt: Date.now(),
        ovr: STATE.finalOVR || 0,
        position: STATE.position || null,
        record: (STATE.season.wins || 0) + '-' + (STATE.season.losses || 0),
        archetype: STATE.finalArchetype || null,
        attrs: attrsCopy,
        avgStats: {
          pts: calcAvg(ps, 'pts', pg),
          reb: calcAvg(ps, 'reb', pg),
          ast: calcAvg(ps, 'ast', pg),
          stl: calcAvg(ps, 'stl', pg),
          blk: calcAvg(ps, 'blk', pg),
          tov: calcAvg(ps, 'tov', pg),
          fgm: calcAvg(ps, 'fgm', pg),
          fga: calcAvg(ps, 'fga', pg),
          threeM: calcAvg(ps, 'threeM', pg),
          threeA: calcAvg(ps, 'threeA', pg),
          ftm: calcAvg(ps, 'ftm', pg),
          fta: calcAvg(ps, 'fta', pg),
        },
        playoffAvg: {
          pts: calcAvg(po, 'pts', gp),
          reb: calcAvg(po, 'reb', gp),
          ast: calcAvg(po, 'ast', gp),
          stl: calcAvg(po, 'stl', gp),
          blk: calcAvg(po, 'blk', gp),
          tov: calcAvg(po, 'tov', gp),
          fgm: calcAvg(po, 'fgm', gp),
          fga: calcAvg(po, 'fga', gp),
          threeM: calcAvg(po, 'threeM', gp),
          threeA: calcAvg(po, 'threeA', gp),
          ftm: calcAvg(po, 'ftm', gp),
          fta: calcAvg(po, 'fta', gp),
        },
      });

      saveData(data, function() {
        var total = data.championTeams.length;
        var cn = getTeamCN(team);
        if (isFirst) {
          showToast('🏆 首次带领 ' + cn + ' 夺冠！(' + total + '/30)');
          // 里程碑检测
          var milestones = {1:'征途开始',5:'联盟震动',10:'势力扩张',15:'半壁江山',20:'所向披靡',25:'仅剩5队',30:'联盟征服者！'};
          if (milestones[total]) {
            setTimeout(function() {
              var msg = '🎉 ' + milestones[total];
              if (total === 30) msg += ' 🏆🏆🏆';
              showToast(msg);
            }, 1200);
          }
        } else {
          showToast('🏆 ' + cn + ' 再夺冠！(第 ' + data.championTeams.length + ' 队)');
        }
      });
    });
  },

  /** 打开征服联盟荣誉墙 */
  show: function() {
    if (typeof showScreen === 'function') {
      showScreen('screen-achievements');
    }
    renderConquestWall();
  },
};

/** 获取球队中文名 */
function getTeamCN(team) {
  if (typeof SIM_CONFIG !== 'undefined' && SIM_CONFIG.TEAM_NAMES && SIM_CONFIG.TEAM_NAMES[team]) {
    return SIM_CONFIG.TEAM_NAMES[team];
  }
  return team;
}

/** 获取球队 logo HTML */
function getTeamLogoHTML(team, size) {
  size = size || 28;
  if (typeof TEAM_LOGOS !== 'undefined' && TEAM_LOGOS[team]) {
    return '<img class="cq-logo" src="' + TEAM_LOGOS[team] + '" style="width:' + size + 'px;height:' + size + 'px;" alt="' + team + '">';
  }
  return '<span style="width:' + size + 'px;height:' + size + 'px;display:inline-block;border-radius:4px;background:var(--border);"></span>';
}

// ============================================================
// ⑤ UI 渲染
// ============================================================

/** 渲染征服联盟荣誉墙 */
function renderConquestWall() {
  loadData(function(data) {
    var championTeams = data.championTeams || [];
    var total = championTeams.length;
    var container = document.getElementById('ach-wall-content');
    if (!container) return;

    var teamChampsMap = {};
    (data.championships || []).forEach(function(c) {
      if (!teamChampsMap[c.team]) teamChampsMap[c.team] = [];
      teamChampsMap[c.team].push(c);
    });

    var pct = Math.round(total / 30 * 100);
    var html = '';
    function ad(i) { return (i * 0.1).toFixed(2) + 's'; }

    // ── 顶部王冠 ──
    html += '<div class="cq-hero" style="animation-delay:' + ad(0) + '">';
    html += '  <div class="cq-hero-crown">👑</div>';
    html += '  <div class="cq-hero-title">征服联盟</div>';
    html += '  <div class="cq-hero-sub">Conquer the League</div>';
    html += '</div>';

    // ── 进度勋章区 ──
    html += '<div class="cq-trophy-case" style="animation-delay:' + ad(1) + '">';
    html += '  <div class="cq-trophy-stat">';
    html += '    <span class="cq-trophy-num">' + total + '</span>';
    html += '    <span class="cq-trophy-lbl">已征服</span>';
    html += '  </div>';
    html += '  <div class="cq-trophy-divider">✦</div>';
    html += '  <div class="cq-trophy-stat">';
    html += '    <span class="cq-trophy-num">30</span>';
    html += '    <span class="cq-trophy-lbl">总目标</span>';
    html += '  </div>';
    html += '  <div class="cq-trophy-divider">✦</div>';
    html += '  <div class="cq-trophy-stat">';
    html += '    <span class="cq-trophy-num">' + (30 - total) + '</span>';
    html += '    <span class="cq-trophy-lbl">剩余</span>';
    html += '  </div>';
    html += '</div>';

    // ── 进度条 ──
    html += '<div class="cq-progress-section" style="animation-delay:' + ad(2) + '">';
    html += '  <div class="cq-progress-track">';
    html += '    <div class="cq-progress-fill" style="width:' + pct + '%"></div>';
    html += '    <div class="cq-progress-marker" style="left:' + pct + '%">' + pct + '%</div>';
    html += '  </div>';
    html += '</div>';

    // ── 联盟面板 ──
    var confIdx = 0;
    for (var confKey in CONQUEST_CONFERENCES) {
      var conf = CONQUEST_CONFERENCES[confKey];
      var confTeams = [];
      var confWon = 0;
      conf.divisions.forEach(function(d) {
        d.teams.forEach(function(t) {
          confTeams.push(t);
          if (championTeams.indexOf(t) !== -1) confWon++;
        });
      });

      html += '<div class="cq-conf-panel" style="animation-delay:' + ad(confIdx + 3) + '">';
      html += '  <div class="cq-conf-ribbon">';
      html += '    <span class="cq-conf-name">' + conf.name + '</span>';
      html += '    <span class="cq-conf-progress">' + confWon + '/' + confTeams.length + '</span>';
      html += '  </div>';
      html += '  <div class="cq-conf-teams-wrap">';
      html += '    <div class="cq-div-teams">';

      for (var t = 0; t < confTeams.length; t++) {
        var team = confTeams[t];
        var hasWon = championTeams.indexOf(team) !== -1;
        var champs = teamChampsMap[team];
        var teamCN = getTeamCN(team);

        html += '    <div class="cq-tile' + (hasWon ? ' cq-tile-won' : ' cq-tile-empty') + '"';
        if (hasWon && champs) {
          html += ' onclick="showConquestDetail(\'' + team + '\')" title="点击查看详情"';
        }
        html += '>';
        html += '      <div class="cq-tile-bg"></div>';
        html += '      <div class="cq-tile-logo">' + getTeamLogoHTML(team, hasWon ? 34 : 24) + '</div>';
        html += '      <div class="cq-tile-code">' + team + '</div>';
        if (hasWon) {
          html += '      <div class="cq-tile-name">' + teamCN + '</div>';
        }
        html += '    </div>';
      }

      html += '    </div>'; // cq-div-teams
      html += '  </div>'; // cq-conf-teams-wrap
      html += '</div>'; // cq-conf-panel
      confIdx++;
    }

    // ── 底部 ──
    html += '<div class="cq-footer" style="animation-delay:' + ad(5) + '">';
    html += '  <div class="cq-footer-row">';
    html += '    <button class="cq-back-btn" onclick="closeAchievements()"><span class="cq-back-arrow">◀</span> 返回</button>';
    html += '  </div>';
    html += '</div>';

    container.innerHTML = html;
  });
}

/** 展示某队的夺冠详情 — 列表 → 点击展开 */
function showConquestDetail(teamCode) {
  loadData(function(data) {
    var champs = (data.championships || []).filter(function(c) { return c.team === teamCode; });
    if (champs.length === 0) return;

    var container = document.getElementById('ach-wall-content');
    if (!container) return;

    var cn = getTeamCN(teamCode);
    var logoHtml = getTeamLogoHTML(teamCode, 40);
    var html = '';

    // 返回
    html += '<div class="cq-detail-back" style="animation-delay:0s">';
    html += '  <button class="cq-back-btn" onclick="renderConquestWall()"><span class="cq-back-arrow">◀</span> 荣誉墙</button>';
    html += '</div>';

    // 球队头部
    html += '<div class="cq-list-header" style="animation-delay:0.05s">';
    html += '  <div class="cq-list-header-logo">' + logoHtml + '</div>';
    html += '  <div class="cq-list-header-info">';
    html += '    <div class="cq-list-header-name">' + cn + '</div>';
    html += '    <div class="cq-list-header-sub">' + teamCode + ' · 共 ' + champs.length + ' 次夺冠</div>';
    html += '  </div>';
    html += '</div>';

    // 列表
    champs.forEach(function(c, i) {
      var dateStr = new Date(c.wonAt).toLocaleDateString();
      var ovrGrade = getOvrGrade ? getOvrGrade(c.ovr) : '';

      html += '<div class="cq-list-item" style="animation-delay:' + (0.1 + i * 0.06) + 's" onclick="showConquestDetailExpanded(\'' + teamCode + '\', ' + i + ')">';
      html += '  <div class="cq-list-item-badge">第' + (i + 1) + '冠</div>';
      html += '  <div class="cq-list-item-main">';
      html += '    <div class="cq-list-item-row">';
      html += '      <span class="cq-li-ovr">OVR ' + (c.ovr || '?') + '</span>';
      if (c.position) html += '      <span class="cq-li-pos">' + c.position + '</span>';
      html += '      <span class="cq-li-rec">' + (c.record || '?') + '</span>';
      html += '    </div>';
      html += '    <div class="cq-list-item-row cq-li-sub">';
      html += '      <span>📊 ' + c.avgStats.pts + '分 ' + c.avgStats.reb + '板 ' + c.avgStats.ast + '助</span>';
      html += '      <span class="cq-li-date">' + dateStr + '</span>';
      html += '    </div>';
      html += '  </div>';
      html += '  <div class="cq-list-item-arrow">›</div>';
      html += '</div>';
    });

    container.innerHTML = html;
  });
}

    var c = champs[champIdx];

    var container = document.getElementById('ach-wall-content');
    if (!container) return;

    var cn = getTeamCN(teamCode);
    var posName = (typeof SIM_CONFIG !== 'undefined' && SIM_CONFIG.POSITIONS) ? (SIM_CONFIG.POSITIONS[c.position] || c.position) : c.position;
    var html = '';

    // ── 返回 ──

    html += '  </div>';

    // 最终属性
    if (c.attrs && typeof ATTR_KEYS !== 'undefined') {
      html += '  <div class="sr-section" style="animation-delay:0.25s">';
      html += '    <div class="sr-section-title">🏷️ 最终属性</div>';
      html += '    <div class="mc-attrs">';
      ATTR_KEYS.forEach(function(k) {
        var val = c.attrs[k] || 50;
        var g = typeof getGrade === 'function' ? getGrade(val) : { letter: Math.round(val / 10), color: '#d4af37' };
        html += '      <div class="mc-attr"><span class="mc-alabel">' + attrCN(k) + '</span><span class="mc-aval" style="color:' + g.color + '">' + g.letter + '</span></div>';
      });
      html += '    </div>';
      html += '  </div>';
    }

    html += '</div>'; // sr-page

    container.innerHTML = html;
  });
}

/** Toast 通知 — 金牌弹出 */
function showToast(msg) {
  var existing = document.querySelector('.cq-toast');
  if (existing) {
    existing.remove();
    clearTimeout(existing._timer);
  }

  var el = document.createElement('div');
  el.className = 'cq-toast';
  el.innerHTML = msg;
  document.body.appendChild(el);

  el._timer = setTimeout(function() {
    el.classList.add('cq-toast-out');
    setTimeout(function() {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 400);
  }, 2800);
}

/** 关闭成就页 */
function closeAchievements() {
  if (typeof showScreen === 'function') {
    if (typeof STATE !== 'undefined' && STATE.season && STATE.season.isChampion) {
      if (typeof showSeasonResults === 'function') {
        showSeasonResults();
        return;
      }
    }
    showScreen('screen-menu');
  }
}

/** 生成征服联盟海报：我已经点亮 X/30 支球队 */
function generateConquestPoster() {
  loadData(function(data) {
    var championTeams = data.championTeams || [];
    var total = championTeams.length;
    var pct = Math.round(total / 30 * 100);

    // ── 颜色 ──
    var Cc = {
      bg: '#faf5eb', card: '#fffaf2', border: '#f0e0cc',
      text: '#2d1f0e', textDim: '#8a7a66', textMuted: '#baa992',
      gold: '#d4af37', goldLight: '#f5d060',
      green: '#2ec4b6',
      fd: '"Fredoka","Noto Sans SC",sans-serif',
      fb: '"Nunito","Noto Sans SC",sans-serif',
    };

    var W = 600;
    var PAD = 20;
    var cx = W / 2;

    // 计算高度（每个联盟 28px 标题 + 3行×48px）
    var gridH = 0;
    for (var confKey in CONQUEST_CONFERENCES) {
      gridH += 28 + 3 * 48;
    }
    var H = 40 + 44 + 32 + 20 + gridH + 30 + 20; // header + title + progress + gap + grid + footer + pad

    var canvas = document.getElementById('posterCanvas');
    if (!canvas) return;
    canvas.width = W * 2;
    canvas.height = H * 2;
    var ctx = canvas.getContext('2d');
    ctx.scale(2, 2);

    // ── 背景 ──
    ctx.fillStyle = Cc.bg;
    ctx.fillRect(0, 0, W, H);

    // 噪点纹理叠加
    ctx.save();
    ctx.globalAlpha = 0.03;
    for (var i = 0; i < 200; i++) {
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.random() * W, Math.random() * H, 1, 1);
    }
    ctx.restore();

    // ── Header: 👑 征服联盟 ──
    var y = 24;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = '32px ' + Cc.fd;
    ctx.fillStyle = Cc.gold;
    ctx.fillText('👑', cx, y);
    y += 40;

    // 渐变金字标题
    var grad = ctx.createLinearGradient(cx - 80, 0, cx + 80, 0);
    grad.addColorStop(0, Cc.gold);
    grad.addColorStop(0.5, Cc.goldLight);
    grad.addColorStop(1, Cc.gold);
    ctx.fillStyle = grad;
    ctx.font = '800 26px ' + Cc.fd;
    ctx.fillText('征 服 联 盟', cx, y);
    y += 30;

    ctx.fillStyle = Cc.textDim;
    ctx.font = '500 11px ' + Cc.fd;
    ctx.fillText('CONQUER THE LEAGUE', cx, y);
    y += 22;

    // ── 分隔装饰线 ──
    ctx.strokeStyle = 'rgba(212,175,55,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - 80, y);
    ctx.lineTo(cx + 80, y);
    ctx.stroke();
    y += 12;

    // ── 主标题: "我已经点亮" ──
    ctx.fillStyle = Cc.text;
    ctx.font = '600 18px ' + Cc.fb;
    ctx.fillText('我已经点亮', cx, y);
    y += 28;

    // 数字部分
    ctx.fillStyle = Cc.gold;
    ctx.font = '800 38px ' + Cc.fd;
    ctx.fillText(total + ' / 30', cx, y);
    y += 34;

    ctx.fillStyle = Cc.textDim;
    ctx.font = '500 12px ' + Cc.fd;
    ctx.fillText('支 球 队', cx, y);
    y += 14;

    // ── 进度条 ──
    var barW = 360, barH = 14, barX = cx - barW / 2;
    y += 4;
    ctx.fillStyle = Cc.border;
    roundRectC(ctx, barX, y, barW, barH, 7);
    ctx.fill();
    var gradBar = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    gradBar.addColorStop(0, Cc.gold);
    gradBar.addColorStop(0.5, Cc.goldLight);
    gradBar.addColorStop(1, Cc.gold);
    ctx.fillStyle = gradBar;
    var fillW = Math.max(4, barW * total / 30);
    roundRectC(ctx, barX, y, fillW, barH, 7);
    ctx.fill();
    // 百分比文字
    ctx.fillStyle = '#fff';
    ctx.font = '700 8px ' + Cc.fd;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pct + '%', barX + fillW / 2, y + barH / 2);
    ctx.textBaseline = 'top';
    y += barH + 16;

    // ── 球队网格 ──
    var cellW = Math.floor((W - PAD * 2) / 5);
    var logoSize = 32;
    var cellPad = Math.floor((cellW - logoSize) / 2);

    for (var confKey in CONQUEST_CONFERENCES) {
      var conf = CONQUEST_CONFERENCES[confKey];

      // 收集该联盟所有球队
      var confTeams = [];
      var confWon = 0;
      conf.divisions.forEach(function(d) {
        d.teams.forEach(function(t) {
          confTeams.push(t);
          if (championTeams.indexOf(t) !== -1) confWon++;
        });
      });

      // Conf 标题带
      ctx.fillStyle = 'rgba(212,175,55,0.06)';
      roundRectC(ctx, PAD, y, W - PAD * 2, 24, 6);
      ctx.fill();
      ctx.fillStyle = Cc.text;
      ctx.font = '700 12px ' + Cc.fd;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(conf.name, PAD + 10, y + 12);

      // 右边计数
      ctx.fillStyle = Cc.gold;
      ctx.textAlign = 'right';
      ctx.font = '600 11px ' + Cc.fd;
      ctx.fillText(confWon + '/' + confTeams.length, W - PAD - 10, y + 12);
      ctx.textBaseline = 'top';
      y += 28;

      // 15 队分 3 行，每行 5 队
      for (var row = 0; row < 3; row++) {
        for (var col = 0; col < 5; col++) {
          var idx = row * 5 + col;
          if (idx >= confTeams.length) break;
          var team = confTeams[idx];
          var hasWon = championTeams.indexOf(team) !== -1;
          var tx = PAD + col * cellW + cellPad;
          var ty = y;

          if (hasWon) {
            ctx.fillStyle = 'rgba(212,175,55,0.07)';
            roundRectC(ctx, PAD + col * cellW + 2, ty - 2, cellW - 4, logoSize + 8, 8);
            ctx.fill();
            ctx.strokeStyle = 'rgba(212,175,55,0.35)';
            ctx.lineWidth = 1;
            roundRectC(ctx, PAD + col * cellW + 2, ty - 2, cellW - 4, logoSize + 8, 8);
            ctx.stroke();

            ctx.fillStyle = Cc.gold;
            ctx.beginPath();
            ctx.arc(tx + logoSize / 2, ty + logoSize / 2, logoSize / 2 + 1, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🏆', tx + logoSize / 2, ty + logoSize / 2);
          } else {
            ctx.strokeStyle = Cc.border;
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            roundRectC(ctx, PAD + col * cellW + 2, ty - 2, cellW - 4, logoSize + 8, 8);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillStyle = hasWon ? Cc.text : Cc.textMuted;
          ctx.font = (hasWon ? '700 ' : '500 ') + '8px ' + Cc.fd;
          ctx.fillText(team, tx + logoSize / 2, ty + logoSize + 4);
        }
        y += logoSize + 16;
      }
    }

    // ── Footer ──
    y += 4;
    ctx.strokeStyle = 'rgba(212,175,55,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - 100, y);
    ctx.lineTo(cx + 100, y);
    ctx.stroke();
    y += 10;

    ctx.fillStyle = Cc.textMuted;
    ctx.font = '400 10px ' + Cc.fb;
    ctx.textAlign = 'center';
    ctx.fillText('BuildPlayer · 征服联盟', cx, y);

    // ── 显示海报 ──
    var dataURL = canvas.toDataURL('image/png');
    var imgEl = document.getElementById('posterPreviewImg');
    if (imgEl) {
      imgEl.src = dataURL;
      imgEl.onload = function() {
        var overlay = document.getElementById('posterOverlay');
        if (overlay) overlay.style.display = 'flex';
      };
    }
  });
}

/** Canvas 圆角矩形辅助 */
function roundRectC(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function archiveTitleSeed(str) {
  var h = 0;
  str = String(str || '');
  for (var i = 0; i < str.length; i++) {
    h = (h * 31 + str.charCodeAt(i)) | 0;
  }
  return Math.abs(h);
}

function getArchiveCareerTitle(entry) {
  var c = entry.career || {};
  var flags = c.flags || {};
  var honors = c.honors || [];
  function cnt(key) {
    return honors.filter(function(h) { return h && (h.label || '').indexOf(key) >= 0; }).length;
  }
  var tags = [];
  if (cnt('总冠军') > 0) tags.push('champion');
  if (cnt('总冠军') >= 3) tags.push('dynasty');
  if (honors.some(function(h) { return h && h.label === 'MVP'; })) tags.push('mvp');
  if (cnt('总决赛MVP') + cnt('FMVP') > 0) tags.push('fmvp');
  if (cnt('DPOY') > 0) tags.push('defense');
  if (cnt('全明星') > 0) tags.push('allstar');
  var ts = c.totalStats || {};
  var gp = Math.max(ts.games || 0, 1);
  var avgPts = (ts.pts || 0) / gp;
  var avgAst = (ts.ast || 0) / gp;
  var avgReb = (ts.reb || 0) / gp;
  if (avgPts >= 25) tags.push('scorer');
  if (avgAst >= 7) tags.push('playmaker');
  if (avgReb >= 10) tags.push('big');
  var seasons = (c.seasons || []).length;
  if (seasons >= 12) tags.push('longevity');
  var teams = [];
  (c.seasons || []).forEach(function(s) { if (s && s.team && teams.indexOf(s.team) < 0) teams.push(s.team); });
  if (teams.length === 1) tags.push('one_city');
  else if (teams.length >= 3) tags.push('multi');
  if (entry.attrs && (entry.attrs.CLU || 0) >= 80) tags.push('clutch');
  var prof = c.profile || {};
  if ((prof.lockerRoomTrust || 0) >= 60 || (prof.leadership || 0) >= 60) tags.push('leader');
  if (flags.campSupport || flags.campSign || flags.campFree || flags.campLesson || flags.studentProdigy || flags.studentHardship || flags.studentRebel || flags.studentQuiet) tags.push('camp');
  var tierLabel = getArchiveTierLabel(entry.legacy || c.legacy);
  if (tierLabel === 'EPIC' || tierLabel === 'LEGEND') tags.push('legacy');
  var scored = CAREER_TITLE_POOL.map(function(item) {
    var score = 0;
    (item.tags || []).forEach(function(t) { if (tags.indexOf(t) >= 0) score += 5; });
    return { item: item, score: score };
  });
  var best = 0;
  scored.forEach(function(s) { if (s.score > best) best = s.score; });
  var pool = scored.filter(function(s) { return s.score >= best - 1; });
  var seed = archiveTitleSeed(String(entry.gameId || '') + '|' + (entry.name || '') + '|' + String(entry.serial || 0));
  return pool[seed % pool.length].item.title;
}

function getArchivePlayerType(c) {
  if (!c) return '球员';
  var honors = c.honors || [];
  function cnt(key) {
    return honors.filter(function(h) { return h && (h.label || '').indexOf(key) >= 0; }).length;
  }
  var championships = cnt('总冠军');
  var mvp = honors.filter(function(h) { return h && h.label === 'MVP'; }).length;
  var dpoy = cnt('DPOY');
  var allNBA = cnt('最佳阵容');
  var ts = c.totalStats || {};
  var gp = Math.max(ts.games || 0, 1);
  var avgPts = (ts.pts || 0) / gp;
  var avgAst = (ts.ast || 0) / gp;
  var teams = [];
  (c.seasons || []).forEach(function(s) { if (s && s.team && teams.indexOf(s.team) < 0) teams.push(s.team); });
  if (dpoy >= Math.max(1, mvp) && dpoy > 0) return '防守图腾';
  if (championships >= 3) return '王朝基石';
  if (avgPts >= 25) return '得分机器';
  if (avgAst >= 7) return '组织核心';
  if (championships === 0 && allNBA >= 3) return '无冕英雄';
  if (teams.length >= 3) return '漂泊巨星';
  return '球队基石';
}

function archiveRetiredCareer() {
  var c = STATE.career;
  if (!c || !c.retired || !c.legacy) return Promise.resolve(false);
  c.flags = c.flags || {};
  if (c.flags.careerArchived) return Promise.resolve(false);
  var snap = buildCareerArchiveSnapshot();
  return loadCareerArchive().then(function(list) {
    var maxSerial = 0;
    list.forEach(function(item) { if (item && (item.serial || 0) > maxSerial) maxSerial = item.serial; });
    snap.serial = maxSerial + 1;
    var fullKey = CAREER_ARCHIVE_FULL_PREFIX + snap.serial;
    var raw = JSON.stringify(snap);
    var writes = [writeCompressedEntry(fullKey, raw)];
    var migrated = [];
    var nextLegacySerial = snap.serial;
    list.forEach(function(item) {
      if (!item) return;
      if (item.fullKey) { migrated.push(item); return; }
      // 旧格式档案：完整对象直接存，迁移为独立压缩 key
      var legacySerial = item.serial || (++nextLegacySerial);
      maxSerial = Math.max(maxSerial, legacySerial);
      var legacyKey = CAREER_ARCHIVE_FULL_PREFIX + legacySerial;
      var meta = buildArchiveMeta(item, legacyKey);
      meta.serial = legacySerial;
      migrated.push(meta);
      writes.push(writeCompressedEntry(legacyKey, JSON.stringify(item)));
    });
    return Promise.all(writes).then(function() {
      migrated = migrated.filter(function(item) { return item.gameId !== snap.gameId; });
      migrated.unshift(buildArchiveMeta(snap, fullKey));
      return persistCareerArchive(migrated).then(function(ok) {
        if (ok) c.flags.careerArchived = true;
        return ok;
      });
    });
  });
}

    STATE.finalArchetype = snap.finalArchetype || null;

    HUPU_USER.isLogin = true;
    try { localStorage.removeItem('buildplayer_nickname'); } catch(e) {}
    return fn();
  } finally {
    STATE.career = saved.career;
    STATE.attrs = saved.attrs;
    STATE.finalOVR = saved.finalOVR;
    STATE.finalPosition = saved.finalPosition;
    STATE.position = saved.position;

  }

<script>
(function(){

    if (key === '_locking' || key === '_slotSpinning') return undefined;
    if (value instanceof Set) return {__bpSet:Array.from(value)};
    return value;
  }
  function reviver(key, value){
    if (value && value.__bpSet) return new Set(value.__bpSet);
    return value;
  }
  function buildLocalAutoSaveSnapshot(){
    if (typeof STATE === 'undefined' || !STATE.mode) return null;
    return {v:2,savedAt:Date.now(),screen:(document.querySelector('.screen.active')||{}).id||'',state:JSON.parse(JSON.stringify(STATE,replacer)),league:JSON.parse(JSON.stringify(NBA2K_DATA||{})),rng:typeof _rngState !== 'undefined' ? JSON.parse(JSON.stringify(_rngState)) : null,ages:typeof _playerAges !== 'undefined' ? JSON.parse(JSON.stringify(_playerAges||{})) : {},genes:typeof _playerGenes !== 'undefined' ? JSON.parse(JSON.stringify(_playerGenes||{})) : {}};
  }
  function localAutoSave(){
    try { var snap=buildLocalAutoSaveSnapshot(); if (!snap) return; localStorage.setItem(KEY,JSON.stringify(snap)); dirtyStamp=snap.savedAt; refreshContinueActivityButton(); } catch(e) { console.warn('[BuildPlayer] 自动存档失败',e); }
  }
  function localHasSave(){ try { return !!localStorage.getItem(KEY); } catch(e){ return false; } }
  function localLoadFullGame(){
    var raw; try { raw=localStorage.getItem(KEY); } catch(e) { showManualSaveToast('当前浏览器不允许本地存档'); return; }
    if (!raw) { showManualSaveToast('暂无自动存档'); return; }
    try {
      var snap=JSON.parse(raw), saved=JSON.parse(JSON.stringify(snap.state),reviver);
      Object.keys(STATE).forEach(function(k){delete STATE[k];}); Object.assign(STATE,saved);
      if (snap.league) { Object.keys(NBA2K_DATA).forEach(function(k){delete NBA2K_DATA[k];}); Object.assign(NBA2K_DATA,snap.league); }
      if (typeof _rngState !== 'undefined') _rngState=snap.rng||_rngState;
      if (typeof _playerAges !== 'undefined') _playerAges=snap.ages||{};
      if (typeof _playerGenes !== 'undefined') _playerGenes=snap.genes||{};
      var target=snap.screen||'';
      if (target === 'screen-build') { showScreen('screen-build'); renderBuildUI(); renderTeamPicker(); if (STATE.currentTeam) showTeamRoster(STATE.currentTeam); if (STATE.selectedPlayer && typeof STATE.selectedPlayer === 'string') STATE.selectedPlayer=(NBA2K_DATA[STATE.currentTeam]||[]).find(function(p){return p.name===STATE.selectedPlayer;})||null; renderLeftAttrs(); updateSlotButtons(); }

    } catch(e) { showManualSaveToast('读档失败：'+e.message); }
  }

  setTimeout(function(){ var b=document.getElementById('continue-activity-btn'); if(b){ b.setAttribute('onclick','event.stopPropagation();localLoadFullGame()'); if(localHasSave()) b.style.display=''; } },800);
})();

<script>
(function(){
  function __allRankPlayers(){
    if (typeof NBA2K_DATA === 'undefined') return [];
    return Object.keys(NBA2K_DATA).reduce(function(all, key){ return all.concat(NBA2K_DATA[key] || []); }, []);
  }
  function __rankEffectiveValue(player, key){
    var srcPos = typeof getPlayerMainPos === 'function' ? getPlayerMainPos(player) : 'SF';
    var penalty = typeof getPosPenalty === 'function' ? getPosPenalty(STATE.position, srcPos, key) : 1;
    return Math.round((parseInt(player[key]) || 0) * penalty);
  }
  function __getRankInfo(key, playerName){
    if (!playerName || !STATE.position) return null;
    var players = __allRankPlayers();
    var player = players.find(function(p){ return p.name === playerName; });
    if (!player) return null;
    var value = __rankEffectiveValue(player, key);
    var values = players.map(function(p){ return __rankEffectiveValue(p, key); });
    var rank = 1 + values.filter(function(v){ return v > value; }).length;
    var tieCount = values.filter(function(v){ return v === value; }).length;
    if (rank > 5) return null;
    return { rank: rank, tie: tieCount > 1, value: value };
  }
  function __rankLabel(info){
    if (!info) return '';
    return info.tie ? '并列' + info.rank + 'th' : info.rank + (info.rank === 1 ? 'st' : info.rank === 2 ? 'nd' : info.rank === 3 ? 'rd' : 'th');
  }
  function __decorateBuildRanks(){
    var container = document.getElementById('bl-attrs');
    if (!container || typeof STATE === 'undefined' || typeof ATTR_KEYS === 'undefined') return;
    Array.prototype.forEach.call(container.querySelectorAll('.ba-slot'), function(el, index){
      var key = ATTR_KEYS[index];
      var slot = STATE.attrSlots[key];
      var playerName = slot && slot.player ? slot.player : (STATE.selectedPlayer && STATE.selectedPlayer.name);
      var info = __getRankInfo(key, playerName);
      var grade = el.querySelector('.ba-grade');
      if (!grade || grade.querySelector('.bp-rank-hint')) return;
      if (info) {
        var hint = document.createElement('span');
        hint.className = 'bp-rank-hint';
        hint.textContent = '(' + __rankLabel(info) + ')';
        grade.appendChild(hint);
      }
    });
  }
  function __decorateRevealRanks(){
    var stats = document.querySelectorAll('#screen-reveal .reveal-stat');
    if (!stats.length || typeof STATE === 'undefined' || typeof ATTR_KEYS === 'undefined') return;
    Array.prototype.forEach.call(stats, function(el, index){
      var key = ATTR_KEYS[index];
      var slot = STATE.attrSlots[key];
      var info = slot && slot.player ? __getRankInfo(key, slot.player) : null;
      var label = el.querySelector('.label');
      if (!label || label.querySelector('.bp-rank-hint') || !info) return;
      var hint = document.createElement('span');
      hint.className = 'bp-rank-hint';
      hint.textContent = __rankLabel(info);
      label.appendChild(hint);
    });
  }
  function __decorateRanks(){ __decorateBuildRanks(); __decorateRevealRanks(); }
  var originalRender = window.renderLeftAttrs;
  if (typeof originalRender === 'function') {
    window.renderLeftAttrs = function(){ originalRender.apply(this, arguments); __decorateBuildRanks(); };
  }
  window.__getRankInfo = __getRankInfo;
  window.__rankLabel = __rankLabel;
  if (window.MutationObserver) new MutationObserver(__decorateRanks).observe(document.body, {childList:true, subtree:true});
  setTimeout(__decorateRanks, 0);
})();
</script>
