    { tags:['default'], text:'有人用荣誉表给{姓名}的一生列目录，但真正了解他的人更愿意从那些普通夜晚说起。{赛季数}年里，他几乎每天都准时出现在训练馆，把一场场常规赛认真打完，也把一次次失败消化成第二天的坚持。正是这些不起眼的重复，构成了他后来被反复提起的可靠。' }
    ,
    { tags:['one_city','champion'], text:'{冠军球队}的球迷很早就发现，{姓名}不是那种只属于关键夜晚的球员。他在每一个普通主场都认真出现，在每一场落后时都愿意多防一个回合，所以当冠军真正到来时，整座城市都觉得那不是运气，而是{赛季数}年攒下的答案。' },
    { tags:['multi_city','champion'], text:'{姓名}的生涯被好几座城市分成章节，但每章的落款都是同一种认真。{球队列表}的球迷后来谈起他，说的不是某一记绝杀，而是他在每支球队都让更衣室学会了一件事：先把今天打好。' },
    { tags:['defender','one_city'], text:'如果你问{城市1}的球迷，{姓名}最像什么，很多人会说像一道提前立好的墙。他不常上头条，却在每一次对手推进时出现在正确的位置，把本该发生的得分变成一次艰难的出手。' },
    { tags:['scorer','no_ring'], text:'{姓名}把得分变成了职业，也把职业过成了生活。场均{场均得分}分让他在很多夜晚成为比赛的答案，可他也经历过手感离开、球队下滑、质疑包围的年份。他从不解释太多，只是继续把球投出去。' },
    { tags:['playmaker','multi_city'], text:'真正让{姓名}在几支球队都站住脚的，是他让队友变得更好的能力。他不是把球传给空位的人，而是把信心递给沮丧的人；不是让战术跑通的人，而是让每个人都愿意再跑一次的人。' },
    { tags:['late_peak','one_city'], text:'很多人的故事在巅峰后就开始减速，{姓名}的故事却在{首队}的晚年重新提了速。{退役年龄}岁的他已经不再年轻，却用更少的体力做出更准的判断，让球迷第一次觉得老去也可以被期待。' },
    { tags:['no_ring','regret_star'], text:'如果只看荣誉表，{姓名}的生涯会留下一个空位；可如果看完整的过程，那里其实装满了更重的东西：一次次接近、一次次重来、一次次在失望后仍然第一个回到训练馆。' },
    { tags:['dynasty','defender'], text:'王朝球队通常不缺得分手，缺的是愿意做脏活的人。{姓名}就是那个把身体放进每一个回合、让对手每次突破都要付代价、让全队防守有了底气的人。' },
    { tags:['default'], text:'{姓名}的生涯没有一个特别戏剧性的开始，也没有一个特别喧闹的结尾，但中间那段{赛季数}年，被他在无数个细节里认真填满。正是这种不靠运气堆出来的厚度，让他的故事越讲越长。' },
    { tags:['one_city','playmaker'], text:'{城市1}的球迷记得{姓名}的传球，更记得他传球时的样子：不看数据，不挑队友，只在最合适的瞬间把球送到最合适的人手里。后来有人问他为什么，他说篮球本来就是五个人的。' },
    { tags:['multi_city','no_ring'], text:'{姓名}走过{球队数}支球队，没有把哪座城市当作匆匆路过的地方。每一站他都认真搬家、认真认识队友、认真理解当地的球迷，所以离开多年后，每座城市提起他仍像提起自己人。' },
    { tags:['late_peak','champion'], text:'{姓名}的晚年冠军，不是年轻时故事的延续，而是另一种故事的开头：他证明了经验、耐心和对比赛的尊重，可以比身体走得更远。' },
    { tags:['defender','champion'], text:'人们总说防守赢得冠军，{姓名}把这句话活成了生涯。他让对手的战术被迫改变，让队友敢于压上，让教练在关键时刻多了一张不需要解释的牌。' },
    { tags:['scorer','one_city'], text:'{姓名}在{城市1}的得分，不只是数字，更像一种被习惯了的安心。每当球队打不开局面，球迷会下意识看向他，而他大多数时候都没有让这种注视落空。' },
    { tags:['playmaker','champion'], text:'冠军赛季里，{姓名}做了许多技术统计看不见的事：在暂停时把所有人拉回同一条思路，在年轻队友失手后第一个拍他的背，在赢球后把话筒让给别人。' },
    { tags:['no_ring','late_peak'], text:'{姓名}的生涯里有过很多次“如果”，如果那轮系列赛再进一个球，如果那一年没有受伤，如果时间再慢一点。他没有沉溺在这些如果里，而是把它们变成了晚年继续上场的理由。' },
    { tags:['default'], text:'有人用“稳定”形容{姓名}，这个词听起来不刺激，却是最难维持的品质。{赛季数}年里，他几乎从不缺席训练，很少逃避采访，也从不把输球的责任推给队友。' },
    { tags:['one_city','defender'], text:'在{城市1}，{姓名}让防守成为一种被尊重的工作。他的盖帽和抢断不算最华丽，但他站的位置、喊的提醒、补的那一拍，让整支球队慢慢有了硬骨头。' },
    { tags:['multi_city','late_peak'], text:'{姓名}的晚年没有停在舒适区。他选择在新城市重新证明自己，接受更小的角色，也接受更重的怀疑，然后用一场场比赛把那些声音慢慢调小。' },
    { tags:['champion','scorer'], text:'如果给{姓名}的冠军写一个注脚，那一定是：得分可以终结比赛，但他更愿意用一整季的可靠来赢得比赛。' },
    { tags:['playmaker','no_ring'], text:'{姓名}没有戒指，却让很多队友记住了自己最好的样子。他的传球像一种提醒：篮球不是一个人的答案，而是所有人一起找到的方向。' },
    { tags:['defender','multi_city'], text:'几支球队都发现，{姓名}的存在会让防守多一层安全感。他不需要每场都闪光，只要他站在正确的位置，对手就会少一个简单的选择。' },
    { tags:['late_peak'], text:'当同年龄的球员开始减少上场时间，{姓名}却还在学习新的打法。晚年没有让他变保守，反而让他更愿意承认变化，再把自己重新打磨一遍。' },
    { tags:['default'], text:'{姓名}的生涯像一杯需要慢慢品的茶：没有入口时的刺激，却有回味时的温暖。{赛季数}年、{场次}场，他把自己活成了许多球迷愿意反复想起的名字。' },
    { tags:['one_city','scorer'], text:'{城市1}的夜晚有两种声音最熟悉：一是篮球穿过篮网的声音，二是球迷喊{姓名}名字的声音。这两者在他效力期间常常同时响起。' },
    { tags:['multi_city','champion'], text:'冠军不会只属于一支球队的记忆。{姓名}把同样的野心带到不同城市，也让每座冠军城市都记得同一种庆祝：先拥抱队友，再举杯。' },
    { tags:['no_ring','playmaker'], text:'有人说{姓名}差一点运气，可他让身边的人都不觉得自己差。他把每一场普通比赛都当作重要比赛来打，这份态度比任何戒指都更能定义他。' },
    { tags:['defender','late_peak'], text:'晚年的防守最考验判断力，而这恰好是{姓名}花{赛季数}年练出来的本事。他不再追着球跑，而是提前站在那里等着球。' },
    { tags:['scorer','late_peak'], text:'{姓名}的晚年得分里，少了年轻时的爆发，多了岁月给的耐心。他愿意多传一次，多跑一步，在对手以为他要投篮时送出助攻。' },
    { tags:['default'], text:'如果一个人能在{赛季数}年里始终准时、认真、不抱怨，那他就已经拥有了比天赋更可靠的东西。{姓名}正是这样被记住的。' },
    { tags:['one_city','playmaker'], text:'{首队}的新秀们后来都会被告知：看看{姓名}是怎么传球的。他不是让球飞得漂亮，而是让接到球的人感到被信任。' },
    { tags:['multi_city','defender'], text:'{姓名}在每个新城市的第一堂训练课，都会先示范同一件事：防守不是一个人的回合，而是全队的承诺。' },
    { tags:['late_peak','no_ring'], text:'没有冠军的晚年并不暗淡，因为{姓名}仍在用自己的方式发光。他的坚持让球迷相信：不是所有价值都要用奖杯结算。' },
    { tags:['champion','playmaker'], text:'冠军赛季里，{姓名}是更衣室里最先冷静下来的人。他会把所有人叫到一起，提醒大家先赢下眼前这一场，而他也总是说到做到。' },
    { tags:['scorer','multi_city'], text:'{姓名}在每支球队都留下过得分表演，但最让队友佩服的是他从不抢不属于自己的机会。他知道什么时候该出手，什么时候该把舞台让给别人。' },
    { tags:['defender','no_ring'], text:'没有戒指的防守者，更容易被数据遗忘。可{姓名}让对手记得他，让队友信任他，让教练在每个关键回合都愿意把他留在场上。' },
    { tags:['default'], text:'人们常说机会留给有准备的人，{姓名}就是那个准备了很多年的人。当球队需要有人站出来时，他已经在训练馆站了很久。' },
    { tags:['one_city','late_peak'], text:'{城市1}的球迷看着{姓名}从青涩到沉稳，也从少年看到老将。他每多打一年，这座城市就多一份“原来他真的会一直留下”的安心。' },
    { tags:['multi_city','playmaker'], text:'{姓名}换队后最难适应的不是战术，而是陌生队友的习惯。他会花很多时间记住每个人喜欢在哪里接球，然后在新赛季开始前把默契提前练出来。' },
    { tags:['champion','defender'], text:'冠军的庆祝会被反复播放，但真正把冠军带回来的，往往是那些没有被镜头记录的时刻：一次提前补防，一次主动沟通，一次把队友拉回正轨的提醒。' },
    { tags:['late_peak'], text:'{姓名}的晚年高光之所以动人，是因为它来得很不容易。每一次复健、每一次调整打法，都是他在和时间讨价还价后赢下来的。' },
    { tags:['default'], text:'{姓名}不是那种让你第一眼记住的球员，却是那种让你越了解越尊重的球员。{赛季数}年过去，他的故事没有变短，反而因为细节越来越多而变得更完整。' },
    { tags:['one_city','defender'], text:'{城市1}的球迷后来回忆{姓名}，总会先想起他的防守脚步。那不只是技术，更是一种态度：他可以输掉一个回合，但不会让对手轻松赢下。' },
    { tags:['multi_city','scorer'], text:'在不同的球队，{姓名}承担过不同的角色：有时是主攻手，有时是配角，有时是更衣室里的定心丸。他都能接住，因为他从不把角色当成贬低。' },
    { tags:['no_ring','one_city'], text:'{首队}没有给{姓名}一枚戒指，却给了他{赛季数}年的信任。他也用每一天的准时出现，把这份信任还给了这座城市。' },
    { tags:['late_peak','playmaker'], text:'晚年的{姓名}传球更慢了，却更准了。他不再急着寻找空位，而是先读防守，再让队友在移动中找到最舒服的接球点。' },
    { tags:['champion'], text:'冠军赛季之后，很多球员会松懈，{姓名}却没有。他说夺冠不是终点，而是证明这条路可以继续走下去。' },
    { tags:['defender','late_peak'], text:'{姓名}晚年最值得年轻球员学习的，是他对防守位置的耐心。他不会因为对手得分而急躁，只会更仔细地观察对手的习惯。' },
    { tags:['scorer','playmaker'], text:'{姓名}的进攻从不单调：能单打，能无球，能在包夹前出球。对手不知道他下一步会做什么，队友却永远知道他会在正确的时间出现。' },
    { tags:['default'], text:'如果把{姓名}的生涯拍成电影，它不会是一部爽片，而是一部关于坚持的长片：没有太多奇迹，只有每一天都比前一天多练一点点。' },
    { tags:['one_city','champion'], text:'{冠军球队}的冠军夜，{姓名}站在人群里没有说太多话。可那座城市知道，这枚戒指里也有他{赛季数}年的汗水。' },
    { tags:['multi_city','no_ring'], text:'{姓名}辗转多队却始终没有失去自己，因为他很清楚自己要什么：不是更响的名字，而是每场比赛都认真对待的承诺。' },
    { tags:['late_peak','defender'], text:'{退役年龄}岁的{姓名}已经不能像年轻时那样跳得更高，但他让对手更难受了，因为他总能提前一步出现在突破路线上。' },
    { tags:['scorer','one_city'], text:'{城市1}的球迷不会忘记{姓名}那些手感滚烫的夜晚，但更不会忘记他在手感冰冷时仍然不放弃出手、不放弃跑位的模样。' },
    { tags:['playmaker','late_peak'], text:'晚年的传球里藏着{姓名}对比赛的理解：他不再需要把每个回合都握在自己手里，而是让队友在正确的位置做出正确的决定。' },
    { tags:['default'], text:'{姓名}的生涯被许多数据记录过，也被更多没有数据的故事填满：一次替队友出头，一次输球后的加练，一次把话筒让给年轻人的发布会。' },
    { tags:['one_city','playmaker'], text:'{首队}后来换了很多人，但更衣室里一直流传着{姓名}的规矩：先看队友的位置，再看自己的机会。' },
    { tags:['multi_city','champion'], text:'{姓名}让不同城市的球迷学会了同一种安心：只要他还在场上，比赛就还有办法。冠军只是这种安心最好的证明。' },
    { tags:['no_ring','late_peak'], text:'没有戒指的{姓名}，晚年仍然愿意接受更小的角色。他说自己不是来证明什么的，只是想继续打篮球。' },
    { tags:['defender','scorer'], text:'{姓名}最难得的不是能攻能守，而是愿意在两者之间切换：需要他得分时他不躲，需要他防守时他不嫌累。' },
    { tags:['late_peak'], text:'{姓名}晚年最动人的地方，是他从来没有把“老了”当作借口。他接受身体的变化，却拒绝承认比赛已经不再需要他。' },
    { tags:['default'], text:'很多人问{姓名}为什么能打这么久，他说只是每天做好同一件小事。{赛季数}年下来，那件小事变成了别人很难复制的坚持。' },
    { tags:['one_city','scorer'], text:'{城市1}的球馆上空没有{姓名}的球衣，但每个主场比赛前，解说都会念到他的名字，然后全场响起掌声。' },
    { tags:['multi_city','defender'], text:'在每支球队，{姓名}都先赢得防守端的尊重，再慢慢获得进攻端的信任。他说防守是敲门砖，队友愿意把球交给你，是因为知道你会拼命护住。' },
    { tags:['no_ring','playmaker'], text:'{姓名}没有用冠军证明自己，却用一次次的传球证明了另一件事：篮球的意义有时候不在结果，而在让身边的人变得更好。' },
    { tags:['champion','late_peak'], text:'{姓名}的晚年冠军，让他所有的坚持都有了回声。那些年复一年没有人看见的努力，终于被一座奖杯温柔地接住。' },
    { tags:['scorer'], text:'{姓名}的得分方式并不华丽，却非常可靠：扎实的出手、耐心的跑位、对比赛节奏的理解。这让他在任何体系里都能找到自己的位置。' },
    { tags:['defender','one_city'], text:'{城市1}的防守文化里，有{姓名}留下的一课：防守不是数据，而是让对手每一次进攻都变得不舒服。' },
    { tags:['default'], text:'{姓名}的生涯或许没有那么多高光时刻，但每一场他都当作重要的比赛来打。这种态度让他的故事虽然平淡，却很有力量。' },
    { tags:['multi_city','late_peak'], text:'{姓名}晚年换队，不是为了延长生涯，而是为了在还能打的时候，把最后的热量留给最需要的地方。' },
    { tags:['playmaker','one_city'], text:'{首队}的球迷常说，{姓名}的传球像一种语言，能让第一次合作的队友也听懂。那是一种用信任写成的默契。' },
    { tags:['no_ring','defender'], text:'没有戒指的防守者往往会被遗忘，但{姓名}让对手记得他每一次对抗的硬度，也让队友记得他每一次补防的及时。' },
    { tags:['late_peak','scorer'], text:'晚年的{姓名}得分不多，却总在关键时刻出现。他知道如何保存体力，也知道什么时候该把最后一点力气用在哪一个回合。' },
    { tags:['default'], text:'{姓名}的生涯里没有太多捷径，他用最笨的办法走完了最长的路：每天训练、每场认真、每次输球后重新开始。' }
  ],
  first_city: [
    { tags:['one_city','loyalty'], text:'在{城市1}，{姓名}学会了职业篮球最硬也最温柔的一课：你可以有天赋，但你必须先让一座城市相信你每天都会准时出现。那些年，他把汗水留在训练馆，把耐心留给比赛，把成长留给每一个坐在看台上的人。球迷看着他从会犯错的年轻人，慢慢长成球队每个困难夜晚都能想起的名字。' },
    { tags:['early_peak'], text:'他和{首队}的关系，很早就越过了“新秀”和“球队”的简单定义。{最佳赛季}，他把{最高光荣誉}带回这座城市，也把球队从“也许有机会”带到“必须被认真对待”。那一年之后，{城市1}谈起他时不再只是期待，而是带着一点骄傲。' },
    { tags:['default'], text:'{首队}给他的不是一条平坦的路，而是一段需要亲手修出来的路。球队经历过连败、质疑和更衣室里的沉默，也经历过第一次真正相信“我们能赢”的夜晚。很多关系就是这样建立起来的：不是靠一句豪言，而是靠一场又一场失败之后，他仍然愿意站出来接住所有人的目光。' },
    { tags:['scorer','early_peak'], text:'{首队}见过{姓名}最锋利的年纪。那时他还不懂得保存体力，每场比赛都像要把所有力气烧光，观众也愿意为他站起来。{最佳赛季}的那段高光，成了{城市1}许多球迷第一次在客场也会骄傲喊出他名字的理由。' },
    { tags:['playmaker'], text:'他在{首队}的成长，不只是个人技术的成熟，更是对“如何让队友变得更好”的逐渐理解。后来人们说{姓名}组织能力强，其实那更接近一种长期观察：他记得每个队友的习惯，也知道什么时候该把球交给谁。' },
    { tags:['defender'], text:'{城市1}的球迷最先记住的，是他那股不服输的防守劲。新秀赛季他也许防不住所有人，但从不躲开对抗，也不愿意让对手轻松得分。那些年养成的习惯，后来陪他走了很长的路。' },
    { tags:['default'], text:'{首队}那几年并不总是顺利，但{姓名}没有选择绕开困难。球队低谷时他留下来加练，被质疑时他选择用比赛回答。这座城市最初认识他的方式，就是看他怎样一点点把“可能”变成“可以”。' }
    ,
    { tags:['one_city','scorer'], text:'{城市1}第一次认真记住{姓名}，是在一场普通的常规赛里。他连续投进几个球后，突然回防时撞到了广告牌，爬起来继续跑。从那以后，球迷觉得这个年轻人值得多看几眼。' },
    { tags:['one_city','playmaker'], text:'{姓名}在{首队}的第一次训练，就做了一件让老将们意外的事：他主动把球传给位置更好的队友，而不是自己出手。教练后来常说，那一眼就看出这孩子能打很久。' },
    { tags:['one_city','defender'], text:'新秀赛季的{姓名}防守还很粗糙，但他有一样东西让教练喜欢：每一次被过掉，他都会追回来。那种不放弃的态度，慢慢变成了{首队}防守的底色。' },
    { tags:['one_city','champion'], text:'{冠军城市}等这个冠军等了很久，而{姓名}是陪着这座城市等待的人之一。他见过球馆里空着的座位，也见过夺冠夜哭成一片的看台，所以他比谁都珍惜那段路。' },
    { tags:['early_peak'], text:'{最佳赛季}的{姓名}像突然被点燃了一样，场均数据一路走高，球队也第一次尝到“我们真的可以”的滋味。那不是一夜爆红，而是前两年每一次加练悄悄埋下的伏笔。' },
    { tags:['one_city','late_peak'], text:'{姓名}在{首队}从少年打到老将，几乎每个赛季都换一种打法：年轻时冲，中期稳，晚年传。球迷看着他的变化，就像看着自己这些年慢慢长大。' },
    { tags:['default'], text:'{首队}给{姓名}的第一课，不是怎么赢球，而是怎么在输球后不散。他跟着球队熬过连败，也学会在更衣室里先开口，把所有人的情绪拉回同一个方向。' },
    { tags:['one_city','no_ring'], text:'{城市1}没能给{姓名}一枚戒指，却给了他一座城市全部的信任。他也用{赛季数}年的准时出现，把这份信任变成了彼此之间最稳的约定。' },
    { tags:['one_city','playmaker'], text:'{姓名}在{首队}最被低估的能力，是让年轻人安心。新秀犯错时他不会吼，只会走过去说一句：再来。后来许多年轻队友都说，那是他们职业生涯听过最好的一句话。' },
    { tags:['one_city','scorer'], text:'{城市1}的主场解说有一个习惯：{姓名}每次命中关键球，都会喊出那句属于他的口号。后来这成了这座城市的声音，也成了客场球迷最不想听到的声音。' },
    { tags:['one_city','defender'], text:'{姓名}在{首队}留下的防守数据不算最漂亮，但他让对手养成了提前看他的习惯。他的站位、补防和沟通，让整支球队的防守从单打独斗变成了一台机器。' },
    { tags:['one_city','champion'], text:'冠军赛季开始前，{冠军球队}的媒体并不看好他们。{姓名}没有参与争论，只是在训练馆里把每一天都练完。后来人们回想，那支冠军球队的信心，其实是从最安静的角落开始长出来的。' },
    { tags:['default'], text:'{姓名}在{首队}的日子，大部分都很普通：训练、比赛、大巴、酒店。可他让这些普通的日子变得有重量，因为每一件小事他都做得足够认真。' },
    { tags:['one_city','late_peak'], text:'{城市1}的球迷最舍不得{姓名}的时候，是他晚年每一次回防都慢半拍的瞬间。他们知道他的速度会走，但他每一次仍然咬牙追上去的样子，让整座城市都心疼又骄傲。' },
    { tags:['one_city','playmaker'], text:'{姓名}在{首队}学会了什么叫作“让球找人”。他不追求华丽的助攻，只追求让队友在正确的位置接到球，然后看着他们把机会变成得分。' },
    { tags:['one_city','no_ring'], text:'{城市1}的遗憾里，有一整段{姓名}的青春。他没有用冠军补偿这座城，却用每一天的努力让球迷觉得，这份陪伴比奖杯更真实。' },
    { tags:['early_peak','scorer'], text:'{最佳赛季}，{姓名}第一次让联盟注意到{首队}：他在一场又一场硬仗里扛起球权，把球队带进季后赛。那一年他学会了承担责任，也学会了责任有多重。' },
    { tags:['default'], text:'{首队}的更衣室里，{姓名}不是话最多的人，却是最准时的人。新秀们后来都说，只要看到他已经坐在那里，就知道今天不会出什么乱子。' },
    { tags:['one_city','defender'], text:'{姓名}在{城市1}留下了一个著名的习惯：每次暂停结束，他都会在走出替补席前把所有人的手搭在一起。那一声轻轻的“来”，后来成了球队最熟悉的声音。' },
    { tags:['one_city','champion'], text:'冠军夜的彩带落在{姓名}肩上时，他没有像很多人想象中那样激动。他只是站在原地，抬头看了看球馆上空的旗帜，然后转身拥抱了每一个队友。' },
    { tags:['one_city','playmaker'], text:'{首队}的年轻后卫们，几乎都受过{姓名}的指点：不是教他们怎么过人，而是教他们什么时候该把球停下来，看一眼队友在哪里。' },
    { tags:['one_city','scorer'], text:'{城市1}的球迷记得{姓名}那些得分如雨的夜晚，但更记得他在手感冰冷时仍然不放弃跑位。他们知道，那种坚持比任何高光都难得。' },
    { tags:['default'], text:'{姓名}在{首队}的第一份合同并不起眼，但他把每一场比赛都当作证明自己的机会。后来他签下更大的合同时，仍然保持着第一年那种小心翼翼又全力以赴的样子。' },
    { tags:['one_city','late_peak'], text:'{姓名}晚年选择留在{首队}，不是因为没有更好的去处，而是因为他觉得这座城市的球迷值得一个完整的句号。' },
    { tags:['one_city','defender'], text:'在{城市1}，{姓名}让“防住对手”变成一件值得被表扬的事。他在赛后采访里从不抢镜，但教练和队友都知道，他做了多少没有被镜头记录的工作。' },
    { tags:['early_peak','playmaker'], text:'{姓名}在{首队}的成长轨迹很清楚：第一年学着适应，第二年学着承担，第三年学着让队友更好。{最佳赛季}时，他已经成了球队离不开的那个人。' },
    { tags:['default'], text:'{首队}的球馆工作人员至今记得{姓名}：他是那种会记得每个人名字的球员，会在赛前和保安打招呼，会在深夜训练后顺手把灯关掉。' },
    { tags:['one_city','champion'], text:'{冠军城市}的冠军游行上，{姓名}把奖杯递给了一个坐在父亲肩上的孩子。他说自己小时候也这样看过冠军，现在想让别人也记住这一刻。' },
    { tags:['one_city','scorer'], text:'{姓名}在{首队}的得分纪录也许会被后人打破，但他留给这座城市的东西不会：那种只要球在他手里，比赛就还有希望的安心。' },
    { tags:['one_city','playmaker'], text:'{首队}的老球迷常说，{姓名}的传球像这座城市的人情味：不张扬，但总是在你需要的时候出现。' },
    { tags:['default'], text:'{姓名}在{首队}学会的最重要的一件事，不是如何成为明星，而是如何成为队友。他后来把这件事做了一辈子。' },
    { tags:['one_city','no_ring'], text:'{城市1}没有冠军，但{姓名}让球迷觉得，跟着他一起等也不是那么难熬。因为他每天都在用实际行动告诉他们：值得等。' },
    { tags:['early_peak','defender'], text:'{最佳赛季}的防守端，{姓名}还不是最好的防守者，但他已经开始让对手记住他的名字。他的拼劲让教练愿意把最难的防守任务交给他。' },
    { tags:['one_city','late_peak'], text:'{姓名}在{首队}的最后一个赛季，每一次主场比赛前，球迷都会起立鼓掌。他不多说什么，只是轻轻点头，然后继续去做那件他做了{赛季数}年的事。' },
    { tags:['one_city','playmaker'], text:'{首队}的战术板上，{姓名}的名字不一定在最显眼的位置，但每一次战术跑不出来时，教练都会说：把球给{姓名}，让他想办法。' },
    { tags:['default'], text:'{姓名}在{首队}的日子，就像这座城市的气候一样稳定：没有太多惊喜，但从不让人失望。后来球迷才明白，这种稳定有多珍贵。' },
    { tags:['one_city','scorer'], text:'{城市1}的球迷会为了{姓名}的一记三分站起来，也会为他在第四节的一次突破屏住呼吸。那些年，他的比赛成了很多人周末的期待。' },
    { tags:['one_city','defender'], text:'{姓名}在{首队}最被人记住的防守，不是一记大帽，而是在对手快攻时从后场追到前场，把必进之球变成一次失误。那种回防，让教练看了都摇头。' },
    { tags:['early_peak'], text:'{姓名}在{首队}的第三个赛季，球队开始围绕他调整战术。他第一次意识到，自己不再只是一个新人，而是这座城市寄予希望的人。' },
    { tags:['one_city','champion'], text:'{冠军球队}的冠军戒指上刻着每个人的名字，但{姓名}说，那枚戒指的重量，更多来自那些年一起熬过的夜晚。' },
    { tags:['default'], text:'{姓名}在{首队}的成长，被记录在每一场比赛中，也被记录在更衣室的每一次谈话里。他从小将变成核心，再从核心变成老将，每一步都走得踏实。' },
    { tags:['one_city','playmaker'], text:'{首队}的年轻球员最感谢{姓名}的一件事，是他愿意把球传给他们。那种信任让他们敢于出手，也让他们慢慢学会承担责任。' },
    { tags:['one_city','no_ring'], text:'{城市1}的球迷没有等到冠军，但他们等到了一个愿意陪他们一起等的球员。{姓名}用{赛季数}年证明，有些陪伴比结果更重要。' },
    { tags:['early_peak','scorer'], text:'{最佳赛季}的{姓名}，几乎每晚都能交出漂亮的得分数据。可他在赛后总是先看技术统计里队友的贡献，他说胜利不是一个人的账本。' },
    { tags:['one_city','defender'], text:'{姓名}在{城市1}的防守，不是靠身体硬顶，而是靠位置和预判。他让对手的教练在录像分析时反复标注：注意他站的位置。' },
    { tags:['default'], text:'{首队}给了{姓名}一个舞台，他用{赛季数}年的努力还了这座城市一份礼物：一段可以反复讲述、不会褪色的回忆。' },
    { tags:['one_city','late_peak'], text:'{姓名}晚年的一次采访里说，他最感谢的是{首队}的球迷，因为他们在他还没打出来的时候就开始相信他。' },
    { tags:['one_city','playmaker'], text:'{首队}的教练后来回忆{姓名}，说他是那种会让教练变年轻的球员：因为他总能把战术执行到位，也会在需要时提醒你哪里出了问题。' },
    { tags:['one_city','scorer'], text:'{城市1}的夜店和餐厅里，流传着{姓名}的另一个故事：他很少去那些地方，大部分时间都在训练馆。球迷笑着说，这就是他能打这么久的秘密。' },
    { tags:['early_peak','champion'], text:'{最佳赛季}那年，{姓名}和{冠军球队}一起经历了从低谷到高峰的全部过程。他后来常说，那段日子教会他的东西，比冠军本身更多。' },
    { tags:['default'], text:'{姓名}在{首队}留下的不仅是数据，还有一种氛围：训练馆里的灯总是亮到很晚，因为总有一个人还在加练。' },
    { tags:['one_city','no_ring'], text:'{城市1}的遗憾里，{姓名}是最温柔的那一部分。他没有用冠军弥补遗憾，却用每一天的努力让遗憾变得没那么痛。' },
    { tags:['one_city','defender'], text:'{姓名}在{首队}最常说的一句话是：先防住，再谈别的。后来这句话成了球队更衣室里最常见的提醒。' },
    { tags:['one_city','playmaker'], text:'{首队}的球迷喜欢{姓名}，不只是因为他打球好，还因为他会在赛后把球衣送给看台上的孩子，会在医院开放日第一个报名。' },
    { tags:['early_peak','late_peak'], text:'{姓名}在{首队}的生涯像一条完整的曲线：年轻时的锐利，中期的稳定，晚年的从容。{最佳赛季}是他的高光，但每一个阶段都有球迷真心喜欢。' },
    { tags:['default'], text:'{姓名}在{首队}的第一个赛季，球队战绩并不好，但他没有因此改变自己的节奏。他相信只要每天进步一点点，时间会给出答案。' },
    { tags:['one_city','champion'], text:'{冠军城市}的冠军夜，{姓名}在更衣室里把奖杯递给每一位工作人员，从队医到保安。他说这座城等了太久，每个人都值得分享这一刻。' },
    { tags:['one_city','scorer'], text:'{姓名}在{首队}的得分手段很朴素：扎实的跳投，耐心的突破，以及那种不慌不忙的气质。球迷说他打球像这座城市的人，不浮夸，但靠谱。' },
    { tags:['early_peak'], text:'{最佳赛季}结束后，{姓名}没有满足于已经得到的成绩。他把那份数据单收进抽屉，然后回到训练馆，开始为下一段路做准备。' },
    { tags:['one_city','defender'], text:'{姓名}在{城市1}教会年轻队友的第一件事，是防守时不要只看球，要看对手的腰。他说那是预判的起点，也是他打了这么多年还能站住的原因。' },
    { tags:['default'], text:'{首队}的球迷后来常提起一个画面：球队输球后，{姓名}独自留在场上捡球。他们不知道他在想什么，但知道第二天他一定会准时出现在训练馆。' },
    { tags:['one_city','playmaker'], text:'{姓名}在{首队}的传球风格，逐渐成为球队的标签：不追求华丽，但追求每一个队友都参与进来。' },
    { tags:['one_city','no_ring'], text:'{城市1}没有给{姓名}冠军，却给了他一整段青春。他回报这座城市的方式，是让每一个主场比赛都值得买票。' },
    { tags:['early_peak','defender'], text:'{最佳赛季}的{姓名}，已经懂得用防守带动进攻。他的一次抢断，往往能让球队在下一个回合打出最简单的反击。' },
    { tags:['one_city','late_peak'], text:'{姓名}在{首队}的晚年，开始把更多机会让给年轻人。他说自己的任务变了：不只是赢球，还要让下一代学会怎么赢。' },
    { tags:['default'], text:'{首队}的第一场比赛，{姓名}紧张得几乎没睡好。他后来笑着说，那种紧张一直陪了他很多年，因为他从没把任何一场比赛当成理所当然。' },
    { tags:['one_city','scorer'], text:'{城市1}的球迷喜欢看{姓名}得分，更喜欢看他得分后第一时间回防的样子。他们说，那才是一个球员最帅的时候。' },
    { tags:['one_city','champion'], text:'{冠军球队}的冠军赛季里，{姓名}不是数据最亮眼的球员，却是全队最愿意做细节的人。他把冠军所需要的每一块砖都认真砌好了。' },
    { tags:['early_peak','playmaker'], text:'{姓名}在{首队}的成长过程中，最大的变化不是技术，而是心态：从“我想打得好”变成“我想让球队打得好”。' },
    { tags:['one_city','defender'], text:'{姓名}在{城市1}的最后一个防守回合，至今还被老球迷提起。他明明已经累了，却仍然扑出去干扰了那次投篮。' },
    { tags:['default'], text:'{首队}的更衣室墙上挂过很多照片，其中一张是{姓名}新秀赛季的合影。老球员说，那时候他就已经坐在现在的位置上。' },
    { tags:['one_city','no_ring'], text:'{城市1}的球迷不会用冠军来定义{姓名}，因为他们亲眼看过他怎样在每一个没有冠军的赛季里，仍然拼尽全力。' },
    { tags:['one_city','playmaker'], text:'{姓名}在{首队}的最后一记传球，送给了队里最年轻的球员。那个球没有变成助攻，但他说，那可能是他职业生涯最重要的一次传球。' }
  ],
  core: [
    { tags:['defender','champion'], text:'{防守荣誉}说明了他的统治力，却说不完他的防守。他真正厉害的地方，是让队友敢于压迫，让对手提前犹豫，让比赛在看不见的地方向他的球队倾斜。当这些防守最终变成{冠军线}时，人们才明白，他守住的不只是篮筐，还有球队最珍贵的信心。' },
    { tags:['defender','no_ring'], text:'{防守荣誉}没有为他换来总冠军，却足以证明他每晚改变比赛的方式。{姓名}的价值常常藏在技术统计之外：一次提前补位，一句防守提醒，一个让队友敢于压出去的眼神。没有戒指并不让这些回合变轻，反而让它们更像一种安静的坚持。' },
    { tags:['scorer'], text:'场均{场均得分}分看起来只是一个数字，但放进{赛季数}年里，就变成了极难维持的职业标准。每个赛季都有新的防守、新的身体状态和新的角色，而他总能找到继续帮助球队的方法。不是因为他永远年轻，而是因为他愿意承认变化，再温和又固执地把自己重新打磨一遍。' },
    { tags:['playmaker'], text:'{姓名}的传球不是为了凑助攻，而是为了让队友活过来。他知道谁需要早一点接球，谁需要被鼓励出手，谁在连丢两球后还值得被信任。有些助攻写进技术统计，有些只是让一个年轻人重新敢于抬头，这两种传球在他心里同样重要。' },
    { tags:['dynasty'], text:'王朝从来不是某一个夜晚突然降临的，它更像一种漫长的互相信任。{姓名}在那些年里既是战术核心，也是情绪锚点；既要打出数据，也要替全队承担输球后的第一轮质问。可他从不把压力说得很重，赢球后先找队友拥抱，输球后先说自己的责任。' },
    { tags:['champion'], text:'总冠军改变了{姓名}的履历，也改变了{冠军球队}谈起篮球时的语气。夺冠夜结束后，很多人记得彩带、香槟和奖杯，但真正跟过那个赛季的人，更记得他在最难那轮系列赛里一次次把球队从边缘拉回来。那些回合没有每一个都成为经典镜头，却都被球迷悄悄收进了自己的青春里。' },
    { tags:['default'], text:'他的巅峰并不是某一场突然爆发，而是一段持续稳定的陪伴。无论球队需要得分、组织、防守，还是需要有人在更衣室里先开口，{姓名}都习惯把责任接过来。他不总是用最响的方式回答，却总能让身边的人觉得比赛还有办法。' },
    { tags:['champion','playmaker'], text:'{冠军球队}夺冠的赛季里，{姓名}做了许多技术统计无法完整记录的事。他在关键回合选择相信队友，在暂停时把所有人拉回同一条思路，也在最难的时候先接过责任。总冠军会写进履历，但更衣室会永远记得他把大家带向那里的方式。' },
    { tags:['scorer','champion'], text:'场均{场均得分}分让{姓名}成为对手防守计划里的第一行，而他偏偏还能在那种关注下继续高效。他真正让队友安心的，不只是得分，而是他知道什么时候该自己来，什么时候该把球给正在起势的队友。' },
    { tags:['defender'], text:'巅峰期的{姓名}是那种让你在赛前计划里专门写一段的球员。他让对手的强点被迫调整，让队友的防守敢于向前，也让教练在布置战术时多了一种“把最难的人交给他”的底气。' },
    { tags:['default'], text:'{姓名}的巅峰更像一段持续的高原，而不是几座孤峰。他很少依赖某一次爆发改变评价，而是让球队在每个赛季都习惯有他兜底。这种稳定听上去不刺激，却是一支球队真正能走远的前提。' }
    ,
    { tags:['champion','one_city'], text:'{姓名}的巅峰期，恰好是{首队}最需要有人站出来的时期。他不只是交出数据，更是在每一场关键比赛里把所有人的注意力拉回同一件事：先赢下眼前这个回合。' },
    { tags:['defender','one_city'], text:'在{城市1}，{姓名}把“防守核心”四个字变成了具体的画面：对手突破前会先看一眼他在哪里，队友漏人后第一个补上的也总是他。' },
    { tags:['scorer','champion'], text:'{姓名}的得分巅峰并不依赖大量出手，而是依赖效率和对机会的选择。他总能在球队最需要分数时把球放进篮筐，仿佛那个时刻已经被他提前排练过无数次。' },
    { tags:['playmaker','dynasty'], text:'王朝球队最需要的不是一个人统治球权，而是有人能把所有人的节奏调成一致。{姓名}就是那个节拍器：快攻时提速，阵地战时压节奏，年轻人上头时把球稳下来。' },
    { tags:['champion','defender'], text:'冠军赛季里，{姓名}在防守端的价值常常被进攻数据掩盖。他防住的不只是对手的得分，更是对手的信心：当对方核心连续几个回合都打得不舒服时，比赛的天平已经开始倾斜。' },
    { tags:['playmaker','champion'], text:'{姓名}的高明之处，是他能让身边的每个人都在合适的位置发光。他不抢功劳，也不推责任，只是在每一次进攻里找到让球队整体变强的那条路。' },
    { tags:['scorer','no_ring'], text:'没有冠军的巅峰，听起来有些遗憾，但{姓名}的高效得分仍然让对手头疼了很多年。他的比赛方式证明：数据可以很漂亮，前提是你愿意把每一球都认真投出去。' },
    { tags:['default'], text:'{姓名}的巅峰不是靠一场比赛定义的，而是靠一个赛季又一个赛季的稳定。他让球队习惯了“有他在就不会乱”的感觉，这种信任比任何荣誉都难建立。' },
    { tags:['champion','playmaker'], text:'夺冠那年，{姓名}在最关键的一轮系列赛里做出过很多聪明的选择：该传的球绝不犹豫，该投的球绝不手软。教练后来复盘时说，那是他见过最冷静的阅读。' },
    { tags:['defender','no_ring'], text:'{姓名}的防守巅峰，让对手的核心球员在每个回合都多费一点力气。那些力气积少成多，到第四节就变成了对手的疲惫和他球队的机会。' },
    { tags:['scorer','one_city'], text:'{城市1}的球迷见过{姓名}最可靠的得分方式：不依赖手感爆发，而是用稳定的出手和跑位慢慢积累。他们常说，看他得分像看一只钟表，准得让人安心。' },
    { tags:['playmaker','no_ring'], text:'{姓名}的巅峰传球，让很多队友打出了生涯最好的赛季。他总能在包夹到来前出球，在队友起步时把球送到，在别人犹豫时给出答案。' },
    { tags:['champion','late_peak'], text:'{姓名}晚年夺冠，靠的不是年轻的爆发，而是对比赛的深层理解。他不再追求每场高分，而是在最关键的几分钟里做出最正确的决定。' },
    { tags:['default'], text:'巅峰期的{姓名}，是那种让教练省心的球员：不用时刻提醒，不用反复叮嘱，他自己知道该在什么时间做什么事。' },
    { tags:['defender','dynasty'], text:'王朝的防守体系中，{姓名}像一块承重的基石。他的补防让队友敢于冒险，他的沟通让防线保持完整，他的存在让对手少了很多轻松得分的机会。' },
    { tags:['scorer','playmaker'], text:'{姓名}的巅峰不仅是得分手，还是进攻的组织者。他能在自己得分和让队友得分之间自由切换，让防守者永远猜不到他的下一步。' },
    { tags:['champion','scorer'], text:'冠军需要关键先生，而{姓名}就是那个在第四节让人安心的关键先生。他不一定每次都能投进，但他总能在最需要的时候敢于出手。' },
    { tags:['no_ring','regret_star'], text:'{姓名}的巅峰期很长，遗憾也随之很长：他多次把球队带到季后赛深处，却总差一步。可他从未因此降低对自己的要求。' },
    { tags:['default'], text:'{姓名}在巅峰期最让人佩服的，是他对细节的执念：站位、脚步、出手时机、防守沟通，每一件小事都被他反复打磨。' },
    { tags:['one_city','champion'], text:'{冠军球队}的冠军，是{姓名}巅峰期的注脚。他在那段岁月里把自己最好的几年留给了这座城市，也让这座城市记住了他最好的样子。' },
    { tags:['defender','scorer'], text:'{姓名}的特别之处，是他不需要在攻防之间做取舍。他既能贡献得分，又能完成防守任务，让球队在任何一个夜晚都多一种选择。' },
    { tags:['playmaker','late_peak'], text:'晚年巅峰的{姓名}，传球像在写答案：每一次都恰到好处，让队友接得舒服，让战术跑得流畅。' },
    { tags:['champion','no_ring'], text:'有人用冠军定义巅峰，{姓名}却用无数个夜晚定义了自己：他让每支球队都记得，和他在同一个更衣室里打球是什么感觉。' },
    { tags:['scorer'], text:'{姓名}的得分手段不算多，但他把每一种都练到了极致。对手知道他要做什么，却仍然很难阻止他。' },
    { tags:['defender'], text:'巅峰期的{姓名}，是那种让对手教练头疼的球员：他不仅防住你的人，还让你的人开始怀疑自己。' },
    { tags:['playmaker'], text:'{姓名}的传球带着一种节奏感：不抢快，不拖沓，总在防守者松懈的瞬间把球送到队友手里。' },
    { tags:['default'], text:'{姓名}的巅峰，让球队在无数个夜晚拥有了一种确定感：只要他在，比赛就不会失控。' },
    { tags:['champion','dynasty'], text:'王朝的建立需要很多人的牺牲，而{姓名}愿意做那个在数据之外贡献的人。冠军戒指上虽然没有单独刻他的故事，但更衣室记得。' },
    { tags:['scorer','no_ring'], text:'{姓名}的得分巅峰，让他在很多赛季都是对手重点照顾的对象。可他总能找到得分的方式，因为他的进攻从不只靠一招。' },
    { tags:['defender','late_peak'], text:'晚年巅峰的{姓名}，防守不再是靠身体，而是靠经验：他知道对手的习惯，也知道该在哪里等他。' },
    { tags:['playmaker','one_city'], text:'{城市1}的球迷最爱看{姓名}的快攻传球：明明可以自己上篮，他却总愿意把球送给位置更好的队友。' },
    { tags:['default'], text:'{姓名}的巅峰期里，他几乎没有缺席过重要比赛。这种稳定本身就是一种统治力。' },
    { tags:['champion','defender'], text:'冠军的防守核心往往不是最显眼的球员，却是最不可或缺的球员。{姓名}就是这样的存在。' },
    { tags:['scorer','late_peak'], text:'晚年巅峰的{姓名}，得分方式变得简单而高效：他不再强行突破，而是用经验和节奏找到最舒服的出手点。' },
    { tags:['playmaker','champion'], text:'冠军赛季里，{姓名}的助攻数不是最高，但每一次关键传球都恰到好处。他的组织让球队的进攻有了灵魂。' },
    { tags:['defender','no_ring'], text:'没有冠军的防守者，往往会被低估。但{姓名}让对手和队友都清楚：他的价值不在一枚戒指上。' },
    { tags:['default'], text:'巅峰期的{姓名}，让教练在战术板上多了一行字：当比赛陷入僵局，把球交给{姓名}。' },
    { tags:['champion','playmaker'], text:'夺冠路上，{姓名}在最紧张的时刻保持着最清醒的头脑。他提醒队友别急，也提醒自己别放松。' },
    { tags:['scorer','one_city'], text:'{城市1}的球迷把{姓名}巅峰期的比赛当作节日：他的每一次出手都值得期待，每一次庆祝都让人跟着心跳。' },
    { tags:['defender','dynasty'], text:'王朝球队的防守不是一个人的功劳，但{姓名}是那条最不容易被看见的线：他让整条防线有了次序。' },
    { tags:['default'], text:'{姓名}的巅峰，是一场漫长的自我要求：他把每一场比赛都当作证明自己的机会，从不因为已经站稳就放松。' },
    { tags:['playmaker','late_peak'], text:'晚年的{姓名}，依然能送出让人惊叹的传球。那不是灵光一现，而是{赛季数}年对队友习惯的累积。' },
    { tags:['scorer','champion'], text:'冠军赛季里，{姓名}的得分效率是球队最可靠的武器之一。他让每一次出手都有了意义。' },
    { tags:['defender','one_city'], text:'{姓名}在{城市1}的防守核心地位，不是靠一场比赛赢来的，而是靠无数个回合慢慢建立的。' },
    { tags:['default'], text:'巅峰期的{姓名}，最让队友安心的不是他的数据，而是他的判断：他总能在混乱中给出最简单的答案。' },
    { tags:['champion','scorer'], text:'冠军需要有人站出来得分，{姓名}就是那个人。他的关键球能力，让球队在最难的夜晚多了一盏灯。' },
    { tags:['playmaker','no_ring'], text:'{姓名}的巅峰组织能力，让球队在进攻端永远有第二种选择。即使他没有得分，防守者也不敢放松对他的盯防。' },
    { tags:['defender','champion'], text:'{姓名}的防守巅峰，让冠军球队在季后赛里多了一层保障：对手的强点总是会在他这里慢下来。' },
    { tags:['default'], text:'{姓名}的巅峰期，是那种可以被写在球队历史里的时期：他让一支球队从“还行”变成“必须被认真对待”。' },
    { tags:['scorer','playmaker'], text:'{姓名}在巅峰期的全面，让对手很难找到防守重点：他既能自己得分，也能让队友变得更好。' },
    { tags:['champion','dynasty'], text:'王朝的每一块拼图都重要，但{姓名}是那种让拼图不会散架的人。他的稳定，让球队在最乱的时刻还有方向。' },
    { tags:['defender','late_peak'], text:'晚年巅峰的{姓名}，用防守证明了经验的价值：他不需要跳得最高，只需要站在最正确的位置。' },
    { tags:['playmaker','one_city'], text:'{首队}的战术体系里，{姓名}是那个让一切都转起来的人。他不在数据榜最顶端，却在每一个回合里。' },
    { tags:['default'], text:'{姓名}的巅峰，是一段被无数细节填满的时光。他没有浪费任何一个可以变得更好的夜晚。' },
    { tags:['champion'], text:'冠军不是{姓名}巅峰的终点，而是他对自己要求的一种回应。他没有因此停下，而是继续把标准定得更高。' },
    { tags:['scorer','no_ring'], text:'没有冠军的得分巅峰，依然值得被尊重。{姓名}用一场场比赛证明，高效、稳定、可靠本身就是一种伟大。' },
    { tags:['defender','playmaker'], text:'{姓名}的特别之处，是他愿意做那些不显眼却重要的事：防守端堵住漏洞，进攻端让球流动起来。' },
    { tags:['default'], text:'巅峰期的{姓名}，是队友眼中的定海神针：只要他在，大家就知道比赛还有办法。' },
    { tags:['champion','late_peak'], text:'{姓名}晚年的冠军，是他巅峰期最好的延续：他没有因为年龄而降低标准，反而把标准变成了习惯。' },
    { tags:['scorer','one_city'], text:'{城市1}的球迷永远记得{姓名}巅峰期的那些夜晚：他的得分像一场漫长的雨，润物细无声。' },
    { tags:['playmaker','dynasty'], text:'王朝的进攻里，{姓名}是那个让所有人都参与进来的人。他不追求球权，只追求球队的整体流畅。' },
    { tags:['defender','no_ring'], text:'{姓名}的防守巅峰，让很多对手的核心球员在赛后采访里都提到他。那不是夸奖，而是尊重。' },
    { tags:['default'], text:'{姓名}的巅峰，是一段不需要太多解释的时光：他站在那里，球队就多了一份底气。' },
    { tags:['champion','playmaker'], text:'冠军赛季里，{姓名}在最关键的回合做出了最冷静的选择。他的比赛阅读能力，让教练愿意把最后一攻交给他。' },
    { tags:['scorer','late_peak'], text:'晚年的{姓名}，得分不多但依然致命。他总能在对手放松警惕时，用一记精准的投篮改写比赛。' },
    { tags:['defender','one_city'], text:'在{城市1}，{姓名}的防守核心地位已经写进球队的记忆。后来的球员都会被提醒：学学{姓名}怎么站位。' },
    { tags:['default'], text:'巅峰期的{姓名}，让球队在每一个夜晚都多了一份安全感。他不是最耀眼的星，却是最可靠的坐标。' },
    { tags:['champion','scorer'], text:'冠军需要得分，更需要有人在关键时刻敢于站出来。{姓名}就是那个愿意承担最后责任的人。' },
    { tags:['playmaker','no_ring'], text:'{姓名}的组织巅峰，让很多队友打出了生涯代表作。他让篮球看起来像一场完美的合奏。' },
    { tags:['defender','champion'], text:'冠军球队的防守，往往有一个让所有人安心的人。{姓名}用他的存在，让防线变得更有弹性。' },
    { tags:['default'], text:'{姓名}的巅峰期，是他职业生涯最明亮的段落。他没有辜负那段时光，也没有辜负相信他的人。' },
    { tags:['scorer','playmaker'], text:'{姓名}的巅峰，不是某一个位置的极限，而是整支球队的可能性。他的全面让战术有了更多选择。' },
    { tags:['champion','dynasty'], text:'王朝球队最需要的，是那些愿意做细节的人。{姓名}把细节做到了极致，也把冠军留在了这座城市。' },
    { tags:['defender','late_peak'], text:'晚年的{姓名}，防守依然让年轻人汗颜。他用经验告诉所有人，防守不只是身体，更是意识。' },
    { tags:['default'], text:'巅峰期的{姓名}，让教练在困难时刻第一个想到他。这种信任，是他用一场场比赛挣来的。' }
  ],
  transfer: [
    { tags:['multi_city','champion'], text:'离开{球队1}之后，{姓名}没有把过去留在身后。他把在那里学到的坚韧带到下一批队友身边。后来冠军真正到来时，他也明白，那份记忆里有每一站的影子。对他来说，换队不是抹掉前一章，而是在新的城市继续写同一本书。' },
    { tags:['multi_city','no_ring'], text:'辗转多队没有让{姓名}变得零散，反而让他的生涯多了几种不同的光。{城市1}记住他的成长，{城市2}记住他的承担，{城市3}记住他仍然认真对待每一次上场。不是每一站都有圆满结果，但每一站都留下了他真实生活过的痕迹。' },
    { tags:['multi_city'], text:'加盟{球队2}时，外界最常问的问题是他还剩多少油。{姓名}没有回答。他只是照常训练，照常防守，照常在第一场硬仗里把怀疑声一点点压低。新队友很快发现，他带来的不只是能力，还有一种每天准时出现、认真把小事做好的气质。' },
    { tags:['multi_city','late_peak'], text:'{球队2}并不是{姓名}旅途的终点，而是他又一次重新开始的起点。外界习惯用“还剩多少油”提问，他却用一场场扎实的比赛回答。换队没有让他变得敏感，反而让他更清楚自己真正重要的东西：上场、承担、让新队友信任。' },
    { tags:['multi_city','champion'], text:'交易发生时，{姓名}没有把情绪写在脸上。他知道职业球员的行李要随时准备好，也知道每一站都值得认真对待。后来冠军真正到来时，那些曾经的不确定性也变成了路上的一部分。' },
    { tags:['multi_city','no_ring'], text:'在几支球队之间辗转，{姓名}学会了快速识别一座城市的脾性：哪里的人更早到球馆，哪里的人会为一记普通回防起立，哪里的人把“忠诚”两个字看得比胜利还重。他没有在每个地方停留足够久，却让每一站都留下了自己的印记。' },
    { tags:['default'], text:'离开{球队1}那天，{姓名}在机场接到很多队友的短信。他没有一一回复煽情的话，只在登机前发了一条：都好好打。后来大家才明白，这就是他的告别方式——把关系放在行动里，而不是放在眼泪里。' }
    ,
    { tags:['multi_city','champion'], text:'交易到{球队2}的第二天，{姓名}就出现在了训练馆。他没有先聊角色和战术，而是先把每一位队友的名字和习惯记住。新教练后来常说，那种人不需要太多磨合。' },
    { tags:['multi_city','late_peak'], text:'{姓名}晚年来到{球队2}时，很多人觉得他只是来过渡的。他没有解释，只是在新赛季第一场就用防守和传球证明了：哪怕角色变小，他依然能让球队变得更好。' },
    { tags:['multi_city','no_ring'], text:'换队对{姓名}来说不是结束，而是另一种开始。他带着上一站的教训和新一站的好奇，把每一次更衣室重新认识一遍，也让每座城市重新认识一遍他。' },
    { tags:['multi_city'], text:'{姓名}第一次代表{球队2}打客场时，球迷举着欢迎他的牌子。他说那一刻很奇妙：上一站的人们还在怀念他，这一站的人们已经愿意相信他。' },
    { tags:['multi_city','scorer'], text:'加盟{球队2}后，{姓名}很快适应了新的进攻体系。他没有强行复制上一站的打法，而是先观察队友的习惯，再把自己嵌进去。' },
    { tags:['multi_city','defender'], text:'{姓名}在新球队赢得信任的方式，和从前一样：先从防守做起。他不需要一上来就证明进攻，只要让队友知道他会拼命护住每一次防守，更衣室就会慢慢接纳他。' },
    { tags:['multi_city','playmaker'], text:'{姓名}换队后最花心思的事，是记住每个队友喜欢在哪里接球。他会在训练后多留半小时，和新搭档演练那些别人看不见的默契。' },
    { tags:['multi_city','champion'], text:'冠军球队的拼图，有时候就是一次恰到好处的交易。{姓名}来到{冠军球队}时，球队缺的正是他带来的经验、防守和冷静。' },
    { tags:['multi_city','no_ring'], text:'{姓名}在几支球队之间辗转，行李越来越少，心却越来越稳。他说漂泊教会他一件事：家的感觉不是由球衣颜色决定的，而是由并肩作战的人决定的。' },
    { tags:['multi_city'], text:'第一次回到{球队1}主场时，{姓名}在球员通道里停了一下。他没有回头，也没有刻意表现得轻松，只是走上场，然后认真打完了那场比赛。' },
    { tags:['multi_city','late_peak'], text:'{姓名}晚年换队，被外界解读为“去抱大腿”。他不在意这些说法，因为他知道自己能带去什么：一场关键防守、一次冷静传球、一份让年轻队友安心的存在感。' },
    { tags:['multi_city','scorer'], text:'在{球队2}的第一个赛季，{姓名}的得分数据并不亮眼，但他总是出现在球队最需要的地方。教练说，有些球员的价值要赛季结束后回头看才清楚。' },
    { tags:['multi_city','defender'], text:'{姓名}转会后的第一堂训练课，就给新队友上了一课：防守不是喊口号，而是提前站在正确的位置，让对手每一次突破都要多想一想。' },
    { tags:['multi_city','playmaker'], text:'{姓名}在{球队2}的传球，很快让年轻球员打得更舒服。他总能在包夹到来前出球，在队友跑出空位前把球送到，让进攻看起来简单了许多。' },
    { tags:['multi_city','champion'], text:'来到{冠军球队}的那个赛季，{姓名}终于触摸到了冠军。他后来说，那座奖杯里也有上一站的影子，因为每一段路都算数。' },
    { tags:['multi_city','no_ring'], text:'{姓名}的漂泊生涯，没有让他变得圆滑，反而让他更清楚自己是谁。他不需要一座城市来定义他，因为他走到哪里都会认真生活。' },
    { tags:['multi_city'], text:'换队后的{姓名}，最常被问的问题是“你适应吗”。他总是回答：我会适应的，因为我知道篮球在哪里都能打，只要人是对的。' },
    { tags:['multi_city','late_peak'], text:'{姓名}晚年加入{球队2}，不是贪图轻松，而是相信自己的经验还能帮助年轻人。他确实做到了：新秀们都说，有他在场上，心会稳很多。' },
    { tags:['multi_city','scorer'], text:'在{球队2}，{姓名}的角色变成了配角，但他把配角也演得很认真。他不再每晚拿高分，却总在关键时刻投进那颗最需要的球。' },
    { tags:['multi_city','defender'], text:'{姓名}转会后的防守，让新队友第一次感受到什么叫“身后有人”。他让外线敢于压迫，让内线敢于协防，因为知道他会在后面补位。' },
    { tags:['multi_city','playmaker'], text:'{姓名}在{球队2}的组织，不是一个人的表演，而是让每个人都参与进来。他的传球像一根线，把散落的队友缝成一件完整的球衣。' },
    { tags:['multi_city','champion'], text:'{姓名}在{冠军球队}夺冠后，特意给{球队1}的老队友打了电话。他说这份喜悦里也有他们的份，因为正是那段日子让他学会了怎么为团队活着。' },
    { tags:['multi_city','no_ring'], text:'没有戒指的漂泊者，往往更容易被遗忘。可{姓名}让每座城市都记得他认真生活过，这就是他留下来的方式。' },
    { tags:['multi_city'], text:'{姓名}每次换队都会重新找房子、重新认路、重新记住球馆的每一扇门。他说这不是麻烦，而是重新开始的机会。' },
    { tags:['multi_city','late_peak'], text:'晚年的{姓名}转会，不再是为了证明什么，而是为了在还能打的时候，把最后的热量留给需要的人。' },
    { tags:['multi_city','scorer'], text:'{姓名}在{球队2}的得分方式变得更简洁：更多无球跑动，更少勉强出手。他的效率反而提高了，因为经验告诉他该在哪里等球。' },
    { tags:['multi_city','defender'], text:'新球队的教练第一次看{姓名}训练防守，就放心地把年轻球员交给他带。他说：有些东西是数据教不会的。' },
    { tags:['multi_city','playmaker'], text:'{姓名}换队后的第一场比赛，就给新队友送出了几次漂亮的助攻。赛后他笑着说：我只是想让他们知道，把球给我，我会找到他们。' },
    { tags:['multi_city','champion'], text:'冠军赛季的转会，常常被视为神来之笔。{姓名}来到{冠军球队}，带来了经验、稳定和一颗只想赢的心。' },
    { tags:['multi_city','no_ring'], text:'{姓名}的生涯没有停留在某一支球队，但他的每一次离开都留下了真诚。他从不把“忠诚”挂在嘴边，却用每一天的认真践行着另一种忠诚：对篮球的忠诚。' },
    { tags:['multi_city'], text:'回到旧主场的{姓名}，总会被球迷鼓掌欢迎。他没有说过“这里是我的家”，但每次比赛结束后，他都会向那片看台挥手致意。' },
    { tags:['multi_city','late_peak'], text:'{姓名}晚年转会，外界说他应该退役了。他没有回应，只是在新赛季用一场硬仗让所有人闭嘴：他的经验还值钱，他的人还在场上。' },
    { tags:['multi_city','scorer'], text:'在{球队2}，{姓名}的角色被重新定义：从主攻手变成关键先生。他不再需要每晚证明自己，只需要在最需要的时候出现。' },
    { tags:['multi_city','defender'], text:'{姓名}的转会，让{球队2}的防守多了一层保险。他的补防和沟通，让原本松散的防线慢慢变得紧密。' },
    { tags:['multi_city','playmaker'], text:'新队友们很快发现，{姓名}的传球从不自私。他愿意把球给正在起势的人，哪怕那会让自己少一个助攻。' },
    { tags:['multi_city','champion'], text:'{姓名}在{冠军球队}赢得冠军后，把奖杯带回了老东家的城市展览。他说，这座城也等过太久，应该看到这份圆满。' },
    { tags:['multi_city','no_ring'], text:'漂泊的生涯没有让{姓名}失去温度。他在每座城市都留下过朋友，也在每段回忆里都留下过自己的名字。' },
    { tags:['multi_city'], text:'{姓名}的行李箱里，总放着一张旧球衣照片。记者问那是什么，他说：那是提醒自己，无论走到哪里，都不要忘记最初为什么打球。' },
    { tags:['multi_city','late_peak'], text:'晚年换队的{姓名}，很快成了新更衣室里的老大哥。年轻人愿意听他的话，因为他的建议都来自自己走过的弯路。' },
    { tags:['multi_city','scorer'], text:'{姓名}在{球队2}的第一个赛季，曾在一场关键比赛中连续得分。赛后他说，这不是证明给谁看，只是想告诉新队友：我还能打。' },
    { tags:['multi_city','defender'], text:'转会后的{姓名}，把防守当成与新球队沟通的语言。他不需要说太多，只要让队友看到他拼尽全力，信任就会慢慢建立。' },
    { tags:['multi_city','playmaker'], text:'{姓名}的组织能力，在换队后依然没有打折。他的传球让年轻队友的进攻变得简单，也让教练的战术变得流畅。' },
    { tags:['multi_city','champion'], text:'{姓名}的冠军，是在辗转之后赢得的。他说那段路让他更懂得珍惜：不是每一座城市都能等到圆满，所以更要认真对待每一天。' },
    { tags:['multi_city','no_ring'], text:'没有戒指的{姓名}，依然是很多球迷心中的冠军。因为他赢下的不是某一场比赛，而是每一个认真生活的日子。' },
    { tags:['multi_city'], text:'{姓名}离开{球队1}时，把更衣室的柜子收拾得很干净。他说，职业球员要随时准备离开，但也要让下一任使用者感受到被尊重。' },
    { tags:['multi_city','late_peak'], text:'{姓名}晚年加入{球队2}，球队管理层看重的是他的经验。他果然没有让人失望：在最紧张的更衣室里，他总能先让大家冷静下来。' },
    { tags:['multi_city','scorer'], text:'在{球队2}，{姓名}的得分机会变少了，但他的效率没有下降。他说，角色可以变，对自己的要求不能变。' },
    { tags:['multi_city','defender'], text:'{姓名}转会后的防守，很快成为新球队的标签之一。他让对手知道，这支球队不好惹。' },
    { tags:['multi_city','playmaker'], text:'{姓名}在{球队2}的传球，让很多年轻球员第一次体会到“被信任”的感觉。他们说，那比一次助攻更珍贵。' },
    { tags:['multi_city','champion'], text:'冠军赛季的{姓名}，已经不是球队最年轻的球员，却是最稳的那一个。他用行动告诉所有人，经验也是一种武器。' },
    { tags:['multi_city','no_ring'], text:'{姓名}的漂泊，没有让他变得冷漠。他依然会在新城市的第一周，找到那家最好吃的早餐店，然后和店员成为朋友。' },
    { tags:['multi_city'], text:'{姓名}每次换队，都会经历一段孤独的适应期：不认识路，不认识人，不知道更衣室里的玩笑该怎么接。但他总能找到自己的节奏。' },
    { tags:['multi_city','late_peak'], text:'晚年的{姓名}选择加盟{球队2}，是因为他相信那里还有未完成的可能。他没有让那份相信落空。' },
    { tags:['multi_city','scorer'], text:'在{球队2}，{姓名}的角色是“把球投进的人”。他接住了这个角色，也接住了随之而来的压力。' },
    { tags:['multi_city','defender'], text:'{姓名}的防守，让新队友学会了在场上喊话。他说，防守的第一件事不是伸手，而是沟通。' },
    { tags:['multi_city','playmaker'], text:'{姓名}在{球队2}的组织，让球队的进攻不再依赖单打。他让每个人都跑起来，也让每个人都觉得自己重要。' },
    { tags:['multi_city','champion'], text:'{姓名}把冠军带回{冠军球队}的那个夏天，城市举行了盛大的游行。他在人群中看到了来自老东家的球迷，举着牌子写着：我们也为你骄傲。' },
    { tags:['multi_city','no_ring'], text:'没有戒指的漂泊生涯，常常被写成遗憾。但{姓名}让那些年份有了另一种颜色：它们证明了一个人可以不被环境改变，坚持做对的事。' },
    { tags:['multi_city'], text:'{姓名}换队后的第一场比赛，总会打得格外用力。他说那不是想证明给旧东家看，而是想给新队友一个交代。' },
    { tags:['multi_city','late_peak'], text:'{姓名}晚年在{球队2}的角色，是更衣室里的定心丸。年轻球员说，只要他还在场上，大家就不会慌。' },
    { tags:['multi_city','scorer'], text:'在{球队2}，{姓名}学会了如何用更少的球权做更多的事。他的比赛变得简洁，也变得更加致命。' },
    { tags:['multi_city','defender'], text:'{姓名}的转会，让{球队2}的防守有了主心骨。他不用得分也能影响比赛，因为他站在每一个正确的位置。' },
    { tags:['multi_city','playmaker'], text:'{姓名}在{球队2}的第一堂录像课，就指出了几个年轻队友的跑位问题。他不是批评，而是告诉他们：球会找到正确的人。' },
    { tags:['multi_city','champion'], text:'冠军需要拼图，{姓名}就是那块让一切都合适的拼图。他来到{冠军球队}后，球队的攻防都变得更加完整。' },
    { tags:['multi_city','no_ring'], text:'{姓名}没有在某一座城市停下，却让每座城市都留下了他的印记。他的一生，是一段没有终点却从未迷失的旅程。' },
    { tags:['multi_city'], text:'{姓名}最常对年轻队友说的一句话是：适应新环境最快的方法，就是把每一天都当作新的一天来认真过。' },
    { tags:['multi_city','late_peak'], text:'晚年的{姓名}，转会不再是新闻，但他依然值得被新闻认真对待。因为他的经验，是很多球队最缺的东西。' },
    { tags:['multi_city','scorer'], text:'在{球队2}，{姓名}的得分能力被重新认识。他不再是那个每晚扛起球队的人，却是那个在最关键的时候绝不手软的人。' },
    { tags:['multi_city','defender'], text:'{姓名}转会后的防守习惯，很快影响了整支球队。新队友开始学着提前站位，学着在对手出手前先干扰。' },
    { tags:['multi_city','playmaker'], text:'{姓名}在{球队2}的组织，让球队的年轻核心打得更轻松。他像一盏灯，照亮了别人，也顺便照亮了自己的路。' },
    { tags:['multi_city','champion'], text:'{姓名}的冠军之路并不笔直，但他把每一段弯路都走成了风景。当他终于举起奖杯时，没有人觉得这是运气。' },
    { tags:['multi_city','no_ring'], text:'没有戒指的{姓名}，用他的漂泊诠释了另一种忠诚：他忠于的不是某支球队，而是每一次上场都全力以赴的自己。' },
    { tags:['multi_city'], text:'{姓名}换队时，总会收到球迷的告别横幅。他没有太多煽情的话，只在离开前把训练馆的灯关好，就像他做过的每一天一样。' },
    { tags:['multi_city','late_peak'], text:'{姓名}晚年在{球队2}的时光，比很多人预期的更长。因为他带来的不只是能力，还有一种让球队愿意留住他的气质。' },
    { tags:['multi_city','scorer'], text:'在{球队2}，{姓名}的最后一投常常被提起。那不是他生涯最重要的球，却是新球迷认识他的第一球。' },
    { tags:['multi_city','defender'], text:'{姓名}的防守，让他在每一支球队都很快赢得尊重。新队友们说：他不用说话，我们也会跟着他拼。' },
    { tags:['multi_city','playmaker'], text:'{姓名}在{球队2}的传球，让球队的进攻多了一种可能性。他让年轻球员相信，篮球是可以被分享的。' },
    { tags:['multi_city','champion'], text:'冠军赛季的转会，对{姓名}来说是迟来的圆满。他没有抱怨过从前，只是把每一段经历都变成了夺冠路上的台阶。' },
    { tags:['multi_city','no_ring'], text:'{姓名}的漂泊生涯，被许多人写进故事。故事的结尾不是冠军，而是一个认真的球员，走过许多城市，留下许多温暖。' }
  ],
  era: [
    { tags:['franchise_savior','champion'], text:'在{时代球队}的{时代年份}年里，{姓名}给这支球队带来的不只是{时代荣誉}。至少在他效力的这些赛季里，球迷有了许多可以反复想起的夜晚：关键回合、季后赛的呼吸、夺冠后的拥抱，以及那种终于可以把期待说出口的踏实感。' },
    { tags:['dynasty_builder'], text:'{时代球队}的这段岁月，后来被球迷一遍遍讲起，不只是因为{时代荣誉}，更因为那支球队在{姓名}身边形成了稳定的性格。年轻人知道犯错后有人补位，老将知道关键时刻有人接住压力，教练知道战术板上最难画的那部分，场上总有人能替他完成。' },
    { tags:['defensive_identity'], text:'{姓名}在{时代球队}留下的最大变化，是让球队拥有了防守的骨架。外线敢压，是因为知道他在身后；年轻人敢犯错，是因为知道他会在下一次暂停时告诉你该站在哪里。几年之后，人们谈起那支球队，第一反应不再只是天赋，而是纪律、补位、身体对抗和他在关键区域举起的双手。' },
    { tags:['offensive_system'], text:'在{时代球队}，{姓名}慢慢成了进攻最安心的入口。球队不只是把球交给他得分，也把节奏、空间和许多人的信心交给他照看。那些年里，队友的空位更舒服，年轻人的出手更果断，很多原本混乱的回合，因为他的一次选择变得清楚。' },
    { tags:['short_stay_legend','champion'], text:'他在{时代球队}停留的时间并不算长，却留下了足够球迷反复回味的东西。{时代年份}年，{时代荣誉}，这些数字放在一起像一段短诗：不是最长的陪伴，却在最需要被记住的节点上，给这段队史添了一束很亮的光。' },
    { tags:['late_career_gift'], text:'来到{时代球队}时，{姓名}已经不是最年轻的自己了。可正因为如此，这段岁月反而更温柔。他把经验、耐心和一身旧伤换来的判断力带给队友，也把职业生涯后半段最珍贵的一部分，留给了这座原本只是下一站、后来却变成记忆的城市。' },
    { tags:['rebuild_anchor'], text:'{时代球队}那几年并不总是热闹，甚至有些夜晚输得很安静。可{姓名}让重建不再只是等待。他每天出现，每场比赛认真对待，每次暂停都把年轻人拉回正确的位置。对那支球队来说，他像一根锚，让大家在风浪里知道自己还没有漂走。' },
    { tags:['loyal_loser'], text:'在{时代球队}，{姓名}未必等来了最圆满的结局，但他把最诚实的自己留在了那里。那些没有冠军的年份并不空白，因为球迷看见他怎样一次次站出来，怎样在失败后仍然向看台抬手，怎样把一支球队并不完美的岁月过得有尊严。' },
    { tags:['city_adopted_son'], text:'一开始，{时代球队}的球迷只是好奇他能带来什么；后来，他们开始用“我们的人”来称呼他。这样的改变没有发生在某一次采访里，而是藏在许多个普通夜晚：一次救球、一次加练、一次输球后没有逃避的发言，以及他一次次让这座城市觉得自己被认真对待。' },
    { tags:['default'], text:'{时代年份}年效力{时代球队}，{姓名}留下了{时代荣誉}，也留下了很多数据写不完的关系。他和这支球队一起赢过，也一起熬过低谷；一起被夸奖，也一起被质疑。等这段岁月结束时，人们才发现，他不只是来这里打球，也曾经真的成为这里生活的一部分。' },
    { tags:['franchise_savior'], text:'{时代球队}最难的几年，是{姓名}把球队从“等待重建”拉回“认真竞争”的几年。他不是用一个夏天改变一切，而是用每一个主场的夜晚慢慢重新点亮球迷的信心。{时代年份}年里，他让这座城市重新相信：输球不是习惯，赢球也不是侥幸。' },
    { tags:['offensive_system'], text:'在{时代球队}，{姓名}让进攻第一次有了自己的语法。球不在他手里时，队友也知道该往哪里移动；球在他手里时，时间仿佛会慢下来。他把那些复杂的战术变成场上自然而然的选择，也让年轻队友第一次理解了什么叫空间和节奏。' },
    { tags:['defensive_identity','rebuild_anchor'], text:'{时代球队}后来被人提起，总会说到那套被{姓名}带出来的防守气质：不抱怨、不放弃、每个回合都把身体横在对手和篮筐之间。重建期的球队最缺的不是天赋，而是某种可以依赖的标准，而他恰好把标准立了起来。' },
    { tags:['loyal_loser'], text:'在{时代球队}，{姓名}和冠军之间的距离像一条反复被缩近又被拉开的线。他输过很多让人遗憾的系列赛，可每一次输球后，他都会在更衣室里把话说清楚：明年重新来。球迷后来回忆那几年，最忘不掉的不是某场胜利，而是他从来没有先放弃。' }
    ,
    { tags:['franchise_savior','champion'], text:'{时代球队}的冠军，不是突然降临的礼物，而是{姓名}和队友们用{时代年份}年慢慢修出来的路。他把最难的夜晚扛下来，也把最亮的光分给所有人。那段路里没有捷径，只有一次次把输球的夜晚变成第二天训练的起点，后来球迷回看那几年，才发现每一座奖杯都是这些普通日子堆出来的。' },
    { tags:['dynasty_builder'], text:'{时代球队}的王朝记忆里，{姓名}是那个让一切不散架的人。他未必每场都上头条，却总在需要的时候补上最关键的缺口：一次卡位、一次沟通、一次把年轻队友从沮丧里拉回来的暂停。后来人们复盘那几年，发现少了这些不起眼的瞬间，再漂亮的阵容也撑不起一座王朝。' },
    { tags:['offensive_system'], text:'{姓名}在{时代球队}的进攻体系里，承担着最难的阅读任务。他让战术不再是教练板上的线条，而是场上自然发生的事：球到谁手里，谁就明白下一步该往哪里走。队友们后来都说，和他打球，进攻会变得简单，因为答案总是提前出现在正确的位置。' },
    { tags:['defensive_identity'], text:'{时代球队}最鲜明的标签，是那套由{姓名}参与建立起来的防守文化。后来无论人员怎么更换，只要那套标准还在，球队就还是那支球队：每个人都知道自己该站的位置，也知道队友会在身后补上那一步。这种默契不是一天形成的，而是从每一堂训练课开始慢慢长出来的。' },
    { tags:['short_stay_legend'], text:'{姓名}在{时代球队}停留的时间不长，却让每一场比赛都显得很长。{时代年份}年，他把自己的名字写进了那段队史最亮的位置，也用有限的时间留下了足够球迷反复回味的瞬间：一次关键防守、一场逆转、一个让整座城市记住他的夜晚。' },
    { tags:['late_career_gift'], text:'来到{时代球队}时，{姓名}已经不再年轻，但他把职业生涯最后一段认真留给了这里。他不抢球权，不抢镜头，只把自己的判断、耐心和一身旧伤换来的经验交给年轻人。那些年轻球员后来都说，遇到他是一种幸运，因为他让他们少走了很多弯路。' },
    { tags:['rebuild_anchor'], text:'{时代球队}重建的那几年，最需要的不是天才，而是有人愿意先立下标准。{姓名}就是那个标准：准时、认真、不逃避，赢球不飘，输球不散。他让年轻人在混乱里看到了职业球员该有的样子，也让重建不再只是漫长等待，而是一段有人领路的过程。' },
    { tags:['loyal_loser'], text:'{时代球队}没有给{姓名}最圆满的结局，但他给了这座城市最完整的自己。那些没有冠军的年份，因为他的坚持而有了重量：他输过，却不曾先放弃；他遗憾，却不曾把责任推给别人。后来球迷回忆那几年，记住的不是缺失的奖杯，而是他始终站着的背影。' },
    { tags:['city_adopted_son'], text:'{时代球队}的球迷最初叫他“新来的”，后来改口叫“我们的人”。这种改变发生得很慢，却因为{姓名}每一晚都认真对待而变得牢固：他在普通比赛里拼命回防，在输球后没有躲开话筒，在社区活动里第一个出现。等到大家回过神，他已经成了这座城市的一部分。' },
    { tags:['default'], text:'在{时代球队}的{时代年份}年，{姓名}把许多普通夜晚过成了值得记住的日子。他没有刻意制造故事，故事却一直跟着他：一次加练、一次关键的传球、一次在落后时稳住全队的暂停。后来人们发现，那些看似平常的夜晚，才是这段岁月最结实的部分。' },
    { tags:['franchise_savior'], text:'{时代球队}最低谷时，{姓名}没有选择离开。他说，如果所有人都想走，那这座城市就真的没人守了。他留下来，不是因为他相信奇迹，而是因为他相信每一天都值得认真过：训练、比赛、沟通，一件件小事慢慢把球队从谷底托了起来。' },
    { tags:['dynasty_builder','defender'], text:'王朝需要防守的骨架，{姓名}就是那根最硬的骨头。他的补防、卡位和沟通，让{时代球队}的防线在关键比赛里从未散过；对手每一次突破都要先过他这一关，年轻队友也因为他敢于向外压一步。后来复盘王朝赛季，录像里最常出现的不是扣篮，而是他提前站好的位置。' },
    { tags:['offensive_system','playmaker'], text:'{姓名}在{时代球队}最厉害的地方，是让进攻看起来毫不费力。其实那些轻松的得分，都来自他日复一日对细节的打磨：队友的习惯、对手的弱点、节奏的起伏，全被他记在心里。他不需要喊话，队友就知道该往哪里跑，因为他的传球总在正确的时间出现。' },
    { tags:['defensive_identity','champion'], text:'{时代球队}的冠军赛季，防守是整支球队的信仰，而{姓名}是让信仰落地的人。他让每一次防守都有了标准：不抱怨、不放弃、每个回合都把身体横在对手面前。那枚冠军戒指里，有他无数次提前站好的位置，也有他让全队愿意相信防守的坚持。' },
    { tags:['short_stay_legend','champion'], text:'{时代年份}年很短，{姓名}却让这段时间变得很长。他带来的冠军记忆，让{时代球队}的球迷愿意反复讲述很多年：那轮系列赛的呼吸、那座奖杯的温度、以及他终于把这座城市等了很久的期待变成现实的夜晚。' },
    { tags:['late_career_gift','playmaker'], text:'{姓名}晚年加盟{时代球队}，不是来养老的，而是来传艺的。他把自己的比赛理解，毫无保留地交给了更衣室里的年轻人：什么时候该传球，什么时候该停球，什么时候该把舞台让给队友。他留下的不只是数据，而是一整套年轻人可以用很多年的打球方式。' },
    { tags:['rebuild_anchor','default'], text:'{时代球队}的重建期，{姓名}像一根定海神针。他不让球队在连败里散掉，也不让年轻人在挫折里怀疑自己；每场赛后他都会把大家叫到一起，把话说清楚，再把第二天要做的事安排好。正是这种稳定，让重建中的更衣室始终没有失去方向。' },
    { tags:['loyal_loser','scorer'], text:'{姓名}在{时代球队}输过很多场，却也赢下过许多让人难忘的夜晚。那些夜晚加起来，让“遗憾”这个词变得不那么冷：他会在手感火热时扛起球队，也会在输球后第一个把责任揽过来。球迷后来记得的，不只是比分，还有他从不低头的模样。' },
    { tags:['city_adopted_son','one_city'], text:'{时代球队}的球迷后来常说，{姓名}不是这座城市请来的球员，而是这座城市养大的孩子。他在这里学会承担责任，也在这里把最好的年华留下；他在街头和孩子们打球，在赛后记得每一位老球迷的名字。等到他离开时，整座城市都觉得自己失去了一位家人。' },
    { tags:['default'], text:'{时代年份}年，{姓名}在{时代球队}留下了{时代荣誉}，也留下了一整套关于如何打球的记忆。他不只是数据表上的名字，更是更衣室里那句“先做好小事”的提醒者。后来的人谈起那段岁月，会说：那支球队有一种让人安心的气质，而那种气质里有他的一份。' },
    { tags:['franchise_savior','scorer'], text:'{时代球队}最需要得分的时候，{姓名}总是出现在正确的位置。他让球队从“等待希望”变成了“自己创造希望”：每一次无球跑动、每一记关键出手，都在告诉队友机会要靠自己跑出来。后来那支球队的年轻人都学会了一件事：把球给他，然后相信他会找到答案。' },
    { tags:['dynasty_builder','champion'], text:'{时代球队}的王朝不是一个人的，但如果没有{姓名}，那些王朝时刻可能不会到来。他做了所有不被记录却必须做的事：防守沟通、情绪稳定、关键回合的选择。奖杯上刻着他的名字，而更衣室记得他的方式，是那句“先把这回合打好”。' },
    { tags:['offensive_system','scorer'], text:'在{时代球队}，{姓名}把得分变成了一种体系里的自然选择。他不是强行出手，而是让每一次得分都成为战术的结果：挡拆后的选择、空切时的时机、对手换防后的惩罚，全都被他算得清清楚楚。他让得分看起来像水到渠成，其实那背后是无数次录像和训练。' },
    { tags:['defensive_identity','no_ring'], text:'{时代球队}那支防守强队，最终没有赢得冠军，却赢得了尊重。{姓名}是那支球队里最安静也最硬的一块：他不抢镜头，不刷数据，只把每一个回合的防守做到位。多年以后人们谈起那几年，会先想起那套让对手难受的防守，然后想起他站在最前面举起双手的样子。' },
    { tags:['short_stay_legend'], text:'{姓名}在{时代球队}的时间虽然不长，却让新队友们记住了一件事：认真对待每一天，时间会给你答案。他从不因为自己是“短住”就少练一分钟，反而用最短的时间把战术、队友和这座城市都记进了心里。离开以后，那支球队的年轻人仍然会提起他教过的细节。' },
    { tags:['late_career_gift','defender'], text:'{姓名}晚年加盟{时代球队}，让球队的防守立刻有了老将的稳重。他教年轻人如何站位，也教他们如何承受压力：对手起势时不慌，裁判误判时不急，输球之后先把情绪收好。那些年轻球员后来才知道，他教的不只是防守，还有怎样在漫长赛季里稳住自己。' },
    { tags:['rebuild_anchor','champion'], text:'{时代球队}从重建到夺冠，{姓名}全程都在。他不是最年轻的那个，却是最稳定的那个：球队低谷时他在，阵容调整时他在，最关键的系列赛里他也站在最需要他的位置。后来那枚冠军戒指戴在他手上时，所有人都觉得理所当然，因为这条路他陪球队走了太久。' },
    { tags:['loyal_loser','one_city'], text:'{时代球队}的球迷心疼{姓名}，因为他把最好的年华留在了这里，却没有等来圆满。他反过来安慰球迷：能一起打这么久，已经很好了。那些没有冠军的夜晚，他仍然准时出现在训练馆，仍然在每一次失败后把话说清楚，让这座城市觉得遗憾里也有尊严。' },
    { tags:['city_adopted_son','champion'], text:'{时代球队}的冠军夜，整座城市都在喊{姓名}的名字。那一刻，他真的成了这座城市的一部分：从“新来的”到“我们的人”，从被观察的外援到被拥戴的自己人。那枚奖杯照亮的不只是冠军，还有这座城市和他之间慢慢长出的感情。' },
    { tags:['default'], text:'在{时代球队}的岁月里，{姓名}学会了把球队扛在肩上，也学会了把荣誉分给每一个人。他从不独占功劳，也从不躲开责任：赢球时先夸队友，输球时先说自己。那些年积累起来的信任，后来成了他在每支球队都能迅速站稳的原因。' },
    { tags:['franchise_savior','defender'], text:'{时代球队}的崛起，从防守开始，而{姓名}是那个让防守有了灵魂的人。他让对手每次进攻都付出代价：突破要过他，投篮要躲他，连传球路线都要多看一眼。他把防守从苦活变成了球队的骄傲，也让年轻队友第一次明白，认真防守可以赢下尊重。' },
    { tags:['dynasty_builder','playmaker'], text:'王朝球队的进攻，常常被归功于明星球员，但{姓名}让球流动起来的那份工作，同样不可或缺。他总能在正确的时机把球送到正确的人手里，让每个人的出手都变得更舒服。录像师后来最喜欢回放他的传球，因为那些球里藏着王朝最流畅的部分。' },
    { tags:['offensive_system','default'], text:'{姓名}在{时代球队}的进攻体系里，是最愿意牺牲数据的人。他让队友更好，也让球队更好：少一个助攻，多一次正确传球；少一次出手，多一个更好的机会。他从不抱怨角色，因为他相信胜利会记住所有默默完成的事。' },
    { tags:['defensive_identity','late_peak'], text:'{姓名}晚年在{时代球队}，依然坚持每堂防守训练都亲自示范。他说，标准一旦降下来，就很难再提回去。年轻球员看着他把同一个站位重复练了十几遍，终于明白为什么他到了这个年纪还能让对手难受：那些基本功，他从没有一天放下过。' },
    { tags:['short_stay_legend','no_ring'], text:'{姓名}在{时代球队}停留的时间不长，却让球迷记住了一种感觉：他在的每一场，球队都还有办法。即使没有冠军，他也用一次次回防、一记记关键球和每场赛后认真的采访，让这座城市觉得那段短时光值得被珍惜。' },
    { tags:['late_career_gift','champion'], text:'{姓名}晚年加盟{时代球队}，最终捧起了冠军。他说，这份礼物不是给他的，是给那些一直相信他的人：相信他还能打，相信经验有用，相信老将值得被尊重。那枚戒指戴上的那一刻，很多人的等待终于有了回音。' },
    { tags:['rebuild_anchor','playmaker'], text:'{时代球队}重建时，{姓名}是那个让年轻人敢出手的人。他的传球告诉他们：犯错没关系，我会把球再给你。他不只喂出助攻，更喂出信心：年轻人投丢后，他会主动把球找回来；年轻人犹豫时，他会用眼神示意“就现在”。' },
    { tags:['loyal_loser','defender'], text:'{时代球队}没能夺冠，但{姓名}的防守成了那几年最值得尊敬的东西。他让每场失利都保留着尊严：即使比分落后，他也不会让对手轻松得分；即使赛季提前结束，他也会把最后一场防完。后来球迷回忆那几年，会说：我们没有冠军，但我们有他。' },
    { tags:['city_adopted_son','scorer'], text:'{时代球队}的球迷记得{姓名}的每一记关键球，也记得他投丢后仍然抬头继续跑的样子。他让得分变得有温度：进球后先找队友击掌，失手后下一回合立刻用防守找回节奏。那几年，他的名字和这座城市紧紧连在一起。' },
    { tags:['default'], text:'{时代年份}年的{时代球队}，因为{姓名}的存在而多了一种性格：不慌、不散、不放弃。他在场时，队友知道节奏会稳；他休息时，替补席也知道该守住底线。那支球队未必最华丽，却因为他的稳定而变得很难被打垮。' },
    { tags:['franchise_savior','champion'], text:'{姓名}把{时代球队}从低谷带回巅峰，靠的不是一个人，而是让所有人都相信：我们可以。他先把自己的标准立起来，再把信心分给每一个队友：年轻人敢拼了，老将愿意多扛了，教练的战术有人执行了。冠军只是这份信任最终开出的花。' },
    { tags:['dynasty_builder','default'], text:'{时代球队}的王朝记忆里，有无数个普通回合，{姓名}在那些回合里做了正确的小事，最后堆积成了大成就。他不在数据榜最顶端，却在每一个需要稳定军心的时刻出现。后来的人们复盘王朝，会发现那些冠军来自无数个他没有被记住的选择。' },
    { tags:['offensive_system','late_peak'], text:'{姓名}晚年在{时代球队}的进攻，更像一种教科书：不急着出手，先把空间读清楚。他不再追求速度，而是用假动作、节奏和耐心让年轻防守者失去重心。教练说，看他晚年打球，就像在看一门关于阅读比赛的课。' },
    { tags:['defensive_identity','scorer'], text:'{时代球队}最让人又爱又恨的，是那套攻防一体的风格，而{姓名}正好是攻防两端的连接点。他能在防守端抢回球权，也能在进攻端立刻找到正确的位置。对手以为他只是硬，直到他投进关键球才发现，他比看起来更难对付。' },
    { tags:['short_stay_legend','late_peak'], text:'{姓名}在{时代球队}的短暂时光，是他生涯最后的闪光。他让这里记住的不只是结果，还有过程：每一次提前到场、每一次赛后加练、每一次把年轻人叫到身边讲解细节。时间虽短，却因为他认真对待而变得很长。' },
    { tags:['late_career_gift','scorer'], text:'{姓名}晚年加盟{时代球队}，用自己的经验帮助球队在关键回合做出正确选择。他不再像年轻时那样硬冲，而是用节奏、假动作和对手的防守习惯找到最舒服的出手。他的得分不多，但每一分都出现在球队最需要的时候。' },
    { tags:['rebuild_anchor','defender'], text:'{时代球队}重建时，{姓名}用防守立起标准，让年轻球员知道职业篮球的最低要求是什么：每回合回防、每回合沟通、每回合都把身体放在正确的位置。他没有用口号教他们，而是自己在每一场训练里先做给他们看。后来这支球队的防守，就是从那些标准里长出来的。' },
    { tags:['loyal_loser','playmaker'], text:'{姓名}在{时代球队}的传球，让那些没有冠军的赛季也闪着光。他让队友们相信，篮球不只是结果：一次漂亮的助攻、一次让年轻人重拾信心的信任、一次把全队节奏带回正轨的组织，都是值得被记住的时刻。那些年份没有戒指，却有他的传球写下的温度。' },
    { tags:['city_adopted_son','default'], text:'{时代球队}的球迷后来常说，{姓名}来之前和来之后，这支球队是不同的：更衣室有了主心骨，年轻球员有了榜样，连主场的空气都多了些期待。他不是那种用嘴巴改变球队的人，而是用每一天准时出现、认真打球，慢慢让一切变得不一样。' },
    { tags:['default'], text:'{姓名}在{时代球队}的{时代年份}年，像一段被认真书写的章节：没有留白，每一页都写满了努力。他不在意外界怎么评价这一段，只在意每一场比赛有没有打完、每一个队友有没有被照顾到。后来翻回这一章，球迷会发现，那里没有遗憾的空白，只有满满当当的细节。' },
    { tags:['franchise_savior','playmaker'], text:'{时代球队}最迷茫的时候，{姓名}用一次次传球把大家拉回同一个方向。他让球队重新找到了共同的目标：每个人都知道球该往哪里走，也知道自己该往哪里跑。他不只是组织进攻，更是在组织人心，让一支快要散掉的球队重新变成整体。' },
    { tags:['dynasty_builder','scorer'], text:'王朝球队也有需要有人得分的时候，{姓名}从不让那样的时刻落空。他总能在进攻打不开时找到办法：一记中投、一次突破、一个空切后的接球出手。他不喧哗，却总在最安静的时候，把最需要的分数放进篮筐，那种得分不热闹，却总能让板凳席先站起来。' },
    { tags:['offensive_system','defender'], text:'{姓名}在{时代球队}，既理解进攻，也尊重防守。他让战术板的每一面都变得完整：进攻时他知道怎么跑出空位，防守时他知道怎么堵住漏洞。教练说，他是那种不需要专门布置太多、因为他自己就能读懂比赛的球员。' },
    { tags:['defensive_identity','champion'], text:'{时代球队}的冠军，是从防守开始的，而{姓名}是那套防守里最可靠的一环。他让对手的每一次进攻都要多花力气，让队友的每一次冒险都有后盾。冠军戒指戴在他手上时，每个人都清楚，那些防守回合和那些关键进球一样重要。' },
    { tags:['short_stay_legend','scorer'], text:'{姓名}在{时代球队}的短暂时光里，留下过几记让人反复回看的进球。那些进球不一定是绝杀，却都出现在最需要的时刻，带着他独有的节奏和冷静。时间虽短，球迷却因为那些回合，愿意把这段岁月讲很多年。' },
    { tags:['late_career_gift','default'], text:'{姓名}晚年加盟{时代球队}，没有索取什么，只把经验留下了。他把自己对比赛的理解，拆成一句句叮嘱、一次次示范，交给更衣室里的年轻人。他走之后，那些经验还在，还在每场比赛里继续替这支球队发光。' },
    { tags:['rebuild_anchor','scorer'], text:'{时代球队}重建时，{姓名}是那个既能得分又能稳定军心的人。他在进攻端扛起球权，在防守端立起标准，在更衣室里第一个开口说话。年轻人看着他，慢慢学会了什么叫职业球员：不是只在手感好时出现，而是每一天都可靠。' },
    { tags:['loyal_loser','champion'], text:'{姓名}在{时代球队}没有等到冠军，却让球队有了冠军球队的骨架。他立起的标准、养成的习惯、留下的更衣室文化，后来都成了下一批球员走上领奖台的台阶。他没有亲手举起奖杯，但后来的人踩着他铺好的路走了上去。' },
    { tags:['city_adopted_son','playmaker'], text:'{时代球队}的球迷把{姓名}当成自己人，因为他把最好的传球都留给了这座城市。他记得每一个队友的习惯，也记得每一次该把球交给谁；他的组织让球队有了人情味，也让球迷觉得，他打球不是为了自己，而是为了这里。' },
    { tags:['default'], text:'在{时代球队}的日子，{姓名}让很多球迷第一次明白：伟大不一定要用冠军来写。他每晚准时出现，每场比赛认真对待，每次失败后都愿意把责任接过来；这些看起来普通的选择，一年一年累积下来，就成了这座城市愿意反复讲述的故事。' },
    { tags:['franchise_savior','scorer'], text:'{姓名}让{时代球队}重新有了票房，也让这座城市重新有了心跳。他带来的不只是胜利，还有走进球馆时的那份期待：人们想看他打球，想看球队赢球，想和陌生人一起喊出他的名字。他让篮球重新变成这座城市共同的节日。' },
    { tags:['dynasty_builder','late_peak'], text:'{时代球队}的王朝后期，{姓名}依然在场。他用自己的稳定，让交接变得不那么疼痛：年轻球员接手时，他在旁边托着；球队动荡时，他先把更衣室稳住。他没有让王朝轰然倒塌，而是让它在时间手里慢慢、体面地交棒。' },
    { tags:['offensive_system','champion'], text:'{时代球队}的冠军进攻，最迷人的部分是每个人都在跑动，而{姓名}是让跑动有意义的人。他总能在正确的时间把球送到正确的位置，让每一次移动都变成机会。冠军的进攻看起来流畅，其实背后是他一遍遍记住队友习惯的耐心。' },
    { tags:['defensive_identity','default'], text:'{时代球队}那几年，防守成了球队的名片，{姓名}就是名片上最清晰的名字之一。他的补防、站位和沟通，让整支球队的防守有了语言。对手谈起那支球队，会说他们很难得分；而这一切，从{姓名}站上球场那一刻就已经开始。' },
    { tags:['short_stay_legend','defender'], text:'{姓名}在{时代球队}的时间不长，却让对手记住了他的防守硬度。他从不给对手轻松得分的机会，也不让任何一次快攻白白发生。时间虽短，他的防守却像一枚印记，盖在那支球队和那些对手的记忆里，直到很多年后，他们仍然会想起和他对位有多难受。' },
    { tags:['late_career_gift','playmaker'], text:'{姓名}晚年加盟{时代球队}，让年轻人的进攻变得更有章法。他教他们什么时候该传球，什么时候该自己来，什么时候该把节奏放慢。他的经验像一把尺子，让年轻球员的冲动有了分寸，也让球队的进攻多了耐心和层次。' },
    { tags:['rebuild_anchor','late_peak'], text:'{时代球队}重建期最需要老将，{姓名}就是那个愿意留下的人。他见过低谷，也见过希望，所以他知道该怎么陪一支球队慢慢走：不催、不慌、不放弃。年轻球员在场上迷茫时，只要看见他还在，就会觉得路还没有走错。' },
    { tags:['loyal_loser','scorer'], text:'{姓名}在{时代球队}的每一次得分，都在告诉球迷：就算没有冠军，我们也值得被记住。他用一场场比赛证明，一支球队的价值不只有奖杯；那些拼尽全力的夜晚、那些他扛起球队的回合，同样是这座城市篮球记忆里最亮的部分。' },
    { tags:['city_adopted_son','defender'], text:'{时代球队}的球迷最爱看{姓名}回防，因为他总是最后一个放弃的人。即使比分已经拉开，他也会从后场追到前场，把对手的上篮变成一次艰难的出手。那种回防，比任何数据都更能说明他有多在乎这座城市和这支球队。' },
    { tags:['default'], text:'{时代年份}年，{姓名}把{时代球队}的每一场比赛都当成最后一场来打，于是这座城市记住了他很久。他不确定自己还能在这里多久，所以把每一天都用尽：训练、比赛、和球迷的每一次击掌。后来他离开时，这座城市才发现，他早已把最好的自己留了下来。' }
  ],
  low: [
    { tags:['regret_star'], text:'遗憾并没有绕开{姓名}。有些赛季，他已经打出了足够漂亮的表现，球队却还是停在季后赛门外或某一轮系列赛的终点。那些夜晚很安静，安静到只能听见更衣室里胶带被撕开的声音。可正因为有这些没能完成的章节，他后来的每一次被记住都显得更加真切。' },
    { tags:['no_ring'], text:'没有总冠军的生涯并不等于空白。{姓名}留下的是另一种重量：{赛季数}年、{场次}场、{总得分}分，以及许多次明知很难仍然把球队扛起来的夜晚。篮球有时不会给每个认真生活的人一个童话结局，但它会记住他们怎样走完这条路。' },
    { tags:['default'], text:'{姓名}的生涯并不总是向上。有些赛季，他的数据漂亮，球队却走不远；有些夜晚，他已经做了能做的一切，终场灯亮时比分仍然站在对面。那时候镜头不会等人，球迷也会失望，可他仍然要在第二天醒来，重新把鞋带系好。' },
    { tags:['regret_star','one_city'], text:'有些夜晚，{姓名}已经交出他能交出的一切，可比分仍然站在对面。{城市1}的球迷会失望，媒体会写标题，而他在更衣室里坐了很久，第二天照常出现在训练馆。遗憾没有把他变灰，反而让他的坚持有了具体的形状。' },
    { tags:['no_ring','loyal_loser'], text:'没有戒指的生涯，在荣誉表上少了一行，在{姓名}的故事里却多了一整段韧性。那些接近山顶又滑下来的年份，比顺遂的冠军路更让人看见一个球员的质地：他会痛，会不甘，但从没有把责任推给别人。' },
    { tags:['default'], text:'{姓名}的生涯里有过很长的等待期：等待机会、等待复健完成、等待球队变好。等待最容易让人变得急躁或麻木，他却选择每天先把手里的小事做好。后来那些机会真的来临时，他已经准备好太久。' },
    { tags:['regret_star','late_peak'], text:'他最遗憾的也许不是没有赢下某场比赛，而是在最好的年纪没能让伤病远离。可时间最终给了他另一种回报：晚年的高光虽然更短，却因为经历过失去而显得格外认真。' }
    ,
    { tags:['no_ring','one_city'], text:'{姓名}最接近冠军的那一年，球队在最后时刻倒下了。他坐在更衣室里很久没有说话，第二天却准时出现在训练馆。他说，遗憾可以留在心里，但不能留在路上。' },
    { tags:['regret_star','scorer'], text:'{姓名}生涯里最遗憾的一场，不是他表现糟糕，而是他已经做到最好，球队还是差了一点。那种无能为力的感觉，比输球本身更重。' },
    { tags:['no_ring','defender'], text:'没有冠军的防守者，常常被数据表忽略。但{姓名}让对手记得他的每一次对抗，也让队友记得他每一次补防。' },
    { tags:['regret_star','late_peak'], text:'{姓名}晚年最遗憾的，是那些被伤病偷走的赛季。他总在想，如果身体再争气一点，故事会不会不一样。但他没有让这种假设困住自己。' },
    { tags:['no_ring','playmaker'], text:'{姓名}没有戒指，却让很多队友记住了自己最好的样子。他把传球当成一种成全，也让那些没有冠军的赛季有了温度。' },
    { tags:['regret_star','one_city'], text:'{城市1}的球迷替{姓名}遗憾，因为他把最好的年华留在了这里。他反过来安慰球迷：能一起走过那些年，已经很值得。' },
    { tags:['no_ring','scorer'], text:'{姓名}的得分数据很漂亮，却总是差一枚戒指来盖章。他没有因此降低对自己的要求，反而把每一场都打得更加认真。' },
    { tags:['regret_star','defender'], text:'{姓名}最遗憾的防守回合，是他扑出去干扰了投篮，球还是进了。他说那一刻他明白了，篮球有时候就是不讲道理。' },
    { tags:['no_ring','late_peak'], text:'没有冠军的晚年，依然有它的光芒。{姓名}用晚年的坚持告诉所有人，价值不是由戒指单独决定的。' },
    { tags:['regret_star','playmaker'], text:'{姓名}最遗憾的传球，是那次他犹豫了半秒，错失了最好的机会。那半秒后来被他记了很多年，也让他学会了更果断。' },
    { tags:['no_ring','default'], text:'{姓名}的生涯没有冠军，却有一整排认真打完的赛季。那些赛季加起来，就是他的重量。' },
    { tags:['regret_star','scorer'], text:'{姓名}记得每一次错失的关键球，比记得每一次命中的还要清楚。他说那是他的职业习惯：把遗憾变成训练内容。' },
    { tags:['no_ring','one_city'], text:'{城市1}没有等到冠军，但等到了{姓名}最完整的付出。他没有让这座城市失望，只是没有让故事以最圆满的方式结束。' },
    { tags:['regret_star','late_peak'], text:'{姓名}晚年最遗憾的，是没能让父亲看到自己夺冠。他说每次举起奖杯，都会想起那个坐在看台上的身影。' },
    { tags:['no_ring','defender'], text:'没有戒指的防守者，在荣誉榜上容易缺席，但在对手的记忆里从不缺席。{姓名}就是这样被记住的。' },
    { tags:['regret_star','playmaker'], text:'{姓名}最遗憾的，不是自己没有拿到冠军，而是没能帮那些信任他的队友圆梦。他把这种遗憾变成了更努力的理由。' },
    { tags:['no_ring','scorer'], text:'{姓名}的得分能力没有为他换来冠军，却为他换来了一整座城市的尊重。有些价值，比戒指更晚被看见。' },
    { tags:['regret_star','default'], text:'{姓名}的生涯里有过很多“差一点”，差一点进季后赛，差一点赢下系列赛，差一点夺冠。他把这些“差一点”都变成了继续向前的理由。' },
    { tags:['no_ring','late_peak'], text:'{姓名}晚年仍然在追那枚戒指，虽然最终没有等到。他说他不后悔，因为追的过程已经很完整。' },
    { tags:['regret_star','one_city'], text:'{城市1}的球迷替{姓名}可惜，他却说自己不可惜：能在这里打完那么多场比赛，已经是很幸运的事。' },
    { tags:['no_ring','playmaker'], text:'{姓名}没有戒指，却让许多队友打出了生涯最好的赛季。他的传球，是那些没有冠军的年份里最温暖的光。' },
    { tags:['regret_star','scorer'], text:'{姓名}最遗憾的一球，是在最后时刻投丢的那记跳投。他没有怪裁判，没有怪队友，只是把那个动作又练了一千遍。' },
    { tags:['no_ring','defender'], text:'没有冠军的防守者，往往被低估，但{姓名}让对手清楚：和他对位，每一分都要付出代价。' },
    { tags:['regret_star','late_peak'], text:'{姓名}晚年最大的遗憾，是身体不再允许他像从前那样飞奔。可他依然选择上场，因为篮球已经是他生活的一部分。' },
    { tags:['no_ring','default'], text:'{姓名}的生涯没有以冠军结尾，但他把每一个赛季都打成了完整的故事。没有遗憾的结局很少，认真过的过程很重。' },
    { tags:['regret_star','playmaker'], text:'{姓名}最遗憾的，是那些年球队总在关键时刻差一口气。他无数次复盘，想知道那口气到底丢在了哪里。' },
    { tags:['no_ring','scorer'], text:'{姓名}的得分会让数据表变得漂亮，但冠军栏一直是空的。他没有因此放弃得分，因为他知道球队需要他做这件事。' },
    { tags:['regret_star','one_city'], text:'{城市1}的球迷记得{姓名}最遗憾的那个夜晚：全场起立，掌声响了很久。他没有说话，只是鞠躬。' },
    { tags:['no_ring','late_peak'], text:'{姓名}晚年依然渴望冠军，却已经学会和遗憾相处。他说，不是所有故事都要圆满，但每个故事都值得认真讲完。' },
    { tags:['regret_star','defender'], text:'{姓名}最遗憾的防守，是他知道对手要投三分，却没能及时扑到。他说那一刻他明白了，预判和反应之间，隔着无数个训练日。' },
    { tags:['no_ring','playmaker'], text:'没有冠军的组织者，常常被低估。但{姓名}让队友们记得，那些没有戒指的赛季里，他依然把每个人都照顾得很好。' },
    { tags:['regret_star','scorer'], text:'{姓名}生涯最遗憾的，不是技术上的失误，而是有些夜晚他明明手感火热，球队却没能赢下比赛。' },
    { tags:['no_ring','default'], text:'{姓名}的荣誉表里没有总冠军，但有一整排认真对待的年份。那排年份，就是他给篮球最好的交代。' },
    { tags:['regret_star','late_peak'], text:'{姓名}晚年最遗憾的，是没有早一点学会保护身体。他说如果重来一次，他会更早学会和疲劳相处。' },
    { tags:['no_ring','one_city'], text:'{城市1}没有给{姓名}冠军，却给过他最响亮的掌声。他把那些掌声存在心里，带去了每一座后来的城市。' },
    { tags:['regret_star','playmaker'], text:'{姓名}最遗憾的传球，是那一次他选择了最安全的选项，错过了最冒险也最可能改变比赛的一传。' },
    { tags:['no_ring','scorer'], text:'{姓名}没有戒指，但他让对手在防守计划里写满他的名字。那也是一种被记住的方式。' },
    { tags:['regret_star','defender'], text:'{姓名}最遗憾的，是那次他没能防住最后一步，让对手在哨响前完成了绝杀。他后来把那个回合看了很多遍。' },
    { tags:['no_ring','late_peak'], text:'晚年的{姓名}依然在追逐那枚戒指，像在追一个没有说完的梦。虽然梦没有醒在冠军夜，但追梦的过程足够动人。' },
    { tags:['regret_star','default'], text:'{姓名}的遗憾很多，但没有一条让他停下。他说，遗憾不是终点，是提醒你还可以继续。' },
    { tags:['no_ring','playmaker'], text:'没有冠军的{姓名}，依然让很多球员愿意和他做队友，因为他让每个人都变得更好。' },
    { tags:['regret_star','scorer'], text:'{姓名}最遗憾的一场比赛，他拿了全队最高分，球队还是输了。赛后他第一次在更衣室里红了眼眶。' },
    { tags:['no_ring','one_city'], text:'{城市1}的遗憾和{姓名}的遗憾连在一起，成为这座城市篮球记忆里最柔软的部分。' },
    { tags:['regret_star','late_peak'], text:'{姓名}晚年最遗憾的，是没能和那批老队友一起再打一年。他说，篮球最好的部分，有时候不是冠军，是那些人。' },
    { tags:['no_ring','defender'], text:'没有戒指的防守者，把每场比赛都当作最后一场来防。{姓名}的生涯就是这样，从头到尾没有松过劲。' },
    { tags:['regret_star','playmaker'], text:'{姓名}最遗憾的，是那些年轻队友还在成长时，球队已经解散。他说如果时间能重来，他多想再等他们一年。' },
    { tags:['no_ring','scorer'], text:'{姓名}的得分纪录也许会被打破，但他对每一分的认真不会。那是一种没有戒指也能被记住的职业态度。' },
    { tags:['regret_star','default'], text:'{姓名}的生涯里，遗憾像一条暗线，串起了许多个不甘心的夜晚。但他把那些夜晚都变成了第二天训练的燃料。' },
    { tags:['no_ring','late_peak'], text:'{姓名}晚年的坚持，让很多人觉得他还在等一个奇迹。他说他不是在等奇迹，只是在做完自己该做的事。' },
    { tags:['regret_star','one_city'], text:'{城市1}的球迷最遗憾的，是没能看到{姓名}在这座城市举起冠军。他安慰他们：那枚戒指，我会替你们去追。' },
    { tags:['no_ring','playmaker'], text:'没有冠军的组织者，依然值得被写进故事。{姓名}让那些故事里不仅有数据，还有温度。' },
    { tags:['regret_star','scorer'], text:'{姓名}最遗憾的，是他手感最好的那一年，球队却在季后赛第一轮就出局了。' },
    { tags:['no_ring','defender'], text:'{姓名}没有戒指，但对手都记得和他对抗的感觉：硬、干净、不放弃。' },
    { tags:['regret_star','late_peak'], text:'{姓名}晚年最遗憾的，是没能把那些经验更早交给年轻人。他说，如果早点学会分享，也许会有更多故事。' },
    { tags:['no_ring','default'], text:'{姓名}的生涯没有冠军，但有一整段被认真度过的时光。那段时光，比任何奖杯都更贴近真实。' },
    { tags:['regret_star','playmaker'], text:'{姓名}最遗憾的，是那年的伤病来得太不是时候，让他错过了最重要的系列赛。' },
    { tags:['no_ring','scorer'], text:'{姓名}的得分让他成为明星，冠军却始终没有来。他没有抱怨，只是继续把球投进。' },
    { tags:['regret_star','one_city'], text:'{城市1}的球迷说，{姓名}最遗憾的不是没有冠军，而是没有让这座城市看到他的冠军梦成真。' },
    { tags:['no_ring','late_peak'], text:'{姓名}晚年依然相信冠军会来，虽然结局没有如愿。那种相信本身，已经足够动人。' },
    { tags:['regret_star','defender'], text:'{姓名}最遗憾的防守，是那次他没有跳起来，因为他已经跳了太多次。' },
    { tags:['no_ring','playmaker'], text:'没有戒指的{姓名}，让很多队友记住了被信任的感觉。那比一枚戒指更让人念念不忘。' },
    { tags:['regret_star','scorer'], text:'{姓名}生涯最遗憾的一球，不是投丢，而是他因为伤病只能坐在场边看队友投丢。' },
    { tags:['no_ring','default'], text:'{姓名}用没有冠军的生涯证明了一件事：伟大有另一种写法，叫从头到尾没有放弃。' },
    { tags:['regret_star','late_peak'], text:'{姓名}晚年最大的遗憾，是时间没有等他完成所有想做的事。但他已经在时间里留下了足够多的脚印。' },
    { tags:['no_ring','defender'], text:'没有戒指的防守者，更容易被遗忘，但{姓名}让对手记住他，让队友信任他，让教练在关键时刻想到他。' },
    { tags:['regret_star','playmaker'], text:'{姓名}最遗憾的，是那些本该更早建立默契的队友，因为伤病和交易没能一起走到最后。' },
    { tags:['no_ring','scorer'], text:'{姓名}的得分会结束，但他的职业态度不会。那是没有戒指也能被记住的原因。' },
    { tags:['regret_star','default'], text:'{姓名}的遗憾，像一场没有下完的雨。他等了很多年，最终学会了在雨里继续走。' },
    { tags:['no_ring','one_city'], text:'{城市1}没有给{姓名}冠军，却给了他一整座城市的温柔。他带着那份温柔，走完了剩下的路。' },
    { tags:['regret_star','late_peak'], text:'{姓名}晚年最遗憾的，是没能让母亲看到自己夺冠。他把每一场胜利都看作对她的纪念。' },
    { tags:['no_ring','playmaker'], text:'没有冠军的组织者，往往被数据遗忘。但{姓名}让队友记得，那些年他怎样把大家串在一起。' },
    { tags:['regret_star','scorer'], text:'{姓名}最遗憾的，是他知道那一球如果进了，一切都可能不同。他没有躲开那个念头，而是把它变成了训练的动力。' },
    { tags:['no_ring','default'], text:'{姓名}的生涯没有以冠军结尾，但他把每一段路都认真走完。遗憾没有定义他，坚持定义了。' },
    { tags:['regret_star','defender'], text:'{姓名}最遗憾的防守，是他已经预判到了对手的路线，身体却慢了半拍。那一刻他懂了什么叫年龄。' },
    { tags:['no_ring','late_peak'], text:'晚年的{姓名}，依然把每一场都当作最后一场。没有冠军的结局，配得上他全力以赴的过程。' }
  ],
  late_peak: [
    { tags:['late_peak','champion'], text:'到了生涯后期，人们习惯用年龄解释他的下滑，却一次次被他温和地推翻。{退役年龄}岁前后的{姓名}不再靠年轻时的爆发力统治比赛，而是靠判断、节奏和那些年累积下来的冷静。当这些经验再次通向冠军时，那不像回光返照，更像时间终于把最好的答案还给了他。' },
    { tags:['late_peak'], text:'老年巅峰最动人的地方，是它不像青春那样理所当然。每一次高水平表现都像是在和时间谈判，而{姓名}偏偏总能多赢几个回合。球迷看着他慢慢变老，也看着他用另一种方式继续可靠，那里面有竞技的残酷，也有陪伴的温柔。' },
    { tags:['late_peak'], text:'{退役年龄}岁前后的{姓名}，速度可能比年轻时慢了一点，但比赛在他眼里也慢了一点。他不再追逐每一个回合，而是提前判断会发生在哪里。这种老练不喧哗，却让队友在场上忽然觉得安稳。' },
    { tags:['late_peak','champion'], text:'当人们以为他的高光已经结束，{姓名}又用一段晚年表现把答案改写。{冠军线}让那段时光变得完整，也让球迷明白：天赋会老去，判断力却会随着岁月变得更锋利。' },
    { tags:['late_peak','one_city'], text:'在{首队}的晚年，{姓名}已经不追求证明什么，只是想把最后一段路走得好看。他把自己会的全部交给年轻人，也在每一次上场时让老球迷想起十几年前那个不肯服输的少年。' },
    { tags:['default'], text:'晚年高光最珍贵的地方，在于它提醒所有人：{姓名}不是被时间淘汰的人，而是与时间和解后仍然选择上场的人。他的每一次转身、每一次投篮，都像在替过去的自己补上答案。' }
    ,
    { tags:['late_peak','champion'], text:'{姓名}晚年的冠军，不是年轻时代的回响，而是经验开出的花。他不再靠爆发力，却靠判断力赢下了最重要的夜晚。' },
    { tags:['late_peak','scorer'], text:'晚年的{姓名}，得分方式变得简单而珍贵：他不再强突，而是用假动作、节奏和精准的出手，让防守者仍然拿他没办法。' },
    { tags:['late_peak','defender'], text:'{退役年龄}岁的{姓名}，速度慢了，位置感却更强了。他让年轻人明白，防守到最后靠的不是腿，是脑子。' },
    { tags:['late_peak','playmaker'], text:'晚年的{姓名}传球更慢了，却也更准了。他不再急着寻找空位，而是先读防守，再让队友在移动中找到最舒服的接球点。' },
    { tags:['late_peak','one_city'], text:'{城市1}的球迷看着{姓名}的头发慢慢变少，速度慢慢变慢，却看着他越来越会用脑子打球。他们说，那是另一种成长。' },
    { tags:['late_peak','no_ring'], text:'没有冠军的晚年，依然有它的骄傲。{姓名}用一场场比赛证明，老将的价值不只是经验，还有不肯服输的骨气。' },
    { tags:['late_peak','default'], text:'{姓名}晚年最迷人的地方，是他把“老”字活成了优势：更少的冲动，更多的耐心，更准的判断。' },
    { tags:['late_peak','champion'], text:'晚年的冠军，像一场迟到的答谢。{姓名}用{退役年龄}岁的身板，把那些年的坚持变成了奖杯。' },
    { tags:['late_peak','scorer'], text:'{姓名}晚年的得分，每一分都带着岁月的气息：不追求华丽，只追求把该进的球投进。' },
    { tags:['late_peak','defender'], text:'晚年的{姓名}，用防守给年轻人上了一课：位置比弹跳重要，预判比速度重要。' },
    { tags:['late_peak','playmaker'], text:'{姓名}晚年最拿手的，是让年轻队友打得更舒服。他愿意多传一次，多等一秒，让机会出现在更合适的人手里。' },
    { tags:['late_peak','one_city'], text:'{首队}的球迷把{姓名}的晚年称作“最后的礼物”。他没有让这份礼物落空。' },
    { tags:['late_peak','no_ring'], text:'{姓名}晚年的每一场比赛，都可能是最后一场。他没有因为“可能”而敷衍，反而把每一场都打得格外珍惜。' },
    { tags:['late_peak','default'], text:'晚年的{姓名}，学会了和身体谈判：该休息时休息，该拼时拼。他说这是年轻时不懂的道理。' },
    { tags:['late_peak','champion'], text:'冠军赛季里的{姓名}，已经是队里最老的球员之一。他用自己的稳定，让年轻人学会了什么叫关键回合。' },
    { tags:['late_peak','scorer'], text:'{姓名}晚年的手感，没有随着年龄流失。他总说，手感是靠每天五百次投篮养着的。' },
    { tags:['late_peak','defender'], text:'晚年的{姓名}，不再是那个飞身封盖的少年，但他总能让对手在最不舒服的位置出手。' },
    { tags:['late_peak','playmaker'], text:'{姓名}晚年的传球，像一封写得很慢的信：每个字都斟酌过，每一传都恰到好处。' },
    { tags:['late_peak','one_city'], text:'{城市1}的球迷没有要求{姓名}再拿冠军，只希望他健康地打完最后一段路。' },
    { tags:['late_peak','no_ring'], text:'{姓名}晚年的坚持，不是为了戒指，而是为了证明自己还属于这里。' },
    { tags:['late_peak','default'], text:'晚年的{姓名}，把每一场都当最后一场打，于是每一场都成了值得记住的比赛。' },
    { tags:['late_peak','champion'], text:'{姓名}晚年夺冠的那一刻，很多老球迷红了眼眶。他们等的不是奖杯，是那个少年终于得到了时间的答案。' },
    { tags:['late_peak','scorer'], text:'{姓名}晚年的得分，少了爆发，多了聪明。他总能在对手以为他要休息时，突然给出致命一击。' },
    { tags:['late_peak','defender'], text:'晚年的{姓名}，最常被问到的问题是如何保持防守。他笑着说：提前站好，就不用跑那么快。' },
    { tags:['late_peak','playmaker'], text:'{姓名}晚年最动人的传球，是那些传给年轻人的球。他在告诉他们：未来是你们的，但现在我还能帮你们一把。' },
    { tags:['late_peak','one_city'], text:'{首队}的晚年{姓名}，每次主场亮相都会收到掌声。他不多说，只是点头，然后认真打完比赛。' },
    { tags:['late_peak','no_ring'], text:'没有冠军的{姓名}，在晚年依然被尊重。因为他的坚持，本身就是一种答案。' },
    { tags:['late_peak','default'], text:'晚年的{姓名}，不再和年轻人比弹跳，而是比谁更早读懂比赛。他赢了。' },
    { tags:['late_peak','champion'], text:'冠军需要经验，{姓名}就是那支球队最珍贵的经验。他的晚年，让冠军变得顺理成章。' },
    { tags:['late_peak','scorer'], text:'{姓名}晚年最厉害的地方，是他知道什么时候该自己来，什么时候该让队友来。这种分寸感，是岁月给的。' },
    { tags:['late_peak','defender'], text:'晚年的{姓名}，防守端更像一位指挥家：他不用自己防住所有人，但能让整条防线知道该怎么动。' },
    { tags:['late_peak','playmaker'], text:'{姓名}晚年组织进攻，像在解一道很熟悉的题：他知道答案，只是愿意让年轻人先试一次。' },
    { tags:['late_peak','one_city'], text:'{城市1}的球迷后来常说，{姓名}的晚年是他们见过最温柔的样子：不再锋芒毕露，却依然可靠。' },
    { tags:['late_peak','no_ring'], text:'{姓名}晚年没有等到冠军，却等到了球迷的理解：他们不再用戒指衡量他，只希望他多打一年。' },
    { tags:['late_peak','default'], text:'晚年的{姓名}，把“老将”两个字活成了褒义词：更稳、更准、更懂得珍惜。' },
    { tags:['late_peak','champion'], text:'{姓名}晚年夺冠，像给整个生涯写了一个温柔的结尾。他没有辜负时间，时间也没有辜负他。' },
    { tags:['late_peak','scorer'], text:'{姓名}晚年的跳投，仍然像年轻时一样标准。他说，肌肉会记住那些重复了一万遍的动作。' },
    { tags:['late_peak','defender'], text:'晚年的{姓名}，让对手教练在录像课上反复提醒：别小看他的脚步，他会站在那里等你。' },
    { tags:['late_peak','playmaker'], text:'{姓名}晚年最常做的一件事，是暂停时把年轻队友叫到一起，告诉他们刚才那个回合应该怎么处理。' },
    { tags:['late_peak','one_city'], text:'{首队}的年轻人说，{姓名}晚年就像队里的另一名教练，但他比教练更懂球员的心情。' },
    { tags:['late_peak','no_ring'], text:'{姓名}晚年依然渴望上场，不是因为贪恋聚光灯，而是因为他真的舍不得篮球。' },
    { tags:['late_peak','default'], text:'晚年的{姓名}，把每一次训练都当作最后一次，于是每一次都格外认真。' },
    { tags:['late_peak','champion'], text:'{姓名}晚年的冠军戒指，戴在他手上时，所有人都知道那不是运气，是{赛季数}年的积累。' },
    { tags:['late_peak','scorer'], text:'{姓名}晚年的得分效率，反而比巅峰期更高。他不再浪费任何一次出手。' },
    { tags:['late_peak','defender'], text:'晚年的{姓名}，用一次教科书式的站位，让年轻球员明白了什么叫“用脑子防守”。' },
    { tags:['late_peak','playmaker'], text:'{姓名}晚年最享受的，不是自己得分，而是看到年轻人因为他的传球而发光。' },
    { tags:['late_peak','one_city'], text:'{城市1}的球迷说，{姓名}晚年的每一场主场比赛，都像一次告别，但他一直舍不得说再见。' },
    { tags:['late_peak','no_ring'], text:'{姓名}晚年没有冠军，却拥有所有对手的尊重。那也是一种圆满。' },
    { tags:['late_peak','default'], text:'晚年的{姓名}，越来越像一杯老酒：入口不烈，回味很长。' },
    { tags:['late_peak','champion'], text:'冠军之夜，{姓名}抱着奖杯看了很久。他说，他等的不是这一刻，而是终于可以告诉年轻时的自己：你坚持对了。' },
    { tags:['late_peak','scorer'], text:'{姓名}晚年的关键球，仍然让人安心。他总在最需要的时候，用最稳的方式把球放进篮筐。' },
    { tags:['late_peak','defender'], text:'晚年的{姓名}，让年轻人学会了一件事：防守的终点不是盖帽，而是让对手难受。' },
    { tags:['late_peak','playmaker'], text:'{姓名}晚年最温柔的传球，是传给那些曾经和他一样迷茫的年轻人。' },
    { tags:['late_peak','one_city'], text:'{首队}的球迷珍惜{姓名}晚年的每一场比赛，因为他们知道，这样的夜晚看一场少一场。' },
    { tags:['late_peak','no_ring'], text:'{姓名}晚年的故事，没有以戒指结尾，却以坚持结尾。那也是一种了不起的结局。' },
    { tags:['late_peak','default'], text:'晚年的{姓名}，很少再提起年轻时的自己。他说，现在的我，才是这些年最好的答案。' },
    { tags:['late_peak','champion'], text:'{姓名}晚年夺冠，让那些陪他走过低谷的球迷觉得，自己的等待也值了。' },
    { tags:['late_peak','scorer'], text:'{姓名}晚年的每一分，都像在和时间讨价还价。他总能多要一点。' },
    { tags:['late_peak','defender'], text:'晚年的{姓名}，防守时不再跳起来封盖，而是稳稳站在对手的突破路线上。' },
    { tags:['late_peak','playmaker'], text:'{姓名}晚年最常说的一句话是：先看清楚，再决定。他把这句话也传给了更衣室。' },
    { tags:['late_peak','one_city'], text:'{城市1}的球迷后来会告诉孩子：看{姓名}晚年打球，就像看一本慢慢翻完的书，每一页都舍不得跳过。' },
    { tags:['late_peak','no_ring'], text:'{姓名}晚年依然相信冠军会来，虽然最后没有等到。但那份相信，已经足够让人动容。' },
    { tags:['late_peak','default'], text:'晚年的{姓名}，学会了和遗憾共存，也学会了在遗憾里继续认真生活。' },
    { tags:['late_peak','champion'], text:'{姓名}的晚年冠军，让“老兵不死”这句话有了最具体的画面。' },
    { tags:['late_peak','scorer'], text:'{姓名}晚年最常被对手研究，却仍然能找到得分方法。因为经验会让招式变得简单而有效。' },
    { tags:['late_peak','defender'], text:'晚年的{姓名}，用一次提前站位化解了年轻人的全力冲刺。他笑了笑：这招我练了{赛季数}年。' },
    { tags:['late_peak','playmaker'], text:'{姓名}晚年最自豪的，不是自己的数据，而是有多少年轻球员因为他的传球而变得自信。' },
    { tags:['late_peak','one_city'], text:'{首队}的晚年{姓名}，每一次谢场都像在说再见，又像在说下次见。' },
    { tags:['late_peak','no_ring'], text:'没有冠军的晚年，依然值得鼓掌。{姓名}让那些掌声有了具体的理由：他从没有放弃。' },
    { tags:['late_peak','default'], text:'晚年的{姓名}，把“少说多做”活成了日常。他用比赛而不是言语回答所有问题。' },
    { tags:['late_peak','champion'], text:'冠军赛季里，{姓名}是最老的人，也是最稳的人。他的晚年，成了那支球队最珍贵的财富。' },
    { tags:['late_peak','scorer'], text:'{姓名}晚年的跳投，弧度依然优美。球迷说，他的动作里藏着几十年的时光。' },
    { tags:['late_peak','defender'], text:'晚年的{姓名}，让年轻人明白，防守的最高境界是不需要跳很高，只需要站得很准。' },
    { tags:['late_peak','playmaker'], text:'{姓名}晚年最后一次助攻，送给了队里最年轻的球员。他说，那是他职业生涯最满意的一次传球。' },
    { tags:['late_peak','one_city'], text:'{城市1}的球迷会永远记得{姓名}晚年的样子：慢了一点，稳了很多，认真了一辈子。' },
    { tags:['late_peak','no_ring'], text:'{姓名}晚年没有戒指，却让每一座球馆都为他起立。那是一种比冠军更难得的尊重。' },
    { tags:['late_peak','default'], text:'晚年的{姓名}，终于不再追赶时间，而是和时间并肩走。那是最舒服也最动人的姿态。' }
  ],
  city_memory: [
    { tags:['one_city'], text:'{城市1}记住他的方式，不只是退役仪式和荣誉墙。那里的人记得他年轻时的莽撞，成熟后的沉稳，也记得他在很多普通夜晚认真跑回防的背影。对一座城市来说，最珍贵的球员未必永远完美，而是你真的看着他一点点长成了自己人。' },
    { tags:['three_city'], text:'{球队1}记住的是年轻的他，带着锋利的边角和不肯服输的眼神；{球队2}记住的是成熟的他，知道什么时候该用力，什么时候该等待；{球队3}记住的则是另一段他把经验和骄傲一起留在球场上的岁月。几段记忆拼在一起，才是完整的{姓名}。' },
    { tags:['many_city'], text:'{球队列表}背后的球迷，喜欢他的理由并不完全一样，却都在某些夜晚留下过他的名字。{姓名}没有只属于一个地方，但每一站都拥有过真实的他。也许这就是漫长生涯最温暖的部分：人会离开，球衣会更换，可被认真陪伴过的年份不会消失。' },
    { tags:['multi_city'], text:'几座城市喜欢他的理由并不完全一样，却都在某个夜晚把他的名字喊到嗓子发哑。{姓名}没有只属于一个地方，但每个地方都觉得自己真正拥有过他。也许这就是漫长生涯最温暖的部分：人会离开，球衣会更换，可被认真陪伴过的年份不会消失。' },
    { tags:['one_city'], text:'{城市1}的人们后来散步经过球馆，会想起{姓名}在这里度过的{赛季数}年。不是每一个赛季都值得纪念，但那些普通夜晚里他认真回防、认真加练、认真对待失败的样子，已经成了城市记忆的一部分。' },
    { tags:['multi_city','champion'], text:'{多城称谓}共同记住{姓名}的方式并不相同：一座城市记住他年轻时的冲劲，另一座记住他成熟后的稳定，还有一座记住他把冠军带回来的那个夏天。这些记忆拼在一起，才是一个完整的他。' },
    { tags:['three_city'], text:'{球队1}的球迷记得他第一次亮相时的青涩，{球队2}的球迷记得他接管关键回合的果断，{球队3}的球迷记得他把经验和耐心留给年轻人的晚年。三段记忆，三种模样，却都是同一个{姓名}。' },
    { tags:['many_city'], text:'对许多城市来说，{姓名}并不是“来过又走了”的过客，而是“认真住过一阵子”的家人。他会记得每座城市的球馆味道，城市也会记得他在那些夜晚给出的全部努力。' }
    ,
    { tags:['one_city'], text:'{城市1}的球迷后来散步时，会指着一家早餐店说：{姓名}以前总来这里。没有人知道那家店是否真的和他有关，但每个人都愿意相信。' },
    { tags:['one_city','champion'], text:'{冠军城市}的冠军日，被写进了这座城市的日历。每年那一天，人们都会想起{姓名}和那支球队。' },
    { tags:['multi_city'], text:'{姓名}在不同城市留下了不同的记忆：{城市1}记得他的青春，{城市2}记得他的成熟，{城市3}记得他的告别。' },
    { tags:['one_city','scorer'], text:'{城市1}的街头球场，总有人模仿{姓名}的出手动作。那不是追星，而是这座城市记住他的方式。' },
    { tags:['one_city','late_peak'], text:'{姓名}晚年每一次回到{城市1}，都会去老球馆坐一会儿。那里没有比赛时很安静，像一座装满回忆的房间。' },
    { tags:['many_city'], text:'{球队列表}的城市，都有一句关于{姓名}的谚语式故事：他在这里投进过一颗让所有人闭嘴的球。' },
    { tags:['one_city','defender'], text:'{城市1}的出租车司机最爱聊{姓名}：说他防守像这座城市的人一样，实在、不花哨、但管用。' },
    { tags:['multi_city','champion'], text:'{姓名}把冠军带回了{冠军城市}，也让{城市1}的球迷笑着祝福。他们说，他值得。' },
    { tags:['one_city','no_ring'], text:'{城市1}没有冠军，却把{姓名}的名字写进了自己的记忆。有些名字不需要奖杯来照亮。' },
    { tags:['three_city'], text:'{城市1}记住的是他的冲劲，{城市2}记住的是他的可靠，{城市3}记住的是他把经验留下的温柔。' },
    { tags:['one_city'], text:'{姓名}离开{城市1}很久后，当地媒体仍会偶尔提起他。标题常常是：他还在那座城市的故事里。' },
    { tags:['multi_city','late_peak'], text:'晚年的{姓名}走到哪里，哪里就会多一群新球迷。他们说，老将的故事，比新星的传说更耐听。' },
    { tags:['one_city','playmaker'], text:'{城市1}的孩子们在放学路上，会模仿{姓名}的传球动作。他们把球传给朋友，然后说：像{姓名}那样。' },
    { tags:['many_city'], text:'{姓名}的球衣在{球队列表}的城市里都有人穿。那不是因为他拥有多少座城，而是因为他认真对待过每一座。' },
    { tags:['one_city','champion'], text:'{冠军城市}的冠军游行路线，后来成了城市的固定记忆。人们会指着某个路口说：{姓名}当时在这里举着奖杯。' },
    { tags:['multi_city','no_ring'], text:'{姓名}没有戒指，但{多城称谓}的球迷都愿意称他“我们的人”。那种称呼，比戒指更暖。' },
    { tags:['one_city','defender'], text:'{城市1}的球馆里，至今挂着{姓名}的一张防守照片。工作人员说，那是新球员第一堂训练课要看的东西。' },
    { tags:['three_city'], text:'{球队1}的球迷记得他第一次穿上那件球衣的样子，{球队2}的球迷记得他最后一场的样子，{球队3}的球迷记得他中间所有普通又认真的样子。' },
    { tags:['one_city'], text:'{姓名}在{城市1}住过的那条街，后来被球迷称作“他的街道”。他没有在那里留下雕像，却留下了生活。' },
    { tags:['multi_city','scorer'], text:'{姓名}在{球队2}的最后一记三分，被做成海报贴在城市的地铁站。路人每天经过，都会多看两眼。' },
    { tags:['one_city','late_peak'], text:'{城市1}的老年球迷说，他们看着{姓名}从小伙子变成中年人，就像看着自己的孩子长大。' },
    { tags:['many_city'], text:'{姓名}走过的城市，都有一个共同点：球迷学会了用他的名字开玩笑，也学会了认真记住他的好。' },
    { tags:['one_city','playmaker'], text:'{城市1}的社区联赛，至今还用{姓名}的名字命名一个奖项：最佳传球。那是城市给他的回礼。' },
    { tags:['multi_city','champion'], text:'{姓名}夺冠后回到{冠军城市}，整条街都挂上了他的球衣。他没有说太多，只是在车窗外一直挥手。' },
    { tags:['one_city','no_ring'], text:'{城市1}的遗憾里，{姓名}是最亮的部分。人们提起那几年，会说：我们有过一个很好的球员。' },
    { tags:['three_city'], text:'三座城市，三段记忆，却串成了同一个{姓名}：他在每段记忆里都认真生活过。' },
    { tags:['one_city'], text:'{姓名}退役后第一次回{城市1}看球，被现场镜头拍到。全场起立，他站起来鞠躬，像从前每次谢场一样。' },
    { tags:['multi_city','defender'], text:'{姓名}的防守故事，在{球队列表}的城市里都有版本。每个版本都强调同一个细节：他从不放弃回防。' },
    { tags:['one_city','scorer'], text:'{城市1}的夜晚，仍有人穿着{姓名}的球衣在街头打球。他们不一定会提起他，但动作里有他的影子。' },
    { tags:['many_city'], text:'{姓名}不是一个地方的传奇，却是很多地方愿意讲给下一代听的故事。' },
    { tags:['one_city','late_peak'], text:'{城市1}的球迷最舍不得{姓名}的，是他最后一次谢场时那声“谢谢”。他弯腰很久，掌声也响了很久。' },
    { tags:['multi_city','playmaker'], text:'{姓名}的传球习惯，影响了{球队列表}的年轻球员。他们开始相信，篮球可以被分享。' },
    { tags:['one_city','champion'], text:'{城市1}把{姓名}的名字刻在了社区球馆的墙上。没有铜像那么隆重，却每天都有孩子看到。' },
    { tags:['three_city'], text:'{球队1}教会他防守，{球队2}教会他承担，{球队3}教会他告别。三座城市，三门课。' },
    { tags:['one_city','no_ring'], text:'{城市1}没有冠军，但球迷会说：我们有{姓名}。那已经是很骄傲的句子。' },
    { tags:['multi_city','scorer'], text:'{姓名}在{球队2}的那记绝杀，成了城市传说。有人声称自己在现场，也有人说是听父亲说的。' },
    { tags:['one_city'], text:'{城市1}的一家老球馆里，还保留着{姓名}新秀赛季的更衣柜。管理员说不清为什么，就是不想换。' },
    { tags:['many_city','late_peak'], text:'晚年的{姓名}每到一个城市，都会先去那家最有名的早餐店。老板们后来都记得他的口味。' },
    { tags:['one_city','defender'], text:'{城市1}的消防员、教师和出租车司机，都喜欢在休息时聊{姓名}。因为他让这座城市有了共同的回忆。' },
    { tags:['multi_city','champion'], text:'{姓名}把冠军带给{冠军城市}后，那里的孩子开始相信：这座城也可以赢。' },
    { tags:['three_city'], text:'三座城市的球迷，用三种不同的口音喊过{姓名}的名字。那三种声音，他都记得。' },
    { tags:['one_city'], text:'{姓名}最后一次离开{城市1}时，机场的工作人员自发鼓掌。他说，那一刻他知道自己没有白来。' },
    { tags:['multi_city','playmaker'], text:'{姓名}的传球，让{球队2}的进攻变得流畅。城市的解说员说，那支球队的球风里，有他的指纹。' },
    { tags:['one_city','scorer'], text:'{城市1}的球迷会给外地朋友介绍{姓名}：他在这里，投进过我见过最准的一球。' },

    { tags:['multi_city','playmaker'], text:'{姓名}在{球队2}的助攻集锦，被球迷剪了又剪。他们说，那支球队最好的篮球，是从他的传球开始的。' },
    { tags:['three_city'], text:'三座城市的球馆，都响过{姓名}的名字。那些声音在他退役后仍然回荡在球迷的记忆里。' },

    { tags:['many_city','defender'], text:'{姓名}的防守故事，在每个城市的球馆里都有听众。教练们用它教年轻人：认真防守，球迷会记得。' },
    { tags:['one_city','champion'], text:'{冠军城市}的冠军戒指，后来被放进城市的博物馆。旁边写着{姓名}的名字。' },

    { tags:['three_city'], text:'{球队1}的球迷记得他的第一场，{球队2}的球迷记得他的巅峰，{球队3}的球迷记得他的最后一场。' },

    { tags:['three_city'], text:'三座城市教会{姓名}三件事：怎么开始，怎么坚持，怎么告别。他把它们都学得很好。' },

    { tags:['one_city','late_peak'], text:'{城市1}的球迷说，{姓名}晚年的谢场是他们见过最温柔的告别：没有眼泪，只有认真。' },
    { tags:['many_city','defender'], text:'{姓名}的防守习惯，被{球队列表}的教练们当教材。他们都说：这样的回防，值得每一堂课都讲。' }

  legacy: [
    { tags:['top_legacy'], text:'{历史档位}不是一句夸张的赞美，而是他用{赛季数}年、{场次}场、{总得分}分和一整排荣誉慢慢换来的位置。那里没有偶然，也没有捷径。它来自他年轻时不肯偷懒，巅峰时不肯自满，老去时仍然认真对待每一次训练的漫长总和。' },
    { tags:['no_ring','regret_star'], text:'后来的人讨论{姓名}时，也许仍会提起那枚缺席的戒指。但真正懂他生涯的人知道，伟大有时不只用冠军证明。它也存在于长期稳定的高标准里，存在于一次次失败后仍然愿意回到球馆的人身上。' },
    { tags:['champion'], text:'胜利会过去，奖杯会蒙尘，数据会被后来者追近。但在{多城称谓}的记忆里，{姓名}仍然会站在那些最难的回合里，像当年一样没有后退。人们记住他的方式不总是宏大，有时只是某个父亲指着旧录像告诉孩子：你看，他那时候就是这样打球的。' },
    { tags:['default'], text:'退役之后，历史开始用更慢的速度重新打量{姓名}。他不再属于某一个赛季的讨论，而属于更长的名单：那些真正改变过球队命运、也改变过同位置标准的人。时间让很多争论变轻，却让他的价值变得更清楚。' },
    { tags:['champion','multi_city'], text:'多年以后再谈论{姓名}，人们也许会先数荣誉，再谈那些经典回合。但真正定义他的，是他怎样在{多城称谓}之间始终保持着同一种认真。奖杯会蒙尘，数据会被超越，而他留给每座城市的那段被认真对待的岁月不会。' },
    { tags:['defender'], text:'历史评价一名防守者时，常常会看盖帽、抢断和最佳防守阵容。而{姓名}留下了另一种东西：一种让对手在接球前就开始犹豫的名声。{防守荣誉}只是它的目录，真正的章节写在无数个被他改变的回合里。' },
    { tags:['playmaker','one_city'], text:'{首队}的球迷后来会这样向后辈介绍{姓名}：他不是得分最多的人，但他是让身边每个人都变得更好的人。传球、挡拆、一句暂停时的提醒，{赛季数}年里他一直在做同一件事——把个人变成团队。' },
    { tags:['default'], text:'时间最终会为{姓名}做出的评价，大概会落在一句很朴素的话上：他认认真真地打完了每一场。听起来简单，但在{赛季数}年里一直做到，本身就是一种了不起的传奇。' }
    ,
    { tags:['top_legacy','champion'], text:'多年以后，历史档案里会这样写{姓名}：他不是一夜成名的天才，却用{赛季数}年把自己修成了传奇。冠军是他履历上的高点，认真是他每一年的底色。' },
    { tags:['champion','one_city'], text:'{首队}的历史里，{姓名}是不可跳过的一章。后来的球迷读那一段时，会明白一座城市为什么愿意等那么久。' },
    { tags:['defender','champion'], text:'历史评价防守者，常看数据和荣誉；评价{姓名}时，人们会多看一眼录像。因为他让对手难受的样子，值得反复研究。' },
    { tags:['playmaker','one_city'], text:'{姓名}的遗产，不只是传球，而是一种篮球观念：让队友变得更好，才是比赛最深的意义。' },
    { tags:['scorer','champion'], text:'{姓名}的得分会写进数据册，但他的名字会写进更温暖的地方：那些因他而喜欢篮球的人心里。' },
    { tags:['no_ring','regret_star'], text:'历史没有给{姓名}一枚戒指，却给了他一个更持久的位置：人们谈论遗憾时，会想起他的坚持。' },
    { tags:['top_legacy'], text:'{历史档位}不是终点，而是{姓名}用{赛季数}年赢来的形容词。它背后是无数个无人看见的清晨。' },
    { tags:['champion','multi_city'], text:'多年以后，{多城称谓}的球迷仍然会争：{姓名}到底属于哪座城。这种争论，本身就是最好的赞美。' },
    { tags:['defender','no_ring'], text:'没有戒指的防守者，在历史里容易沉默。但{姓名}的录像会替他说话：每一个回合，他都没有放弃。' },
    { tags:['playmaker','late_peak'], text:'{姓名}的晚年传球，像他整个生涯的总结：不急、不贪、永远先看队友。历史记住了这份分寸。' },
    { tags:['scorer','late_peak'], text:'时间会冲淡很多数据，但{姓名}那些关键时刻的出手，会被球迷讲给下一代听。' },
    { tags:['default'], text:'历史给{姓名}的评价，可能会很简短：一个认真打球的球员。但那个词，他用{赛季数}年写成了重音。' },
    { tags:['champion','one_city'], text:'{首队}的队史里，{姓名}的章节没有华丽的标题，只有一行朴素的字：他让这座城市相信过。' },
    { tags:['top_legacy','defender'], text:'{历史档位}四个字，对{姓名}来说不是靠数据堆出来的，而是靠每场比赛都站在正确的位置挣来的。' },
    { tags:['playmaker','champion'], text:'冠军会过去，但{姓名}留下的传球理念会被一代代球员继承。那是比奖杯更长的遗产。' },
    { tags:['scorer','no_ring'], text:'历史会记录{姓名}的得分，也会记录他那些没有冠军的夜晚。两者加在一起，才是一个完整的他。' },
    { tags:['default'], text:'后来的人翻{姓名}的生涯，会发现没有太多戏剧性，却有一整排准时、认真、不抱怨的赛季。那已经很难得。' },
    { tags:['champion','late_peak'], text:'{姓名}的晚年冠军，让历史对他多写了一句：他的坚持，最终被时间回应。' },

    { tags:['playmaker','multi_city'], text:'{姓名}在{球队列表}留下的传球故事，让历史记住了一个道理：好的球员让队友变好。' },
    { tags:['scorer','one_city'], text:'{城市1}的篮球历史里，{姓名}的名字会和那些冠军并列。不是因为冠军，而是因为城市爱他。' },
    { tags:['top_legacy','scorer'], text:'{历史档位}对得分手的定义，常常是数据；对{姓名}的定义，却是稳定。他在{赛季数}年里几乎没有起伏。' },
    { tags:['no_ring','defender'], text:'历史没有给{姓名}戒指，却给了他一个位置：每个想学防守的年轻人，都会被推荐看他。' },
    { tags:['champion','playmaker'], text:'冠军记录会保留{姓名}的名字，但更衣室的历史会保留他的方式：先让队友发光，自己再去领奖。' },
    { tags:['late_peak'], text:'{姓名}的生涯后期，成了历史里最温柔的部分：他没有输给时间，而是和时间并肩走了很久。' },
    { tags:['default'], text:'{姓名}留给历史的东西，不只是数据，还有一种标准：职业球员可以怎样认真地过完一生。' },
    { tags:['champion','defender'], text:'历史评价冠军防守者时，会看他对比赛的影响。{姓名}的影响，写在每一个对手的犹豫里。' },
    { tags:['playmaker','no_ring'], text:'没有冠军的组织者，容易被历史忽略；但{姓名}让队友记住了他，于是历史也记住了他。' },
    { tags:['scorer','multi_city'], text:'{姓名}在不同城市留下的得分记忆，让历史难以用一支球队定义他。他属于很多地方的共同记忆。' },
    { tags:['top_legacy','champion'], text:'{历史档位}不是虚名，而是{姓名}用{赛季数}年、{场次}场一场一场打出来的结论。' },
    { tags:['one_city','champion'], text:'{首队}的球迷会向后辈这样介绍{姓名}：他把最好的年华留给了我们。' },

    { tags:['playmaker','champion'], text:'冠军赛季的{姓名}，被历史记住的不只是奖杯，还有他把每个人都放进战术里的方式。' },
    { tags:['default'], text:'{姓名}的历史地位，不需要用形容词堆砌：看一眼他的生涯，就知道认真两个字怎么写。' },
    { tags:['champion','scorer'], text:'历史会把{姓名}写进冠军球员的名单，而球迷会把他写进自己的青春。' },

    { tags:['defender','multi_city'], text:'历史里关于{姓名}的防守，散落在{球队列表}的录像中。每一段都在说同一件事：他从不缺席。' },
    { tags:['champion','playmaker'], text:'冠军记录会记住{姓名}的助攻，而更衣室会记住他的信任。两者都值得被写进历史。' },

function biographyTextsOverlap(a, b) {
  a = String(a || '');
  b = String(b || '');
  if (!a || !b) return false;
  var sentencesA = a.split(/[。！？；]/).map(function(s) { return s.trim(); }).filter(function(s) { return s.length >= 8; });
  var sentencesB = b.split(/[。！？；]/).map(function(s) { return s.trim(); }).filter(function(s) { return s.length >= 8; });
  for (var i = 0; i < sentencesA.length; i++) {
    for (var j = 0; j < sentencesB.length; j++) {
      if (sentencesA[i] === sentencesB[j]) return true;
      if (sentencesA[i].indexOf(sentencesB[j]) >= 0 || sentencesB[j].indexOf(sentencesA[i]) >= 0) return true;
    }
  }
  // 公共片段检测：覆盖“放进整段生涯看，”这类以逗号结尾、不构成完整句子的重复开头
  var short = a.length <= b.length ? a : b;
  var long = short === a ? b : a;
  var minLen = 8;
  for (var si = 0; si <= short.length - minLen; si++) {
    var frag = short.substr(si, minLen);
    if (long.indexOf(frag) >= 0) return true;
  }
  return false;
}

function biographyPickRule(section, tags, seed, salt, avoidTexts) {
  var list = CAREER_BIOGRAPHY_RULED_COPY[section] || CAREER_BIOGRAPHY_COPY[section] || [];
  if (!list.length) return '';
  var scored = list.map(function(entry, idx) {
    return { entry: entry, idx: idx, score: biographyEntryScore(entry, tags) };
  }).filter(function(item) { return item.score >= 0; });
  if (!scored.length) scored = list.map(function(entry, idx) { return { entry: entry, idx: idx, score: 0 }; });
  var best = Math.max.apply(null, scored.map(function(item) { return item.score; }));
  var pool = scored.filter(function(item) { return item.score >= best - 1; });
  var picked = pool[(seed + salt * 1103515245) % pool.length].entry;
  if (avoidTexts && avoidTexts.length) {
    for (var attempt = 0; attempt < pool.length; attempt++) {
      var candidateEntry = pool[(seed + salt * 1103515245 + attempt * 7919) % pool.length].entry;
      var candidateText = typeof candidateEntry === 'string' ? candidateEntry : (candidateEntry.text || '');
      var overlap = false;
      for (var ui = 0; ui < avoidTexts.length; ui++) {
        if (biographyTextsOverlap(candidateText, avoidTexts[ui])) { overlap = true; break; }
      }
      if (!overlap) { picked = candidateEntry; break; }
    }
  }
  return typeof picked === 'string' ? picked : (picked.text || '');
}

  // 3. 我的最后属性

  ctx.fillText('🏷️ 我的最后属性', cardX + 14, y + 8);

  var attrKeys2 = (SIM_CONFIG && SIM_CONFIG.ATTR_LIST) ? SIM_CONFIG.ATTR_LIST : [];
  var attrCN2 = (typeof window.attrCN === 'function') ? window.attrCN : function(k) { return k; };
  var aCols2 = 5, aGap2 = 3;
  var aW2 = (cardW - 32 - (aCols2 - 1) * aGap2) / aCols2, aH2 = 28;

  // 4. 生涯数据
  var cardH = 130;
  card(cardX, y, cardW, cardH);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = C.orange;
  ctx.font = '500 13px ' + C.fd;
  ctx.fillText('📊 生涯总数据', cardX + 14, y + 8);

  var statLabels = ['总出场', '总得分', '场均得分', '场均篮板', '场均助攻', '场均抢断'];
  var statVals = [tg, Math.round(ts.pts || 0), avg.pts, avg.reb, avg.ast, avg.stl];
  var sCols = 3, sGap = 5;
  var sW = (cardW - 32 - (sCols - 1) * sGap) / sCols, sH = 34;
  for (var si = 0; si < 6; si++) {
    var scol = si % sCols, srow = Math.floor(si / sCols);
    var sx = cardX + 14 + scol * (sW + sGap);

    ctx.fillStyle = C.text;
    ctx.font = '500 16px ' + C.fd;

  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = C.textDim;
  ctx.font = '400 10px ' + C.fb;
  ctx.fillText(fgm + '-' + fga + ' (' + pct + '%)、三分 ' + t3m + '-' + t3a + ' (' + threePct + '%)', cx, y + 30 + 2 * (sH + sGap) + 3);
  y += cardH + 6;

  // 5. 荣誉墙
  cardH = honorCardH;
  card(cardX, y, cardW, cardH);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = C.orange;
  ctx.font = '500 13px ' + C.fd;
  ctx.fillText('🏆 生涯纪录', cardX + 14, y + 8);
  for (var hri = 0; hri < honorRows.length; hri++) {
    fillCell(cardX + 14, y + 26 + hri * 20, cardW - 28, 18, 5);
    ctx.fillStyle = C.text;
    ctx.font = '500 10px ' + C.fd;
    ctx.fillText(honorRows[hri], cardX + 18, y + 26 + hri * 20 + 3);

  y += cardH + 6;

  ctx.fillStyle = C.orange;
  ctx.font = '500 13px ' + C.fd;

  if (retired && legacy) {

    var archInfo = archMatch.length > 0 ? archMatch[0] : null;
