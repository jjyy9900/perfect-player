<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">

/* ============================================================
   BuildPlayer — Mobile-First Game Edition
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
:root {
  --bg: #faf5eb;--bg-card: #fffaf2;--bg-card-hover: #fff5e8;--bg-elevated: #fff0e0;
  --border: #f0e0cc;--border-light: #e8d5bc;--text: #2d1f0e;--text-dim: #8a7a66;
  --text-muted: #baa992;--orange: #ff6b35;--orange-light: #ff8a5c;
  --orange-dim: rgba(255,107,53,0.1);--orange-bg: rgba(255,107,53,0.06);
  --red: #e63946;--gold: #f7a600;--green: #2ec4b6;
  --shadow: 0 2px 12px rgba(45,31,14,0.08);--shadow-lg: 0 4px 24px rgba(45,31,14,0.12);
  --radius: 16px;--radius-sm: 10px;--radius-xs: 6px;
  --font-display: 'Fredoka','Noto Sans SC',sans-serif;--font-body: 'Nunito','Noto Sans SC',sans-serif;
  --safe-t: env(safe-area-inset-top,0px);--safe-b: env(safe-area-inset-bottom,0px);
  --safe-l: env(safe-area-inset-left,0px);--safe-r: env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;padding:var(--safe-t) var(--safe-r) calc(32px+var(--safe-b)) var(--safe-l)}
.hl{color:var(--orange)}.gold{color:var(--gold)}.text-dim{color:var(--text-dim)}
.navbar{display:flex;align-items:center;justify-content:center;padding:14px 20px 10px;position:sticky;top:0;z-index:50;background:rgba(250,245,235,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.nav-logo{font-family:var(--font-display);font-size:clamp(17px,4.5vw,22px);font-weight:700;color:var(--text);letter-spacing:1px}
.nav-logo .hl{color:var(--orange);font-size:1.1em}.nav-pos-toggle,.nav-pos-btn{display:none}
.hp-brand{position:fixed;top:12px;right:12px;z-index:999;opacity:0.4;transition:opacity .2s;line-height:0}
.hp-brand:hover{opacity:1}.hp-brand img{width:28px;height:28px;border-radius:6px;display:block}
@media(max-width:560px){.hp-brand{top:10px;right:10px}.hp-brand img{width:24px;height:24px}}
.hero{text-align:center;padding:min(5vh,40px)20px 20px;position:relative}
.hero::after{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:200px;height:200px;background:radial-gradient(circle,rgba(255,107,53,0.06)0%,transparent 70%);pointer-events:none}
.hero-title{font-family:var(--font-display);font-size:clamp(11px,3vw,14px);color:var(--orange);font-weight:700;letter-spacing:3px;margin-bottom:6px;text-transform:uppercase}
.hero-headline{font-size:clamp(32px,8vw,48px);font-weight:700;line-height:1.1;font-family:var(--font-display);color:var(--text)}
.hero-headline .hl{color:var(--orange)}
.hero-desc{font-size:clamp(13px,3.5vw,16px);color:var(--text-dim);margin-top:10px;line-height:1.5;max-width:320px;margin-left:auto;margin-right:auto}
.feature-grid{display:flex;flex-direction:column;gap:12px;padding:8px 16px 20px}
.feature-card{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:24px 20px 20px;cursor:pointer;transition:all .15s;position:relative}
.feature-card:active{transform:scale(0.97)}.feature-card.selected{border-color:var(--orange);background:var(--orange-bg)}
.feature-card.disabled-card{opacity:.7;filter:grayscale(.3);cursor:default;pointer-events:none;border-style:dashed!important}
.feature-card .fc-tag{display:inline-block;font-family:var(--font-display);font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:10px}
.feature-card .fc-tag.gold{background:var(--orange-dim);color:var(--orange)}.feature-card .fc-tag.new{background:rgba(46,196,182,0.12);color:var(--green)}
.feature-card .fc-title{font-family:var(--font-display);font-size:26px;font-weight:700;margin-bottom:4px}
.feature-card .fc-sub{font-size:14px;color:var(--text-dim);margin-bottom:16px;line-height:1.5}
.feature-card .fc-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 24px;background:var(--orange);color:#fff;border:none;border-radius:12px;font-family:var(--font-display);font-size:15px;font-weight:600;cursor:pointer;transition:all .1s;width:100%;box-shadow:0 4px 0 #c94d1e,0 6px 12px rgba(255,107,53,0.25)}
.feature-card .fc-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c94d1e,0 3px 8px rgba(255,107,53,0.2)}
.feature-card .fc-btn:disabled{opacity:.4;box-shadow:none;transform:none}
.fc-footer{margin-top:10px;font-size:12px;color:var(--text-muted);text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:14px 24px;border:none;border-radius:12px;font-family:var(--font-display);font-size:15px;font-weight:600;cursor:pointer;transition:all .1s;min-height:48px;width:100%}
.btn:active{transform:scale(0.96)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 4px 0 #c94d1e,0 6px 12px rgba(255,107,53,0.2)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 #c94d1e,0 3px 8px rgba(255,107,53,0.15)}
.btn-secondary{background:var(--bg-card);color:var(--text);border:2px solid var(--border);box-shadow:0 3px 0 var(--border)}
.btn-secondary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--border)}
.btn-sm{padding:10px 16px;font-size:13px;width:auto;min-height:40px;border-radius:10px}
.btn-xs{padding:5px 12px;font-size:11px;width:auto;min-height:32px;border-radius:8px;font-family:var(--font-display);letter-spacing:.5px;border:2px solid var(--border);background:var(--bg-card);color:var(--text);cursor:pointer;transition:all .1s}
.btn-xs:active{transform:scale(0.95)}.btn-gold{background:var(--gold);color:#000;box-shadow:0 3px 0 #c48a00,0 4px 10px rgba(247,166,0,0.2)}
.btn-gold:active{transform:translateY(2px);box-shadow:0 1px 0 #c48a00,0 2px 6px rgba(247,166,0,0.15)}
.screen{display:none}.screen.active{display:block;animation:popIn .3s ease}
#screen-build.screen.active{display:flex!important;flex-direction:column;height:calc(100dvh - 32px - var(--safe-t) - var(--safe-b));overflow:hidden;position:relative}
#screen-career.screen.active{display:flex!important;flex-direction:column;min-height:calc(100dvh - 32px - var(--safe-t) - var(--safe-b))}
#screen-career.screen.active #career-area{flex:1;display:flex;flex-direction:column}
#screen-career.screen.active #career-area>div{flex:1;display:flex;flex-direction:column}
#screen-career.screen.active #career-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#screen-training.screen.active{display:flex!important;flex-direction:column;height:calc(100dvh - 32px - var(--safe-t) - var(--safe-b));overflow:hidden}
#screen-roster-review.screen.active{display:flex!important;flex-direction:column;height:calc(100dvh - 32px - var(--safe-t) - var(--safe-b));overflow:hidden}
@keyframes popIn{from{opacity:0;transform:scale(0.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,0.3)}50%{box-shadow:0 0 0 6px rgba(255,107,53,0)}}
.section-title{text-align:center;padding:12px 16px 8px}
.section-title h1{font-family:var(--font-display);font-size:clamp(18px,5vw,24px);font-weight:700;color:var(--text);display:inline-block;padding-bottom:8px;border-bottom:3px solid var(--orange)}
.section-title .sub{font-size:clamp(12px,3vw,14px);color:var(--text-dim);margin-top:4px}
#screen-position{text-align:center;padding:0 12px 20px}
.pos-grid{display:grid;grid-template-columns:1fr;gap:8px;padding:8px 16px 16px;max-width:360px;margin:0 auto}
.pos-card{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:18px 12px;text-align:center;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pos-card:active{transform:scale(0.95)}
.pos-card.selected{border-color:var(--orange);background:var(--orange-bg);box-shadow:0 0 0 1px var(--orange),var(--shadow)}
.pos-card .pos-label{font-family:var(--font-display);font-size:clamp(14px,3.5vw,18px);font-weight:700;display:block;margin-bottom:2px}
.pos-card .pos-en{font-family:var(--font-display);font-size:clamp(20px,5vw,28px);color:var(--orange);font-weight:700;display:block;letter-spacing:2px}
#screen-position .btn{max-width:280px;margin:8px auto 0}
#build-progress-area{flex-shrink:0}
.build-progress{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bg-card);border:2px solid var(--border);border-radius:12px;margin:0 10px 6px}
.progress-bar{flex:1;height:10px;background:var(--border);border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-light));border-radius:5px;transition:width .4s ease}
.progress-text{font-family:var(--font-display);font-size:18px;color:var(--orange);min-width:36px;text-align:right}
.build-split{display:flex;flex-direction:row;gap:8px;padding:0 8px;flex:1;min-height:0;align-items:stretch}
.build-left{width:130px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;min-height:0}
.bl-header{text-align:center;padding:8px 4px 6px;background:var(--bg-card);border:2px solid var(--border);border-radius:10px}
.bl-ovr{display:block;font-family:var(--font-display);font-size:clamp(28px,7vw,36px);font-weight:700;color:var(--orange);line-height:1}
.bl-label{font-family:var(--font-display);font-size:10px;color:var(--text-dim);letter-spacing:2px}
.bl-attrs{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ba-slot{display:flex;align-items:center;gap:3px;padding:6px 6px;background:var(--bg-card);border:2px solid var(--border);border-radius:8px;transition:all .15s;cursor:default;min-height:36px}
.ba-slot.locked{border-color:var(--gold);background:linear-gradient(135deg,rgba(247,166,0,0.06),rgba(247,166,0,0.02))}
.ba-slot.clickable{cursor:pointer}.ba-slot.clickable:hover{border-color:var(--orange);background:var(--orange-bg)}
.ba-slot.clickable:active{transform:scale(0.96)}
.ba-slot .ba-label{font-family:var(--font-display);font-size:10px;font-weight:600;color:var(--text-dim);min-width:20px}
.ba-slot .ba-grade{font-size:13px;font-weight:700;min-width:18px;text-align:center;font-family:var(--font-display)}
.ba-slot .ba-owner{font-size:8px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:right;padding-left:2px}
.ba-slot.locked .ba-owner{color:var(--gold);font-weight:700}.ba-slot .ba-empty{font-size:14px;color:var(--border);margin-left:auto}
.bl-footer{display:none}.team-logo{width:18px;height:18px;border-radius:4px;vertical-align:middle;object-fit:contain;flex-shrink:0}
.build-right{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
#br-slot-area{flex-shrink:0}#br-roster-area{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.br-slot-area{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px 10px;text-align:center}
.br-slot-label{font-family:var(--font-display);font-size:12px;color:var(--orange);font-weight:700;letter-spacing:1px;margin-bottom:8px}
.br-slot-wrapper{display:flex;justify-content:center}
.br-slot-machine{position:relative;width:100%;max-width:160px;background:#fff;border:3px solid var(--border);border-radius:12px;overflow:hidden;height:114px;box-shadow:inset 0 2px 12px rgba(0,0,0,0.04)}
.br-slot-machine::before{content:'';position:absolute;left:0;right:0;top:38px;height:38px;background:rgba(255,107,53,0.05);border-top:2px dashed var(--orange-dim);border-bottom:2px dashed var(--orange-dim);z-index:2;pointer-events:none}
.br-slot-reel{transition:transform 2.8s cubic-bezier(0.15,0.85,0.25,1);will-change:transform}
.br-slot-reel.spinning{transition:transform 2.8s cubic-bezier(0.1,0.7,0.1,1)}
.br-slot-item{height:38px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--text-dim);padding:0 10px;z-index:1}
.br-slot-item.highlight{color:var(--text);font-size:16px;font-weight:700}
/* 生涯球队老虎机 — 5项可见 */
.br-slot-machine.career-slot{height:190px}
.br-slot-machine.career-slot::before{top:76px}
.br-slot-machine.career-slot .br-slot-item.highlight{color:var(--text);font-size:16px;font-weight:700}
/* 自选球队弹窗 */
.team-picker-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;padding:12px;animation:fadeIn .2s ease;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.team-picker-modal{background:var(--bg);border:2px solid var(--border);border-radius:var(--radius);width:100%;max-width:400px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 8px 48px rgba(0,0,0,0.25);animation:slideUp .25s ease}
.team-picker-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.team-picker-header span{font-family:var(--font-display);font-size:16px;font-weight:700}
.team-picker-close{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg-card);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:all .1s}
.team-picker-close:active{border-color:var(--orange);color:var(--orange)}
.team-picker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.team-pick-card{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius-sm);padding:8px 4px;text-align:center;cursor:pointer;transition:all .12s;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:74px;justify-content:center}
.team-pick-card:active{transform:scale(0.95);border-color:var(--orange);background:var(--orange-bg)}
.team-pick-card img{display:block;width:32px;height:32px;object-fit:contain;border-radius:4px;margin-bottom:2px}
.team-pick-card .tpc-abbr{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--text);letter-spacing:1px}
.team-pick-card .tpc-name{font-family:var(--font-body);font-size:8px;color:var(--text-dim);line-height:1.2;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.br-slot-actions{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.br-slot-actions .slot-btn{font-family:var(--font-display);font-size:11px;font-weight:700;padding:7px 12px;border-radius:8px;border:2px solid var(--border);background:var(--bg-card);color:var(--text);cursor:pointer;transition:all .12s;min-height:36px;box-shadow:0 3px 0 var(--border)}
.br-slot-actions .slot-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--border)}
.br-slot-actions .slot-btn:disabled{opacity:.3;cursor:default;box-shadow:none}
#br-roster-area .br-roster-list{display:flex;flex-direction:column;gap:5px}
.br-player{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg-card);border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .12s;min-height:48px}
.br-player:active{transform:scale(0.97)}.br-player.selected{border-color:var(--orange);background:var(--orange-bg)}
.br-player .bp-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.br-player .bp-headshot{width:30px;height:30px;border-radius:50%;flex-shrink:0;border:2px solid var(--border)}
.br-player .bp-name{font-family:var(--font-display);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-player .bp-detail{font-family:var(--font-body);font-size:10px;color:var(--text-dim);font-weight:600}
.br-player .bp-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.br-player .bp-ovr{font-family:var(--font-display);font-size:18px;color:var(--text);line-height:1}
#build-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.build-toast-msg{background:var(--bg-card);border:2px solid var(--orange);border-radius:14px;padding:10px 20px;font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--text);animation:slideUp .25s ease,fadeOut .3s ease 1.2s forwards;box-shadow:var(--shadow-lg)}
@keyframes fadeOut{to{opacity:0;transform:translateY(-10px)}}
/* ── 揭幕逐项动效 ── */
@keyframes revealContent{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowPulse{0%,100%{text-shadow:0 0 20px rgba(255,107,53,0.3),0 0 40px rgba(255,107,53,0.1)}50%{text-shadow:0 0 30px rgba(255,107,53,0.6),0 0 60px rgba(255,107,53,0.2)}}
@keyframes cardUnfold{0%{max-height:0;opacity:0;transform:translateY(20px) scaleY(0.95)}100%{max-height:600px;opacity:1;transform:translateY(0) scaleY(1)}}
.rv-item{opacity:0;animation:revealContent 0.55s ease forwards}
.rv-ovr{animation:revealContent 0.55s ease forwards,glowPulse 3s ease-in-out infinite}
.rv-card-wrap{animation:cardUnfold 0.6s ease forwards;overflow:hidden}
#screen-reveal{padding:0 10px 20px;text-align:center}
.reveal-card{text-align:center;background:var(--bg-card);border:3px solid var(--border);border-radius:var(--radius);padding:24px 16px;margin:0 0 12px}
.reveal-card .reveal-label{font-family:var(--font-display);font-size:13px;color:var(--text-dim);margin-bottom:4px;letter-spacing:2px}
.reveal-card .big-cname{font-family:var(--font-display);font-size:clamp(28px,7vw,38px);font-weight:700;color:var(--text)}
.reveal-card .big-ovr{font-family:var(--font-display);font-size:clamp(60px,16vw,80px);font-weight:700;color:var(--orange);line-height:0.85;margin:6px 0}
.reveal-card .big-grade{display:none}
.reveal-card .big-pos{font-family:var(--font-display);font-size:clamp(14px,3.5vw,18px);color:var(--text-dim);margin-top:6px;letter-spacing:2px}
.reveal-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;padding:0 0 12px}
.reveal-stat{background:var(--bg-card);border:2px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center;opacity:0;animation:revealContent 0.45s ease forwards}
.reveal-stat .label{font-family:var(--font-display);font-size:9px;color:var(--text-dim);letter-spacing:.5px}
.reveal-stat .value{font-family:var(--font-display);font-size:20px;line-height:1;margin:2px 0}
.reveal-stat .num{font-size:10px;color:var(--text-dim);font-weight:600}
#screen-reveal .btn{max-width:280px;margin:12px auto 0}
.debug-btn{text-align:center;margin-top:16px}
.debug-btn button{background:var(--bg-card);border:none;color:var(--text-dim);padding:10px 18px;border-radius:12px;font-family:var(--font-display);font-size:12px;cursor:pointer}

.mc-stat-val{font-family:var(--font-display);font-size:20px;color:var(--text);line-height:1}
.mc-stat-lbl{font-family:var(--font-body);font-size:9px;color:var(--text-dim);margin-top:2px}
.mc-pct-line{font-family:var(--font-body);font-size:11px;color:var(--text-dim);text-align:center;padding:4px 0}
.mc-attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}
.mc-attr{background:var(--orange-bg);border-radius:6px;padding:4px 4px;text-align:center}
.mc-alabel{font-family:var(--font-display);font-size:8px;color:var(--text-dim);text-transform:uppercase}
.mc-aval{font-family:var(--font-display);font-size:14px}
.mc-awards{display:flex;gap:6px;flex-wrap:wrap}
.mc-chip{display:inline-block;padding:4px 10px;border-radius:20px;font-family:var(--font-display);font-size:11px;background:var(--bg-card);border:2px solid var(--border)}
.mc-chip-gold{border-color:var(--gold);color:var(--gold)}
.card-award{display:inline-block;padding:4px 10px;border-radius:8px;font-family:var(--font-display);font-size:12px;background:var(--orange-dim);color:var(--orange)}
    .dot-grid{display:block;padding:12px 16px;text-align:center;background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);margin:8px 0;line-height:1.8}
    .dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin:1px 2px;flex-shrink:0}
    .dot-w{background:#2ec4b6;box-shadow:0 1px 3px rgba(46,196,182,0.3)}
    .dot-l{background:#e63946;box-shadow:0 1px 3px rgba(230,57,70,0.3)}
    .dot-pending{background:var(--border-light);box-shadow:none}
    .dot-x{display:inline-block;width:14px;height:14px;line-height:14px;font-size:9px;text-align:center;border-radius:50%;background:var(--bg-surface);color:var(--text-dim);border:1px solid var(--border);margin:2px;vertical-align:middle;cursor:default;opacity:0.6}
    .awards-card{background:linear-gradient(170deg,#fffaf2 0%,#fff5e8 50%,#ffefe0 100%);border:2px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 8px 40px rgba(45,31,14,0.15);position:relative}
    .awards-card::before{content:'';position:absolute;top:-80px;right:-80px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,107,53,0.07) 0%,transparent 70%);pointer-events:none;border-radius:50%}
    .awards-card-header{background:linear-gradient(180deg,rgba(255,107,53,0.12) 0%,rgba(255,107,53,0.03) 100%);padding:24px 16px 16px;text-align:center;border-bottom:1px solid rgba(240,224,204,0.6);position:relative}
    .awards-card-header::after{content:'';position:absolute;bottom:-1px;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,var(--orange),transparent);border-radius:2px}
    .awards-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .3s ease;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    @keyframes flyInRight{from{opacity:0;transform:translateX(160px) scale(0.88)}to{opacity:1;transform:translateX(0) scale(1)}}
    .awards-badge{display:inline-block;padding:5px 18px;border-radius:20px;font-family:var(--font-display);font-size:13px;font-weight:700;background:linear-gradient(135deg,var(--orange),var(--orange-light));color:#fff;letter-spacing:1.5px;text-transform:uppercase;box-shadow:0 2px 8px rgba(255,107,53,0.25)}
    .awards-card-body{padding:20px 16px;text-align:center;position:relative}
    .awards-winner-label{font-size:11px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;font-weight:600;margin-bottom:2px}
    .awards-winner-name{font-family:var(--font-display);font-size:clamp(22px,5.5vw,28px);font-weight:800;color:var(--text);margin:2px 0 4px;line-height:1.15;letter-spacing:.5px}
    .awards-winner-name.hl{background:linear-gradient(135deg,var(--orange),#ff8a5c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .awards-team-line{font-size:13px;color:var(--text-dim);font-weight:600;margin-bottom:4px;letter-spacing:.5px}
    .awards-divider{width:40px;height:2px;background:linear-gradient(90deg,transparent,var(--orange),transparent);margin:10px auto;border-radius:2px}
    .awards-next{display:inline-flex;align-items:center;justify-content:center;padding:12px 36px;background:linear-gradient(135deg,var(--orange),var(--orange-light));color:#fff;border:none;border-radius:14px;font-family:var(--font-display);font-size:15px;font-weight:700;cursor:pointer;transition:all .12s;box-shadow:0 4px 0 #c94d1e,0 6px 16px rgba(255,107,53,0.3);min-width:140px;letter-spacing:.5px}
    .awards-next:active{transform:translateY(3px);box-shadow:0 1px 0 #c94d1e,0 3px 8px rgba(255,107,53,0.15)}
    .awards-next:disabled{opacity:.4;transform:none;box-shadow:none}
    .awards-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100dvh - 120px);position:relative;text-align:center;padding:16px 24px 20px}
    .awards-stage::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(255,107,53,0.06) 0%,transparent 60%);pointer-events:none;z-index:0}
    .awards-stage::after{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0}
    .awards-stage > *{position:relative;z-index:1}
    .awards-emoji{font-size:56px;display:block;margin-bottom:2px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.08))}
    .awards-headshot-box{width:72px;height:72px;border-radius:50%;margin:0 auto 8px;border:3px solid var(--gold);box-shadow:0 0 0 5px rgba(212,175,55,0.12),0 8px 24px rgba(0,0,0,0.08);background-size:cover;background-position:center}
    .awards-category{font-size:clamp(20px,5vw,28px);color:var(--text);letter-spacing:2px;font-weight:800;margin-bottom:2px;font-family:var(--font-display)}
    .awards-category .hl{color:var(--gold)}
    .awards-winner-big{font-size:clamp(30px,7vw,46px);font-weight:800;font-family:var(--font-display);color:var(--text);margin:4px 0 2px;line-height:1.12;letter-spacing:-0.5px}
    .awards-winner-big.hl{background:linear-gradient(135deg,#d4af37,#f7d44a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .awards-team-sub{font-size:14px;color:var(--text-dim);margin-bottom:2px;font-weight:600;letter-spacing:0.5px}
    .awards-line{width:56px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:12px auto;border-radius:2px}
    .awards-rank-label{font-size:11px;color:var(--text-muted);letter-spacing:4px;font-weight:600;text-transform:uppercase;margin-bottom:3px}
    .awards-rank-big{font-family:var(--font-display);font-size:clamp(36px,9vw,52px);font-weight:800;line-height:1;margin:2px 0 6px}
    .awards-rank-big.gold{background:linear-gradient(135deg,#d4af37,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .awards-rank-big.orange{color:var(--orange)}
    .awards-rank-big.dim{color:var(--text-dim)}
    .awards-flavor{font-size:13px;color:var(--text-muted);margin:0 0 18px;line-height:1.5;font-style:italic}
    .awards-list{display:flex;flex-direction:column;gap:3px;margin:4px 0}
    .awards-list-item{font-size:15px;font-weight:600;font-family:var(--font-display);color:var(--text);padding:3px 12px;background:rgba(212,175,55,0.06);border-radius:6px;margin:1px 0}
    .awards-list-item.my{background:rgba(255,107,53,0.1);color:var(--orange)}
    .awards-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 44px;background:linear-gradient(135deg,#d4af37,#f0c850);color:#1a1a1a;border:none;border-radius:50px;font-family:var(--font-display);font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #b8962e,0 6px 24px rgba(212,175,55,0.3);transition:all .1s;letter-spacing:.5px}
    .awards-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b8962e,0 3px 12px rgba(212,175,55,0.2)}
    @keyframes bounceInDown{from{opacity:0;transform:translateY(-40px) scale(0.85)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scaleInGlow{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
    @keyframes lineExpand{from{width:0;opacity:0}to{width:56px;opacity:1}}
    .awards-progress{display:flex;gap:8px;justify-content:center;margin-top:12px;padding:4px 0 0}
    .awards-progress-dot{width:6px;height:6px;border-radius:50%;background:var(--border);transition:all .4s ease}
    .awards-progress-dot.active{width:24px;border-radius:3px;background:linear-gradient(90deg,#d4af37,#f0c850)}
    .loading-balls{display:flex;gap:12px;align-items:center;justify-content:center}
    .loading-ball{width:16px;height:16px;border-radius:50%;background:var(--orange);animation:bounceBall .6s ease infinite alternate}
    .loading-ball:nth-child(2){animation-delay:.2s}
    .loading-ball:nth-child(3){animation-delay:.4s}
    @keyframes bounceBall{from{transform:translateY(0)}to{transform:translateY(-20px)}}
    @keyframes awardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .award-row{opacity:0;animation:awardIn .5s ease forwards;transition:transform .2s ease,box-shadow .2s ease;will-change:transform,opacity}
    .award-row:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(45,31,14,0.08)}
    .award-rank{font-size:15px;font-weight:800;line-height:1.2}
    .award-rank.gold{color:var(--gold)}
    .award-rank.orange{color:var(--orange)}
    .award-rank.dim{color:var(--text-dim)}
    .award-label{font-size:12px;font-weight:700;letter-spacing:0.3px;margin-bottom:1px}
    .award-winner{font-size:13px;font-weight:600;margin:1px 0 1px}
    .award-team{font-size:11px;color:var(--text-dim)}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .section-card{opacity:0;animation:fadeInUp .8s ease forwards}

    /* ── 生涯数据页 ── */
    .cs-section{margin-bottom:10px}
    .cs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
    .cs-stat{text-align:center;background:var(--orange-bg);border-radius:8px;padding:8px 4px}
    .cs-stat-val{font-family:var(--font-display);font-size:20px;color:var(--text);line-height:1}
    .cs-stat-lbl{font-family:var(--font-body);font-size:9px;color:var(--text-dim);margin-top:2px}
    .cs-season-row{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg-card);border:1.5px solid var(--border);border-radius:10px;margin-bottom:4px;cursor:pointer;transition:all .12s}
    .cs-season-row:active{transform:scale(0.97);border-color:var(--orange)}
    .cs-season-num{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--orange);min-width:52px}
    .cs-season-team{font-family:var(--font-display);font-size:13px;flex:1}
    .cs-season-record{font-size:12px;color:var(--text-dim);min-width:48px;text-align:center}
    .cs-season-pts{font-size:12px;color:var(--text-dim);min-width:50px;text-align:right}
    .cs-season-arrow{color:var(--text-muted);font-size:12px}
    .cs-season-detail-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease;backdrop-filter:blur(4px)}
    .cs-season-detail-modal{background:var(--bg);border:2px solid var(--border);border-radius:var(--radius);width:100%;max-width:380px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 48px rgba(0,0,0,0.25);animation:slideUp .25s ease}
    .cs-detail-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:1}
    .cs-detail-close{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg-card);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text-dim)}
    .cs-detail-close:active{border-color:var(--orange);color:var(--orange)}
    .cs-detail-body{padding:10px 14px 16px}

    /* ── 荣誉墙 ── */
    .ch-season{background:var(--bg-card);border:1.5px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
    .ch-season-header{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:6px}
    .ch-season-header .ch-team{font-size:12px;color:var(--text-dim);font-weight:400}
    .ch-badge{display:inline-block;padding:4px 10px;border-radius:8px;font-family:var(--font-display);font-size:12px;background:var(--orange-dim);color:var(--orange);margin:2px 3px}
    .ch-badge.gold{background:rgba(212,175,55,0.12);color:var(--gold)}
    .ch-summary{padding:12px;text-align:center;font-family:var(--font-display);font-size:13px;color:var(--text-dim);line-height:1.8}
    .ch-empty{text-align:center;padding:40px 20px;font-size:14px;color:var(--text-muted)}

    /* ── 训练营 ── */
    .tp-header{background:var(--bg-card);border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;text-align:center}
    .tp-points{font-family:var(--font-display);font-size:36px;color:var(--orange);font-weight:700}
    .tp-points-label{font-size:13px;color:var(--text-dim);margin-top:2px}
    .tp-sub{font-size:12px;color:var(--text-muted);margin-top:4px}
    .tp-section-title{font-family:var(--font-display);font-size:14px;color:var(--orange);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
    .tp-attrs{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
    .tp-row{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg-card);border:1.5px solid var(--border);border-radius:10px;transition:all .12s}
    .tp-row.tp-added{border-color:var(--orange);background:var(--orange-bg)}
    .tp-label{font-family:var(--font-display);font-size:11px;font-weight:600;min-width:36px;color:var(--text)}
    .tp-bar-wrap{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;position:relative}
    .tp-bar-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-light));border-radius:4px;transition:width .3s ease}
    .tp-bar-add{position:absolute;top:0;left:0;height:100%;background:var(--gold);border-radius:4px;transition:width .3s ease;opacity:0.6}
    .tp-val{font-family:var(--font-display);font-size:14px;font-weight:700;min-width:26px;text-align:center}
    .tp-val.tp-preview{color:var(--gold)}
    .tp-grade{font-size:10px;min-width:20px;text-align:center;color:var(--text-dim);font-weight:600}
    .tp-btn{width:36px;height:32px;border:none;border-radius:8px;background:var(--orange);color:#fff;cursor:pointer;font-size:16px;font-weight:700;transition:all .1s;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #c94d1e}
    .tp-btn:active{transform:translateY(1px);box-shadow:0 1px 0 #c94d1e}
    .tp-btn:disabled{opacity:.3;transform:none;box-shadow:none;cursor:default}
    .tp-actions{display:flex;gap:8px;margin-top:10px}
    .tp-actions .btn{max-width:200px}
    .tp-age-info{background:var(--bg-card);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--text-dim);line-height:1.6}
    .tp-age-info strong{color:var(--text)}
    /* ====== 球员档案库 ====== */
    .archive-list-overlay{position:fixed;inset:0;background:var(--bg);z-index:1100;display:flex;flex-direction:column;padding:14px 12px calc(24px + var(--safe-b));overflow:hidden}
    .archive-list-header{position:relative;display:flex;align-items:center;justify-content:center;max-width:560px;width:100%;margin:0 auto 10px;padding:0 56px;text-align:center}
    .archive-list-header .btn{position:absolute;left:0;top:50%;transform:translateY(-50%)}
    .archive-list-title{font-family:var(--font-display);font-size:clamp(28px,8vw,38px);font-weight:900;color:var(--text);line-height:1.1}
    .archive-list-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:560px;width:100%;margin:0 auto;padding:18px 12px 24px}
    .archive-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
    .archive-sort{flex:1;display:flex;gap:6px;overflow-x:auto}
    .archive-sort button{flex-shrink:0}
    .archive-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .archive-folder{--accent:#b39463;position:relative;z-index:1;cursor:pointer;min-height:170px;display:flex;flex-direction:column;align-items:center;padding:24px 8px 36px;border-radius:10px 10px 7px 7px;background:linear-gradient(168deg,#f0dfba 0%,#e4c99a 55%,#d2b07c 100%),radial-gradient(rgba(120,85,40,0.10) 1px,transparent 1.4px);background-size:100% 100%,5px 5px;border:1px solid #b39463;box-shadow:0 12px 20px rgba(30,18,6,0.32),inset 0 1px 0 rgba(255,255,255,0.4);transform:rotate(var(--rot,0deg));transition:transform .15s,box-shadow .15s}
    .archive-folder:active{transform:rotate(var(--rot,0deg)) scale(0.96)}
    .archive-folder::before{content:'';position:absolute;top:-7px;left:12px;right:12px;height:22px;background:linear-gradient(180deg,#eddcb6,#dfc291);border:1px solid var(--accent,#b39463);border-bottom:none;border-radius:9px 9px 0 0;box-shadow:0 -2px 5px rgba(80,55,20,0.10);z-index:2}
    .archive-folder::after{content:'';position:absolute;left:0;right:0;bottom:0;height:52px;background:linear-gradient(180deg,#d8ba88,#c6a26c);border-top:1px solid rgba(150,110,60,0.55);clip-path:polygon(0 0,33% 0,37% 14px,63% 14px,67% 0,100% 0,100% 100%,0 100%);box-shadow:inset 0 6px 10px rgba(80,55,20,0.08);z-index:1}
    .archive-folder .af-tab{position:absolute;top:-5px;left:16px;right:16px;height:20px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;letter-spacing:1px;color:#7a5a2e;z-index:3}
    .archive-folder .af-clasp{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e2c69a,#a98352 70%);border:1px solid #8d6c42;box-shadow:0 2px 3px rgba(0,0,0,0.28);z-index:3}
    .archive-folder .af-clasp::before{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);width:1px;height:8px;background:rgba(90,65,30,0.5)}
    .archive-folder .af-name{position:relative;z-index:2;font-family:var(--font-display);font-size:13px;font-weight:700;color:#5a3f1d;text-align:center;line-height:1.2;margin-top:2px;padding:4px 6px;background:rgba(255,252,245,0.55);border:1px dashed rgba(140,105,60,0.45);border-radius:4px;word-break:break-all;max-width:100%}
    .archive-folder .af-meta{position:relative;z-index:2;font-size:9px;color:#7a5a2e;text-align:center;margin-top:4px;letter-spacing:.3px}
    .archive-folder .af-teams{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;gap:2px;margin-top:6px;min-height:18px;flex-wrap:nowrap;max-width:100%}
    .archive-folder .af-stamp{position:absolute;right:7px;bottom:9px;z-index:3;font-size:8px;font-weight:700;padding:2px 6px;border-radius:4px;color:#8a2b23;border:1px solid #8a2b23;background:rgba(255,255,255,0.35);transform:rotate(-10deg)}
    .archive-empty{text-align:center;padding:48px 20px;color:var(--text-muted);font-size:13px}
    .archive-detail-overlay{position:fixed;inset:0;background:linear-gradient(180deg,#f4ead6 0%,#ead9bd 55%,#ddc49c 100%);z-index:1200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 12px calc(20px + var(--safe-b));overflow-y:auto}
    .archive-detail-header{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;color:var(--text);margin-bottom:10px;gap:10px}
    .archive-detail-name{font-family:var(--font-display);font-size:20px;font-weight:800;color:#4a3318}
    .archive-detail-meta{font-size:11px;color:#7a5a2e;margin-top:2px}
    .archive-detail-stage{width:auto;max-width:96vw;display:flex;align-items:center;justify-content:center;gap:8px}
    .archive-detail-img{max-width:calc(100vw - 104px);max-height:76vh;border-radius:10px;box-shadow:0 18px 50px rgba(80,55,20,0.35);touch-action:pan-y}
    .archive-detail-arrow{position:static;transform:none;z-index:3;background:rgba(90,65,30,0.22);color:#4a3318;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;flex-shrink:0}
    .archive-detail-dots{display:flex;gap:6px;margin-top:12px}
    .archive-detail-dots span{width:8px;height:8px;border-radius:50%;background:rgba(90,65,30,0.25)}
    .archive-detail-dots span.on{background:var(--orange)}
    .archive-detail-note{color:#7a5a2e;font-size:10px;margin-top:8px;text-align:center}
    .archive-back-btn{background:var(--bg-card);color:var(--text);border:1px solid var(--border)}
    .archive-del-btn{color:#a33;border-color:rgba(163,51,51,0.5)}
    .archive-detail-view{position:fixed;inset:0;z-index:1300;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(244,234,214,0.72);padding:44px 8px 18px;width:100%;overflow:hidden}
    .archive-open-splash{min-height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 16px 20px;text-align:center;background:linear-gradient(180deg,#f4ead6,#e2ccab)}
    .splash-folder{position:relative;width:220px;height:160px;background:linear-gradient(165deg,#ecd9b4,#d2b07c);border:1px solid #b39463;border-radius:8px 8px 14px 14px;box-shadow:0 18px 40px rgba(80,55,20,0.25);perspective:800px;animation:archiveFolderIn .5s ease both}
    .splash-folder::before{content:'';position:absolute;top:-16px;left:36px;right:36px;height:30px;background:#dfc291;border:1px solid #b39463;border-bottom:none;border-radius:10px 10px 0 0}
    .splash-folder .splash-paper{position:absolute;left:18px;right:18px;top:18px;height:118px;background:#fffaf0;border:1px solid rgba(140,105,60,0.35);border-radius:4px;box-shadow:0 6px 16px rgba(80,55,20,0.12);animation:archivePaperOut .6s .25s ease both}
    .splash-folder .splash-flap{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(180deg,#d8ba88,#c6a26c);border-top:1px solid rgba(150,110,60,0.55);transform-origin:bottom center;animation:archiveFlapOpen .55s .15s ease both;clip-path:polygon(0 0,33% 0,37% 12px,63% 12px,67% 0,100% 0,100% 100%,0 100%)}
    .splash-name{margin-top:22px;font-family:var(--font-display);font-size:26px;font-weight:900;color:#4a3318;animation:archiveStampIn .4s .45s ease both}
    .splash-sub{margin-top:6px;font-size:12px;color:#7a5a2e;animation:archiveStampIn .4s .55s ease both}
    @keyframes archiveFolderIn{from{opacity:0;transform:translateY(24px) scale(0.9)}to{opacity:1;transform:none}}
    @keyframes archiveFlapOpen{from{transform:rotateX(0)}to{transform:rotateX(-78deg)}}
    @keyframes archivePaperOut{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes archiveStampIn{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}
    @keyframes archivePaperIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  </style>

  var mvp = honors.filter(function(h) { return (h.label || '') === 'MVP'; }).length;

  var allNBA = cnt('最佳阵容');
  var allStar = cnt('全明星');

  var roty = cnt('最佳新秀');
  var teams = [];
  var teamYears = {};
  (c.seasons || []).forEach(function(se) {

  else if (championships === 1) add('champion', 5);
  if (mvp >= 2) add('star', 8 + mvp * 2 + allNBA);
  else if (mvp === 1) add('star', 5);
  else if (allNBA + allStar >= 8) add('star', 4);
  if (avgPts >= 27) add('scorer', 7);
  else if (avgPts >= 23) add('scorer', 4);
  if (avgAst >= 8) add('playmaker', 6);
  else if (avgAst >= 5) add('playmaker', 3);
  if (dpoy > 0) add('defender', 6);
  else if (avgStl + avgBlk >= 2.5) add('defender', 3);
